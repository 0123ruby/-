<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>誤會機器｜聲波與攝像頭擾動模擬</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  overflow:hidden;

  background:#f1eee7;
  color:#303633;

  font-family:
  "Microsoft JhengHei",
  "Noto Sans TC",
  sans-serif;
}


/* =========================
   整體
========================= */

#app{
  width:100%;
  height:100vh;

  display:grid;

  grid-template-columns:
  minmax(0,1fr)
  350px;
}


/* =========================
   左側作品區
========================= */

#stageWrap{
  position:relative;
  overflow:hidden;

  background:
  radial-gradient(
    circle at 50% 45%,
    #faf9f6 0%,
    #eeeae2 63%,
    #e5e0d7 100%
  );
}


#stage{
  display:block;

  width:100%;
  height:100%;

  cursor:pointer;
}


/* =========================
   標題
========================= */

#title{
  position:absolute;

  left:28px;
  top:24px;

  pointer-events:none;
}


#title h1{
  margin:0;

  font-size:27px;
}


#title p{
  margin:7px 0 0;

  font-size:13px;

  color:#6b746f;
}


/* =========================
   提示
========================= */

#hint{
  position:absolute;

  left:28px;
  bottom:24px;

  max-width:680px;

  padding:10px 14px;

  background:
  rgba(255,255,255,.88);

  border:
  1px solid rgba(0,0,0,.05);

  border-radius:10px;

  font-size:13px;
  line-height:1.65;

  pointer-events:none;
}


/* =========================
   右側
========================= */

#panel{
  padding:20px;

  overflow-y:auto;

  background:#fbfaf7;

  border-left:
  1px solid #ddd8ce;
}


.section{
  margin-bottom:22px;
}


.sectionTitle{
  margin-bottom:10px;

  font-size:13px;
  font-weight:700;

  color:#414743;
}


/* =========================
   攝像頭
========================= */

video{
  display:block;

  width:100%;

  min-height:145px;

  object-fit:cover;

  background:#111;

  border-radius:8px;

  transform:
  scaleX(-1);
}


/* =========================
   按鈕
========================= */

button{
  width:100%;

  margin:0 0 8px;

  padding:11px;

  border:none;

  border-radius:9px;

  font-weight:700;

  cursor:pointer;
}


button.dark{
  background:#222;

  color:#fff;
}


button.light{
  background:#e6e2da;

  color:#333;
}


button.gray{
  background:#d3d0c9;

  color:#333;
}


/* =========================
   狀態
========================= */

.status{
  padding:11px;

  background:#fff;

  border:
  1px solid #dfdbd2;

  border-radius:8px;

  font-size:12px;

  line-height:1.8;
}


/* =========================
   音量條
========================= */

.meter{
  height:8px;

  margin-top:8px;

  overflow:hidden;

  background:#e1ddd5;

  border-radius:999px;
}


#voiceMeter{
  width:0%;
  height:100%;

  background:#303532;

  transition:
  width .06s linear;
}


/* =========================
   Camera movement bar
========================= */

#cameraMeter{
  width:0%;
  height:100%;

  background:#555b57;

  transition:
  width .06s linear;
}


/* =========================
   Slider
========================= */

label{
  display:block;

  margin:12px 0 5px;

  font-size:12px;
}


input[type="range"]{
  width:100%;
}


.small{
  margin-top:8px;

  font-size:11px;
  line-height:1.55;

  color:#777;
}

</style>
</head>


<body>


<div id="app">


<!-- =====================================
     LEFT
===================================== -->

<div id="stageWrap">


<canvas id="stage"></canvas>


<div id="title">

  <h1>
    《誤會機器》
  </h1>

  <p>
    移動造成擾動 × 聲音形成訊號 × 傳遞逐漸失真
  </p>

</div>


<div id="hint">

  攝像頭與麥克風可以分開使用。
  只開攝像頭時，你的移動就會擾動五支裝置；
  開啟麥克風後，聲音會轉化成波形，從你選擇的裝置開始向其他裝置傳遞。

</div>


</div>



<!-- =====================================
     RIGHT
===================================== -->

<aside id="panel">


<!-- CAMERA -->

<div class="section">

  <div class="sectionTitle">
    攝像頭
  </div>


  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <br>


  <button
    id="cameraBtn"
    class="dark">

    開啟攝像頭

  </button>


  <div class="status">

    攝像頭：

    <b id="cameraState">
      未啟動
    </b>

    <br>

    動作擾動：

    <b>
      <span id="cameraPercent">
        0
      </span>%
    </b>


    <div class="meter">

      <div id="cameraMeter"></div>

    </div>

  </div>

</div>



<!-- MIC -->

<div class="section">

  <div class="sectionTitle">
    聲音互動
  </div>


  <div
    id="selectedStatus"
    class="status">

    目前說話對象：
    <b>第 3 支</b>

  </div>


  <br>


  <button
    id="micBtn"
    class="dark">

    開啟麥克風

  </button>


  <button
    id="micStopBtn"
    class="light">

    停止麥克風

  </button>


  <div class="status">

    麥克風：

    <b id="micState">
      未啟動
    </b>

    <br>

    聲音強度：

    <b>
      <span id="voicePercent">
        0
      </span>%
    </b>


    <div class="meter">

      <div id="voiceMeter"></div>

    </div>

  </div>


  <div class="small">

    螢幕不辨識文字，只顯示聲音本身的波形。
    距離聲音來源越遠，訊號會越失真。

  </div>

</div>



<!-- SETTINGS -->

<div class="section">

  <div class="sectionTitle">
    系統設定
  </div>


  <label>

    攝像頭敏感度：

    <span id="sensitivityValue">
      40
    </span>

  </label>


  <input
    id="sensitivitySlider"
    type="range"
    min="5"
    max="80"
    value="40"
  >



  <label>

    攝像頭擾動強度：

    <span id="cameraStrengthValue">
      75
    </span>%

  </label>


  <input
    id="cameraStrengthSlider"
    type="range"
    min="0"
    max="100"
    value="75"
  >



  <label>

    每支訊號傳遞延遲：

    <span id="delayValue">
      500
    </span> ms

  </label>


  <input
    id="delaySlider"
    type="range"
    min="150"
    max="1200"
    step="50"
    value="500"
  >



  <label>

    聲波失真：

    <span id="distortionValue">
      55
    </span>%

  </label>


  <input
    id="distortionSlider"
    type="range"
    min="0"
    max="100"
    value="55"
  >

</div>



<!-- STATUS -->

<div class="section">

  <div class="sectionTitle">
    系統狀態
  </div>


  <div
    id="systemStatus"
    class="status">

    系統待機中

  </div>

</div>



<button
  id="resetBtn"
  class="gray">

  重設裝置狀態

</button>


</aside>

</div>



<!-- =====================================
     CAMERA ANALYSIS
===================================== -->

<canvas
  id="cameraAnalysis"
  width="160"
  height="120"
  style="display:none;">
</canvas>



<script>

/* ==========================================================
   DOM
========================================================== */

const canvas =
  document.getElementById(
    "stage"
  );


const ctx =
  canvas.getContext(
    "2d"
  );


const video =
  document.getElementById(
    "video"
  );


const cameraAnalysis =
  document.getElementById(
    "cameraAnalysis"
  );


const cameraCtx =
  cameraAnalysis.getContext(

    "2d",

    {
      willReadFrequently:true
    }

  );



/* ==========================================================
   BASIC
========================================================== */

const DEVICE_COUNT = 5;


let W = 0;

let H = 0;


let selectedIndex = 2;


let propagationDelay = 500;


let distortionStrength = .55;


let cameraInfluenceStrength = .75;



/* ==========================================================
   CAMERA
========================================================== */

let cameraStream = null;


let cameraReady = false;


let previousCameraFrame = null;



const viewer = {

  present:false,

  movement:0,

  movementX:.5,

  absentTime:0,

  sensitivity:40

};



/* ==========================================================
   MICROPHONE
========================================================== */

let micStream = null;


let audioContext = null;


let analyser = null;


let microphoneSource = null;


let waveformBuffer = null;


let micReady = false;


let voiceLevel = 0;


const audioHistory = [];


let lastAudioCapture = 0;



/* ==========================================================
   SYSTEM
========================================================== */

let globalChaos = 0;


const devices = [];



/* ==========================================================
   DEVICE
========================================================== */

class Device{


constructor(index){


  this.index =
  index;


  this.yaw =

  random(
    -7,
    7
  );


  this.targetYaw =
  this.yaw;


  this.memoryYaw =

  random(
    -5,
    5
  );


  this.phase =

  random(
    0,
    Math.PI * 2
  );


  this.activity =
  .03;


  this.responseWeight =

  random(
    .85,
    1.15
  );


  this.neighborWeight =

  random(
    .18,
    .32
  );


  this.memoryWeight =

  random(
    .08,
    .18
  );

}



/* ==========================================================
   NEIGHBOR
========================================================== */

getNeighborYaw(){


  let sum = 0;

  let count = 0;


  if(
    this.index > 0
  ){


    sum +=

    devices[
      this.index - 1
    ].yaw;


    count++;

  }


  if(
    this.index <
    DEVICE_COUNT - 1
  ){


    sum +=

    devices[
      this.index + 1
    ].yaw;


    count++;

  }


  return count > 0

  ?

  sum /
  count

  :

  this.yaw;

}



/* ==========================================================
   UPDATE
========================================================== */

update(now){


  /* -------------------------------
     聲音來源距離
  ------------------------------- */

  const audioDistance =

  Math.abs(

    this.index -
    selectedIndex

  );



  const delayedAudio =

  getDelayedAudio(

    now

    -

    audioDistance *
    propagationDelay

  );



  const localVoice =

  delayedAudio

  ?

  levelFromRms(
    delayedAudio.rms
  )

  :

  0;



  /* -------------------------------
     攝像頭空間位置

     0 = 左
     1 = 右
  ------------------------------- */

  const rodPosition =

  this.index

  /

  (
    DEVICE_COUNT - 1
  );



  const spatialDistance =

  Math.abs(

    rodPosition

    -

    viewer.movementX

  );



  /*
    人的動作在哪一側，
    那一側的棒子受到比較強擾動。

    但並不是直接控制旋轉方向。
  */

  const spatialWeight =

  constrain(

    1

    -

    spatialDistance /
    .70,

    0,
    1

  );



  /* -------------------------------
     CAMERA STRENGTH

     即使沒開麥克風，
     這個值一樣存在。
  ------------------------------- */

  let cameraStrength = 0;


  if(
    viewer.present
  ){


    cameraStrength =

    constrain(

      .25

      +

      viewer.movement *
      18,

      0,
      1

    );



    cameraStrength *=

    (
      .35

      +

      spatialWeight *
      .65
    );



    cameraStrength *=

    cameraInfluenceStrength;

  }



  /* -------------------------------
     CAMERA MOTION

     完全獨立於麥克風
  ------------------------------- */

  const cameraMotion =

  (
    noise1D(

      now * .0017

      +

      this.index * 7.8

    )

    -

    .5

  )

  *

  2

  *

  48

  *

  cameraStrength

  *

  this.responseWeight;



  /* -------------------------------
     讓人的位置稍微形成空間偏差

     不是直接跟著人轉。
  ------------------------------- */

  const spatialBias =

  (
    viewer.movementX
    -
    .5
  )

  *

  14

  *

  cameraStrength

  *

  (
    .4
    +
    spatialWeight * .6
  );



  /* -------------------------------
     聲音造成的轉動
  ------------------------------- */

  const voiceMotion =

  Math.sin(

    now / 420

    +

    this.phase

  )

  *

  48

  *

  localVoice

  *

  this.responseWeight;



  /* -------------------------------
     GROUP WAVE
  ------------------------------- */

  const groupWave =

  Math.sin(

    now / 820

    +

    this.phase * 1.8

  )

  *

  13

  *

  globalChaos;



  /* -------------------------------
     INDIVIDUAL NOISE
  ------------------------------- */

  const individualNoise =

  (
    noise1D(

      now * .0021

      +

      this.index * 21

    )

    -

    .5

  )

  *

  2

  *

  18

  *

  (
    .10

    +

    cameraStrength * .45

    +

    localVoice * .55

    +

    globalChaos * .3
  );



  /* -------------------------------
     IDLE
  ------------------------------- */

  const idleMotion =

  Math.sin(

    now / 2600

    +

    this.phase

  )

  *

  2.5;



  /* -------------------------------
     NEIGHBOR
  ------------------------------- */

  const neighborYaw =

  this.getNeighborYaw();



  /* -------------------------------
     TARGET
  ------------------------------- */

  this.targetYaw =

  neighborYaw *
  this.neighborWeight

  +

  this.memoryYaw *
  this.memoryWeight

  +

  cameraMotion

  +

  spatialBias

  +

  voiceMotion

  +

  groupWave

  +

  individualNoise

  +

  idleMotion;



  this.targetYaw =

  constrain(

    this.targetYaw,

    -68,
    68

  );



  /* -------------------------------
     SPEED

     Camera 本身也能提高速度
  ------------------------------- */

  let speed =

  .022

  +

  cameraStrength *
  .055

  +

  localVoice *
  .070

  +

  globalChaos *
  .018;



  /*
    聲音傳遞距離越遠，
    聲音反應稍慢。

    但攝像頭反應不受這個限制。
  */

  if(
    localVoice > 0
  ){


    speed *=

    Math.max(

      .62,

      1

      -

      audioDistance *
      .11

    );

  }



  this.yaw =

  lerp(

    this.yaw,

    this.targetYaw,

    speed

  );



  /* -------------------------------
     ACTIVITY
  ------------------------------- */

  this.activity =

  lerp(

    this.activity,

    constrain(

      cameraStrength

      +

      localVoice

      +

      globalChaos *
      .25,

      0,
      1

    ),

    .07

  );



  /* -------------------------------
     MEMORY
  ------------------------------- */

  this.memoryYaw =

  lerp(

    this.memoryYaw,

    this.yaw,

    .0018

  );

}


}



/* ==========================================================
   INIT
========================================================== */

function resetDevices(){


  devices.length =
  0;


  for(
    let i = 0;
    i < DEVICE_COUNT;
    i++
  ){


    devices.push(

      new Device(i)

    );

  }


  globalChaos =
  0;

}


resetDevices();



/* ==========================================================
   RESIZE
========================================================== */

function resizeCanvas(){


  const rect =

  canvas
  .parentElement
  .getBoundingClientRect();



  W =
  rect.width;


  H =
  rect.height;



  canvas.width =

  Math.round(

    W *
    devicePixelRatio

  );


  canvas.height =

  Math.round(

    H *
    devicePixelRatio

  );



  canvas.style.width =

  W +
  "px";


  canvas.style.height =

  H +
  "px";



  ctx.setTransform(

    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0

  );

}


window.addEventListener(

  "resize",

  resizeCanvas

);


resizeCanvas();



/* ==========================================================
   POSITION
========================================================== */

function getDevicePosition(index){


  return{

    x:

    mapValue(

      index,

      0,
      DEVICE_COUNT - 1,

      W * .17,
      W * .83

    ),


    y:

    H * .51

  };

}



/* ==========================================================
   CLICK
========================================================== */

canvas.addEventListener(

  "click",

  event => {


    const rect =

    canvas
    .getBoundingClientRect();



    const mx =

    event.clientX

    -

    rect.left;



    const my =

    event.clientY

    -

    rect.top;



    let chosen = -1;

    let closest =
    Infinity;



    for(
      let i = 0;
      i < DEVICE_COUNT;
      i++
    ){


      const p =

      getDevicePosition(i);



      const dx =

      mx -
      p.x;


      const dy =

      my -
      p.y;



      const d =

      Math.sqrt(

        dx * dx

        +

        dy * dy

      );



      if(

        d <
        135

        &&

        d <
        closest

      ){


        closest =
        d;


        chosen =
        i;

      }

    }



    if(
      chosen >=
      0
    ){


      selectedIndex =
      chosen;

    }

  }

);



/* ==========================================================
   CAMERA START
========================================================== */

async function startCamera(){


  try{


    if(

      !navigator.mediaDevices

      ||

      !navigator.mediaDevices.getUserMedia

    ){


      throw new Error(

        "目前瀏覽器無法使用攝像頭"

      );

    }



    cameraStream =

    await navigator
    .mediaDevices
    .getUserMedia({

      video:{

        width:{
          ideal:640
        },

        height:{
          ideal:480
        },

        facingMode:"user"

      },

      audio:false

    });



    video.srcObject =

    cameraStream;



    await video.play();



    cameraReady =
    true;



    previousCameraFrame =
    null;



    document
    .getElementById(
      "cameraBtn"
    )
    .textContent =

    "攝像頭已開啟";



    document
    .getElementById(
      "cameraState"
    )
    .textContent =

    "已啟動";


  }
  catch(error){


    cameraReady =
    false;



    console.error(
      error
    );



    document
    .getElementById(
      "cameraState"
    )
    .textContent =

    "啟動失敗：" +
    error.name;



    alert(

      "攝像頭沒有成功開啟。\n\n"

      +

      error.name

    );

  }

}



document
.getElementById(
  "cameraBtn"
)
.addEventListener(

  "click",

  startCamera

);



/* ==========================================================
   CAMERA ANALYSIS
========================================================== */

function analyzeCamera(){


  if(

    !cameraReady

    ||

    video.readyState <
    2

  ){


    return;

  }



  cameraCtx.drawImage(

    video,

    0,
    0,

    cameraAnalysis.width,
    cameraAnalysis.height

  );



  const frame =

  cameraCtx
  .getImageData(

    0,
    0,

    cameraAnalysis.width,
    cameraAnalysis.height

  )
  .data;



  if(
    !previousCameraFrame
  ){


    previousCameraFrame =

    new Uint8ClampedArray(

      frame

    );


    return;

  }



  let changed =
  0;


  let xTotal =
  0;


  let checked =
  0;



  const width =

  cameraAnalysis.width;


  const height =

  cameraAnalysis.height;



  const threshold =

  mapValue(

    viewer.sensitivity,

    5,
    80,

    85,
    18

  );



  for(

    let y = 0;
    y < height;
    y += 4

  ){


    for(

      let x = 0;
      x < width;
      x += 4

    ){


      const index =

      (
        y *
        width

        +

        x
      )

      *
      4;



      const difference =

      Math.abs(

        frame[index]

        -

        previousCameraFrame[index]

      )

      +

      Math.abs(

        frame[index + 1]

        -

        previousCameraFrame[index + 1]

      )

      +

      Math.abs(

        frame[index + 2]

        -

        previousCameraFrame[index + 2]

      );



      checked++;



      if(
        difference >
        threshold
      ){


        changed++;


        xTotal +=
        x;

      }

    }

  }



  previousCameraFrame =

  new Uint8ClampedArray(

    frame

  );



  const ratio =

  changed

  /

  Math.max(

    1,

    checked

  );



  /*
    放大動作量。
  */

  viewer.movement =

  lerp(

    viewer.movement,

    constrain(

      ratio *
      2.4,

      0,
      1

    ),

    .30

  );



  /*
    找主要動作在哪一側。
  */

  if(
    changed > 0
  ){


    let averageX =

    xTotal /
    changed;



    /*
      video 是鏡像顯示，
      所以分析結果反轉一次，
      才會跟你看到的畫面一致。
    */

    averageX =

    width -
    averageX;



    viewer.movementX =

    lerp(

      viewer.movementX,

      averageX /
      width,

      .28

    );

  }



  /*
    有明顯畫面變化
  */

  if(
    ratio >
    .006
  ){


    viewer.present =
    true;


    viewer.absentTime =
    0;

  }
  else{


    viewer.absentTime +=
    100;



    /*
      5秒沒有動才慢慢視為離開，
      避免你稍微停下棒子就立刻停止。
    */

    if(
      viewer.absentTime >
      5000
    ){


      viewer.present =
      false;

    }

  }

}



/* ==========================================================
   MICROPHONE
========================================================== */

async function startMicrophone(){


  try{


    if(

      !navigator.mediaDevices

      ||

      !navigator.mediaDevices.getUserMedia

    ){


      throw new Error(

        "目前瀏覽器無法使用麥克風"

      );

    }



    if(
      micReady
    ){


      return;

    }



    micStream =

    await navigator
    .mediaDevices
    .getUserMedia({

      audio:{

        echoCancellation:true,

        noiseSuppression:false,

        autoGainControl:false

      },

      video:false

    });



    const AudioCtx =

    window.AudioContext

    ||

    window.webkitAudioContext;



    audioContext =

    new AudioCtx();



    if(

      audioContext.state ===
      "suspended"

    ){


      await audioContext.resume();

    }



    analyser =

    audioContext
    .createAnalyser();



    analyser.fftSize =
    1024;



    analyser.smoothingTimeConstant =
    .18;



    waveformBuffer =

    new Uint8Array(

      analyser.fftSize

    );



    microphoneSource =

    audioContext
    .createMediaStreamSource(

      micStream

    );



    /*
      不接到喇叭，
      避免聽到自己造成回授。
    */

    microphoneSource.connect(

      analyser

    );



    micReady =
    true;



    document
    .getElementById(
      "micBtn"
    )
    .textContent =

    "麥克風已開啟";



    document
    .getElementById(
      "micState"
    )
    .textContent =

    "已啟動";


  }
  catch(error){


    micReady =
    false;



    console.error(
      error
    );



    document
    .getElementById(
      "micState"
    )
    .textContent =

    "啟動失敗：" +
    error.name;



    alert(

      "麥克風沒有成功開啟。\n\n"

      +

      error.name

    );

  }

}



async function stopMicrophone(){


  if(
    micStream
  ){


    micStream
    .getTracks()
    .forEach(

      track =>

      track.stop()

    );

  }



  micStream =
  null;



  if(
    microphoneSource
  ){


    try{


      microphoneSource.disconnect();

    }
    catch(error){}

  }



  microphoneSource =
  null;



  if(
    audioContext
  ){


    try{


      await audioContext.close();

    }
    catch(error){}

  }



  audioContext =
  null;


  analyser =
  null;


  waveformBuffer =
  null;


  micReady =
  false;


  voiceLevel =
  0;


  audioHistory.length =
  0;



  document
  .getElementById(
    "micBtn"
  )
  .textContent =

  "開啟麥克風";



  document
  .getElementById(
    "micState"
  )
  .textContent =

  "未啟動";

}



document
.getElementById(
  "micBtn"
)
.addEventListener(

  "click",

  startMicrophone

);



document
.getElementById(
  "micStopBtn"
)
.addEventListener(

  "click",

  stopMicrophone

);



/* ==========================================================
   AUDIO CAPTURE
========================================================== */

function captureAudio(now){


  if(

    !micReady

    ||

    !analyser

    ||

    !waveformBuffer

  ){


    voiceLevel =

    lerp(

      voiceLevel,

      0,

      .08

    );


    return;

  }



  if(

    now -
    lastAudioCapture <
    35

  ){


    return;

  }



  lastAudioCapture =
  now;



  analyser
  .getByteTimeDomainData(

    waveformBuffer

  );



  const sampleCount =
  128;



  const samples =

  new Float32Array(

    sampleCount

  );



  let sumSquares =
  0;



  for(

    let i = 0;
    i < sampleCount;
    i++

  ){


    const sourceIndex =

    Math.floor(

      i

      *

      (
        waveformBuffer.length -
        1
      )

      /

      (
        sampleCount -
        1
      )

    );



    const value =

    (
      waveformBuffer[sourceIndex]

      -

      128

    )

    /

    128;



    samples[i] =
    value;



    sumSquares +=

    value *
    value;

  }



  const rms =

  Math.sqrt(

    sumSquares /
    sampleCount

  );



  const currentLevel =

  levelFromRms(

    rms

  );



  voiceLevel =

  lerp(

    voiceLevel,

    currentLevel,

    .36

  );



  audioHistory.push({

    time:now,

    rms:rms,

    samples:samples

  });



  const cutoff =

  now -
  8000;



  while(

    audioHistory.length >
    0

    &&

    audioHistory[0].time <
    cutoff

  ){


    audioHistory.shift();

  }

}



function levelFromRms(rms){


  return constrain(

    (
      rms -
      .007
    )

    *
    17,

    0,
    1

  );

}



/* ==========================================================
   DELAY AUDIO
========================================================== */

function getDelayedAudio(targetTime){


  if(
    audioHistory.length ===
    0
  ){


    return null;

  }



  if(

    targetTime <
    audioHistory[0].time

  ){


    return null;

  }



  for(

    let i =
    audioHistory.length - 1;

    i >= 0;

    i--

  ){


    if(

      audioHistory[i].time
      <=
      targetTime

    ){


      return audioHistory[i];

    }

  }



  return null;

}



/* ==========================================================
   GLOBAL
========================================================== */

function updateGlobalState(){


  /*
    攝像頭本身就是獨立的擾動來源。
  */

  const cameraDisturbance =

  cameraReady

  ?

  constrain(

    viewer.movement *
    7

    +

    (
      viewer.present
      ?
      .15
      :
      0
    ),

    0,
    1

  )

  :

  0;



  /*
    麥克風是另一個獨立來源。
  */

  const soundDisturbance =

  micReady

  ?

  voiceLevel

  :

  0;



  /*
    兩者任一個存在，
    都可以讓系統運作。

    不需要同時開。
  */

  const targetChaos =

  constrain(

    cameraDisturbance *
    .75

    +

    soundDisturbance *
    .70,

    0,
    1

  );



  globalChaos =

  lerp(

    globalChaos,

    targetChaos,

    targetChaos >
    globalChaos

    ?

    .065

    :

    .014

  );

}



/* ==========================================================
   DRAW GROUND
========================================================== */

function drawGround(){


  const floorY =

  H *
  .755;



  ctx.strokeStyle =

  "rgba(45,49,48,.08)";


  ctx.lineWidth =
  1;



  ctx.beginPath();



  ctx.moveTo(

    45,

    floorY

  );



  ctx.lineTo(

    W -
    45,

    floorY

  );



  ctx.stroke();

}



/* ==========================================================
   DRAW DEVICE
========================================================== */

function drawDevice(
  device,
  now
){


  const p =

  getDevicePosition(

    device.index

  );



  const bodyHeight =

  Math.min(

    390,

    H * .48

  );



  /*
    細長黑棒
  */

  const frontWidth =
  20;



  const yawRad =

  device.yaw

  *

  Math.PI

  /

  180;



  const visibleWidth =

  11

  +

  9

  *

  Math.abs(

    Math.cos(
      yawRad
    )

  );



  /*
    攝像頭和螢幕一起固定在棒子正面。

    整支棒子旋轉時，
    它們一起繞著圓柱走。
  */

  const surfaceX =

  Math.sin(
    yawRad
  )

  *

  visibleWidth *
  .57;



  const facing =

  .24

  +

  .76

  *

  Math.abs(

    Math.cos(
      yawRad
    )

  );



  ctx.save();



  ctx.translate(

    p.x,

    p.y

  );



  /* =========================
     黑棒
  ========================= */

  ctx.shadowBlur =

  7

  +

  device.activity *
  14;



  ctx.shadowColor =

  "rgba(0,0,0,.24)";



  const gradient =

  ctx.createLinearGradient(

    -visibleWidth / 2,

    0,

    visibleWidth / 2,

    0

  );



  const lightShift =

  Math.sin(
    yawRad
  )

  *
  .12;



  gradient.addColorStop(

    0,

    "#020202"

  );


  gradient.addColorStop(

    constrain(
      .30 + lightShift,
      .15,
      .43
    ),

    "#0b0b0b"

  );


  gradient.addColorStop(

    constrain(
      .52 + lightShift,
      .36,
      .67
    ),

    "#292929"

  );


  gradient.addColorStop(

    constrain(
      .72 + lightShift,
      .57,
      .87
    ),

    "#101010"

  );


  gradient.addColorStop(

    1,

    "#020202"

  );



  ctx.fillStyle =
  gradient;



  ctx.beginPath();



  ctx.roundRect(

    -visibleWidth / 2,

    -bodyHeight / 2,

    visibleWidth,

    bodyHeight,

    visibleWidth / 2

  );



  ctx.fill();



  ctx.shadowBlur =
  0;



  /* =========================
     頂面
  ========================= */

  ctx.fillStyle =
  "#151515";


  ctx.beginPath();


  ctx.ellipse(

    0,

    -bodyHeight / 2,

    visibleWidth / 2,

    3,

    0,

    0,

    Math.PI * 2

  );


  ctx.fill();



  /* =========================
     攝像頭
  ========================= */

  const cameraY =

  -bodyHeight *
  .31;



  const cameraW =

  Math.max(

    7,

    20 *
    facing

  );


  const cameraH =
  16;



  ctx.fillStyle =
  "#171d19";


  ctx.strokeStyle =
  "#464d47";


  ctx.lineWidth =
  1;



  ctx.beginPath();



  ctx.roundRect(

    surfaceX

    -

    cameraW / 2,

    cameraY

    -

    cameraH / 2,

    cameraW,

    cameraH,

    2

  );



  ctx.fill();

  ctx.stroke();



  const lensR =

  Math.max(

    2,

    4.5 *
    facing

  );



  ctx.fillStyle =
  "#020303";


  ctx.beginPath();



  ctx.arc(

    surfaceX,

    cameraY,

    lensR,

    0,

    Math.PI * 2

  );


  ctx.fill();



  ctx.fillStyle =

  "rgba(125,160,170,.42)";



  ctx.beginPath();



  ctx.arc(

    surfaceX

    -

    lensR *
    .27,

    cameraY

    -

    lensR *
    .27,

    Math.max(

      .7,

      lensR *
      .22

    ),

    0,

    Math.PI * 2

  );


  ctx.fill();



  /* =========================
     SCREEN
  ========================= */

  const screenY =

  -bodyHeight *
  .01;



  const screenW =

  Math.max(

    10,

    54 *
    facing

  );


  const screenH =
  82;



  ctx.fillStyle =
  "#060808";



  ctx.strokeStyle =

  device.index ===
  selectedIndex

  ?

  "rgba(210,220,215,.82)"

  :

  "#303432";



  ctx.lineWidth =

  device.index ===
  selectedIndex

  ?

  1.5

  :

  1;



  ctx.beginPath();



  ctx.roundRect(

    surfaceX

    -

    screenW / 2,

    screenY

    -

    screenH / 2,

    screenW,

    screenH,

    3

  );


  ctx.fill();

  ctx.stroke();



  const innerX =

  surfaceX

  -

  screenW / 2

  +

  3;


  const innerY =

  screenY

  -

  screenH / 2

  +

  3;


  const innerW =

  Math.max(

    3,

    screenW -
    6

  );


  const innerH =

  screenH -
  6;



  ctx.save();



  ctx.beginPath();



  ctx.roundRect(

    innerX,

    innerY,

    innerW,

    innerH,

    2

  );



  ctx.clip();



  drawWaveScreen(

    device.index,

    innerX,

    innerY,

    innerW,

    innerH,

    now

  );



  ctx.restore();



  /* =========================
     BASE
  ========================= */

  ctx.fillStyle =
  "#151515";


  ctx.beginPath();



  ctx.ellipse(

    0,

    bodyHeight / 2

    +

    8,

    16,

    4,

    0,

    0,

    Math.PI * 2

  );


  ctx.fill();



  ctx.restore();



  /*
    選取提示
  */

  if(

    device.index ===
    selectedIndex

  ){


    ctx.strokeStyle =

    "rgba(60,65,62,.24)";


    ctx.lineWidth =
    1;


    ctx.beginPath();



    ctx.ellipse(

      p.x,

      p.y

      +

      bodyHeight / 2

      +

      17,

      29,

      7,

      0,

      0,

      Math.PI * 2

    );


    ctx.stroke();

  }

}



/* ==========================================================
   WAVE SCREEN
========================================================== */

function drawWaveScreen(
  deviceIndex,
  x,
  y,
  w,
  h,
  now
){


  ctx.fillStyle =
  "#040708";


  ctx.fillRect(

    x,
    y,
    w,
    h

  );



  const distance =

  Math.abs(

    deviceIndex

    -

    selectedIndex

  );



  const snapshot =

  getDelayedAudio(

    now

    -

    distance *
    propagationDelay

  );



  /*
    沒開麥克風時，
    螢幕仍然存在，只是待機。
  */

  if(
    !micReady

    ||

    !snapshot
  ){


    drawIdleSignal(

      x,
      y,
      w,
      h,
      now,
      deviceIndex

    );


    return;

  }



  const localLevel =

  levelFromRms(

    snapshot.rms

  );



  const distortion =

  constrain(

    distance

    *

    .24

    *

    distortionStrength

    +

    globalChaos *
    .07,

    0,
    .9

  );



  const samples =

  snapshot.samples;



  /* =========================
     SCAN
  ========================= */

  const scanY =

  y

  +

  (
    now / 18

    +

    deviceIndex * 17
  )

  %

  h;



  ctx.fillStyle =

  `rgba(
    180,
    215,
    220,
    ${.025 + distortion * .06}
  )`;



  ctx.fillRect(

    x,

    scanY,

    w,

    1

  );



  /* =========================
     WAVE
  ========================= */

  ctx.beginPath();



  const drawPoints =
  80;



  for(

    let i = 0;
    i < drawPoints;
    i++

  ){


    const t =

    i

    /

    (
      drawPoints -
      1
    );



    const sourceIndex =

    Math.floor(

      t

      *

      (
        samples.length -
        1
      )

    );



    let sample =

    samples[
      sourceIndex
    ]

    *
    2.7;



    /*
      越傳越錯
    */

    if(
      distance > 0
    ){


      const n =

      (
        noise2D(

          i * .13

          +

          deviceIndex * 13,

          now * .003

        )

        -

        .5
      )

      *
      2;



      sample +=

      n

      *

      distortion

      *
      .65;

    }



    /*
      遠端加入第二層訊號
    */

    if(
      distance >= 2
    ){


      sample +=

      Math.sin(

        t

        *

        Math.PI

        *

        (
          8

          +

          distance * 5
        )

        +

        now * .008

      )

      *

      distortion

      *
      .17;

    }



    const px =

    x

    +

    t *
    w;



    let py =

    y

    +

    h / 2

    +

    sample

    *

    h

    *
    .27;



    py +=

    Math.sin(

      t * 10

      +

      now * .006

      +

      deviceIndex

    )

    *

    distortion

    *

    h

    *
    .05;



    /*
      斷裂
    */

    const breakChance =

    distance > 0

    ?

    distortion *
    .16

    :

    0;



    const broken =

    pseudoRandom(

      i

      +

      deviceIndex * 71,

      Math.floor(

        now /
        120

      )

    )

    <
    breakChance;



    if(

      i === 0

      ||

      broken

    ){


      ctx.moveTo(

        px,
        py

      );

    }
    else{


      ctx.lineTo(

        px,
        py

      );

    }

  }



  const alpha =

  constrain(

    .35

    +

    localLevel *
    .8,

    .28,
    1

  );



  ctx.lineWidth =
  1.35;


  ctx.strokeStyle =

  `rgba(
    205,
    232,
    238,
    ${alpha}
  )`;



  ctx.shadowBlur =
  5;


  ctx.shadowColor =

  "rgba(170,215,225,.45)";


  ctx.stroke();


  ctx.shadowBlur =
  0;



  /* =========================
     GLITCH
  ========================= */

  const glitchCount =

  Math.floor(

    distance

    *

    distortionStrength

    *
    3

  );



  for(

    let i = 0;
    i < glitchCount;
    i++

  ){


    const gy =

    y

    +

    pseudoRandom(

      deviceIndex * 50

      +

      i * 9,

      Math.floor(

        now /
        100

      )

    )

    *
    h;



    const gh =

    1

    +

    pseudoRandom(

      deviceIndex * 20

      +

      i * 4,

      Math.floor(

        now /
        80

      )

    )

    *
    2;



    ctx.fillStyle =

    `rgba(
      210,
      230,
      235,
      ${.03 + distortion * .09}
    )`;



    ctx.fillRect(

      x,
      gy,
      w,
      gh

    );

  }



  /* =========================
     NOISE DOTS
  ========================= */

  const dotCount =

  Math.floor(

    distortion *
    70

  );



  for(

    let i = 0;
    i < dotCount;
    i++

  ){


    const px =

    x

    +

    pseudoRandom(

      deviceIndex * 100

      +

      i * 11,

      Math.floor(

        now /
        70

      )

    )

    *
    w;



    const py =

    y

    +

    pseudoRandom(

      deviceIndex * 70

      +

      i * 17,

      Math.floor(

        now /
        70

      )

      +

      4

    )

    *
    h;



    ctx.fillStyle =

    `rgba(
      220,
      240,
      242,
      ${.03 + distortion * .16}
    )`;



    ctx.fillRect(

      px,
      py,
      1,
      1

    );

  }

}



/* ==========================================================
   IDLE SCREEN
========================================================== */

function drawIdleSignal(
  x,
  y,
  w,
  h,
  now,
  index
){


  ctx.beginPath();



  for(

    let i = 0;
    i < 50;
    i++

  ){


    const t =

    i /
    49;



    const px =

    x

    +

    t *
    w;



    const py =

    y

    +

    h / 2

    +

    Math.sin(

      t

      *

      Math.PI

      *
      4

      +

      now / 1000

      +

      index

    )

    *
    1.1;



    if(
      i === 0
    ){


      ctx.moveTo(

        px,
        py

      );

    }
    else{


      ctx.lineTo(

        px,
        py

      );

    }

  }



  ctx.lineWidth =
  1;


  ctx.strokeStyle =

  "rgba(145,170,165,.20)";


  ctx.stroke();

}

  `;

/* ==========================================================
   UTILITY
========================================================== */

function random(
  min,
  max
){


  if(
    max === undefined
  ){


    max =
    min;


    min =
    0;

  }



  return(

    Math.random()

    *

    (
      max -
      min
    )

    +

    min

  );

}



function lerp(
  a,
  b,
  t
){


  return(

    a

    +

    (
      b -
      a
    )

    *
    t

  );

}



function constrain(
  value,
  min,
  max
){


  return Math.max(

    min,

    Math.min(

      max,

      value

    )

  );

}



function mapValue(
  value,
  inMin,
  inMax,
  outMin,
  outMax
){


  return(

    (
      value -
      inMin
    )

    /

    (
      inMax -
      inMin
    )

    *

    (
      outMax -
      outMin
    )

    +

    outMin

  );

}



function noise1D(x){


  const a =

  Math.sin(

    x *
    1.7

  )

  *
  .5;



  const b =

  Math.sin(

    x *
    .73

    +

    1.2

  )

  *
  .3;



  const c =

  Math.sin(

    x *
    2.41

    +

    4.1

  )

  *
  .2;



  return(

    (
      a +
      b +
      c
    )

    *
    .5

    +

    .5

  );

}



function noise2D(
  x,
  y
){


  return pseudoRandom(

    Math.floor(

      x *
      100

    ),

    Math.floor(

      y *
      100

    )

  );

}



function pseudoRandom(
  a,
  b
){


  const value =

  Math.sin(

    a *
    12.9898

    +

    b *
    78.233

  )

  *
  43758.5453;



  return(

    value

    -

    Math.floor(

      value

    )

  );

}



/* ==========================================================
   ANIMATION
========================================================== */

let previousTime =

performance.now();


let previousCameraAnalysis =
0;



function animate(now){


  const dt =

  Math.min(

    50,

    now -
    previousTime

  );


  previousTime =
  now;



  /*
    CAMERA
  */

  if(

    now

    -

    previousCameraAnalysis

    >

    100

  ){


    analyzeCamera();


    previousCameraAnalysis =
    now;

  }



  /*
    MIC
  */

  captureAudio(
    now
  );



  /*
    GLOBAL
  */

  updateGlobalState();



  /*
    UPDATE DEVICES
  */

  devices.forEach(

    device =>

    device.update(
      now
    )

  );



  /*
    DRAW
  */

  ctx.clearRect(

    0,
    0,
    W,
    H

  );



  drawGround();



  devices.forEach(

    device =>

    drawDevice(

      device,
      now

    )

  );



  updateUI();



  requestAnimationFrame(

    animate

  );

}



requestAnimationFrame(

  animate

);
