<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>誤會機器｜LED × 攝像頭 × 聲波</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  overflow:hidden;
  background:#ece9e2;
  color:#303532;
  font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
}

#app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 350px;
}

#stageWrap{
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 40%,
      #faf9f5 0%,
      #eeebe4 58%,
      #ded9cf 100%
    );
}

#stage{
  display:block;
  width:100%;
  height:100%;
}

#title{
  position:absolute;
  left:28px;
  top:24px;
  pointer-events:none;
}

#title h1{
  margin:0;
  font-size:27px;
}

#title p{
  margin:7px 0 0;
  font-size:13px;
  color:#6d746f;
}

#hint{
  position:absolute;
  left:28px;
  bottom:24px;
  max-width:680px;

  padding:10px 14px;

  background:rgba(255,255,255,.88);
  border:1px solid rgba(0,0,0,.05);
  border-radius:10px;

  font-size:13px;
  line-height:1.65;
  pointer-events:none;
}

#panel{
  padding:20px;
  overflow-y:auto;
  background:#faf9f6;
  border-left:1px solid #ddd8ce;
}

.section{
  margin-bottom:22px;
}

.sectionTitle{
  margin-bottom:10px;
  font-size:13px;
  font-weight:700;
}

video{
  display:block;
  width:100%;
  min-height:145px;

  object-fit:cover;

  background:#111;
  border-radius:8px;

  transform:scaleX(-1);
}

button{
  width:100%;
  margin:0 0 8px;
  padding:11px;

  border:0;
  border-radius:9px;

  font-weight:700;
  cursor:pointer;
}

button.dark{
  background:#222;
  color:white;
}

button.light{
  background:#e5e1d9;
  color:#333;
}

button.gray{
  background:#d2cec5;
}

.status{
  padding:11px;
  background:#fff;
  border:1px solid #dedad1;
  border-radius:8px;

  font-size:12px;
  line-height:1.8;
}

label{
  display:block;
  margin:12px 0 5px;
  font-size:12px;
}

input[type="range"]{
  width:100%;
}

.meter{
  height:8px;
  margin-top:7px;

  overflow:hidden;

  background:#e1ddd5;
  border-radius:999px;
}

#cameraMeter,
#voiceMeter{
  width:0%;
  height:100%;
  background:#383d3a;
  transition:width .06s linear;
}

.small{
  margin-top:8px;
  color:#777;
  font-size:11px;
  line-height:1.55;
}
</style>
</head>

<body>

<div id="app">

  <div id="stageWrap">

    <canvas id="stage"></canvas>

    <div id="title">
      <h1>《誤會機器》</h1>
      <p>LED 感知 × 攝像頭觀看 × 聲音傳遞</p>
    </div>

    <div id="hint">
      靠近裝置時，頂部 LED 會先出現反應，裝置再慢慢轉向你。
      當你說話後，聲音會從靠近你的個體進入，並透過螢幕與 LED
      逐漸傳向其他個體。
    </div>

  </div>


  <aside id="panel">

    <div class="section">

      <div class="sectionTitle">
        攝像頭
      </div>

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <br>

      <button
        id="cameraBtn"
        class="dark">
        開啟攝像頭
      </button>

      <div class="status">

        攝像頭：
        <b id="cameraState">未啟動</b>

        <br>

        觀者位置：
        <b id="viewerPosition">—</b>

        <br>

        最近個體：
        <b id="nearestDevice">—</b>

        <br>

        動作量：
        <b>
          <span id="cameraPercent">0</span>%
        </b>

        <div class="meter">
          <div id="cameraMeter"></div>
        </div>

      </div>

    </div>


    <div class="section">

      <div class="sectionTitle">
        麥克風
      </div>

      <button
        id="micBtn"
        class="dark">
        開啟麥克風
      </button>

      <button
        id="micStopBtn"
        class="light">
        停止麥克風
      </button>

      <div class="status">

        麥克風：
        <b id="micState">未啟動</b>

        <br>

        聲音入口：
        <b id="audioSourceText">第 3 支</b>

        <br>

        聲音強度：
        <b>
          <span id="voicePercent">0</span>%
        </b>

        <div class="meter">
          <div id="voiceMeter"></div>
        </div>

      </div>

    </div>


    <div class="section">

      <div class="sectionTitle">
        觀看設定
      </div>

      <label>
        攝像頭敏感度：
        <span id="sensitivityValue">40</span>
      </label>

      <input
        id="sensitivitySlider"
        type="range"
        min="5"
        max="80"
        value="40"
      >


      <label>
        轉向延遲：
        <span id="gazeDelayValue">400</span> ms
      </label>

      <input
        id="gazeDelaySlider"
        type="range"
        min="0"
        max="1200"
        step="50"
        value="400"
      >


      <label>
        最大轉向：
        <span id="gazeAngleValue">42</span>°
      </label>

      <input
        id="gazeAngleSlider"
        type="range"
        min="15"
        max="60"
        value="42"
      >

    </div>


    <div class="section">

      <div class="sectionTitle">
        LED 設定
      </div>

      <label>
        LED 感知亮度：
        <span id="ledStrengthValue">85</span>%
      </label>

      <input
        id="ledStrengthSlider"
        type="range"
        min="20"
        max="100"
        value="85"
      >


      <label>
        LED 呼吸速度：
        <span id="breathValue">50</span>%
      </label>

      <input
        id="breathSlider"
        type="range"
        min="10"
        max="100"
        value="50"
      >

    </div>


    <div class="section">

      <div class="sectionTitle">
        聲波設定
      </div>

      <label>
        每支傳遞延遲：
        <span id="soundDelayValue">500</span> ms
      </label>

      <input
        id="soundDelaySlider"
        type="range"
        min="150"
        max="1200"
        step="50"
        value="500"
      >


      <label>
        訊號失真：
        <span id="distortionValue">55</span>%
      </label>

      <input
        id="distortionSlider"
        type="range"
        min="0"
        max="100"
        value="55"
      >

    </div>


    <div class="section">

      <div class="sectionTitle">
        系統狀態
      </div>

      <div
        id="systemStatus"
        class="status">
        系統待機中
      </div>

    </div>


    <button
      id="resetBtn"
      class="gray">
      重設裝置
    </button>

  </aside>

</div>


<canvas
  id="cameraAnalysis"
  width="160"
  height="120"
  style="display:none">
</canvas>


<script>

/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("stage");

const ctx =
  canvas.getContext("2d");

const video =
  document.getElementById("video");

const analysisCanvas =
  document.getElementById("cameraAnalysis");

const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {willReadFrequently:true}
  );


/* =========================================================
   BASIC
========================================================= */

const DEVICE_COUNT = 5;

let W = 0;
let H = 0;

const devices = [];

let manuallySelectedIndex = 2;

let nearestViewerIndex = 2;

let currentAudioSource = 2;


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;

let cameraReady = false;

let previousCameraFrame = null;


const viewer = {

  present:false,

  movement:0,

  x:.5,

  absentTime:0,

  sensitivity:40

};


const viewerHistory = [];


let gazeDelay = 400;

let maxGazeAngle = 42;

let gazeSpeed = .055;


/* =========================================================
   LED
========================================================= */

let ledStrength = .85;

let breathSpeed = .50;


/* =========================================================
   MICROPHONE
========================================================= */

let micStream = null;

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let waveformBuffer = null;

let micReady = false;

let voiceLevel = 0;

const audioHistory = [];

let lastAudioCapture = 0;

let soundPropagationDelay = 500;

let distortionStrength = .55;


/* =========================================================
   DEVICE
========================================================= */

class Device{

  constructor(index){

    this.index = index;

    this.yaw = 0;

    this.targetYaw = 0;

    this.attention = 0;

    this.personality =
      random(.94,1.06);

  }


  update(
    now,
    delayedViewerX,
    delayedViewerPresent
  ){

    /*
      沒有觀者。
    */

    if(
      !delayedViewerPresent
    ){

      this.targetYaw = 0;

      this.yaw =
        lerp(
          this.yaw,
          0,
          .025
        );

      this.attention =
        lerp(
          this.attention,
          0,
          .04
        );

      return;

    }


    const rodX =

      this.index

      /

      (
        DEVICE_COUNT - 1
      );


    const primaryIndex =

      constrain(

        Math.round(

          delayedViewerX

          *

          (
            DEVICE_COUNT - 1
          )

        ),

        0,
        DEVICE_COUNT - 1

      );


    const indexDistance =

      Math.abs(

        this.index

        -

        primaryIndex

      );


    /*
      最近最強，
      鄰居次強。
    */

    let attention = 0;


    if(
      indexDistance === 0
    ){

      attention = 1;

    }

    else if(
      indexDistance === 1
    ){

      attention = .35;

    }

    else if(
      indexDistance === 2
    ){

      attention = .06;

    }


    this.attention =

      lerp(

        this.attention,

        attention,

        .09

      );


    const difference =

      delayedViewerX

      -

      rodX;


    let direction;


    if(
      difference >
      .025
    ){

      direction = 1;

    }

    else if(
      difference <
      -.025
    ){

      direction = -1;

    }

    else{

      /*
        站在正前方時仍保留一點側向，
        才看得出轉向。
      */

      direction =

        delayedViewerX <
        .5

        ?

        -1

        :

        1;

    }


    const lateralDistance =

      constrain(

        Math.abs(
          difference
        )

        *
        2.3,

        0,
        1

      );


    /*
      主體的轉向範圍比較明顯，
      因為現在裝置只有30cm左右。
    */

    const angle =

      25

      +

      lateralDistance

      *

      (
        maxGazeAngle -
        25
      );


    this.targetYaw =

      direction

      *

      angle

      *

      attention

      *

      this.personality;


    this.yaw =

      lerp(

        this.yaw,

        this.targetYaw,

        gazeSpeed

      );

  }

}


/* =========================================================
   INIT
========================================================= */

function resetDevices(){

  devices.length = 0;

  for(
    let i = 0;
    i < DEVICE_COUNT;
    i++
  ){

    devices.push(
      new Device(i)
    );

  }

  viewerHistory.length = 0;

  audioHistory.length = 0;

  nearestViewerIndex = 2;

  currentAudioSource =
    manuallySelectedIndex;

}


resetDevices();


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas(){

  const rect =
    canvas
    .parentElement
    .getBoundingClientRect();


  W =
    rect.width;


  H =
    rect.height;


  canvas.width =

    Math.round(

      W *
      devicePixelRatio

    );


  canvas.height =

    Math.round(

      H *
      devicePixelRatio

    );


  canvas.style.width =
    W + "px";


  canvas.style.height =
    H + "px";


  ctx.setTransform(

    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0

  );

}


resizeCanvas();


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   POSITIONS
========================================================= */

function getDevicePosition(index){

  return{

    x:

      mapValue(

        index,

        0,
        DEVICE_COUNT - 1,

        W * .16,
        W * .84

      ),

    y:

      H * .56

  };

}


/* =========================================================
   MANUAL CLICK
========================================================= */

canvas.addEventListener(
  "click",
  event => {

    const rect =
      canvas.getBoundingClientRect();


    const mouseX =
      event.clientX -
      rect.left;


    const mouseY =
      event.clientY -
      rect.top;


    let closestIndex = -1;

    let closestDistance =
      Infinity;


    for(
      let i = 0;
      i < DEVICE_COUNT;
      i++
    ){

      const p =
        getDevicePosition(i);


      const dx =
        mouseX - p.x;


      const dy =
        mouseY - p.y;


      const d =

        Math.sqrt(

          dx * dx
          +
          dy * dy

        );


      if(
        d < 130
        &&
        d <
        closestDistance
      ){

        closestIndex = i;

        closestDistance = d;

      }

    }


    if(
      closestIndex >= 0
    ){

      manuallySelectedIndex =
        closestIndex;


      if(
        !viewer.present
      ){

        currentAudioSource =
          manuallySelectedIndex;

      }

    }

  }
);


/* =========================================================
   CAMERA START
========================================================= */

async function startCamera(){

  try{

    cameraStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        video:{

          width:{
            ideal:640
          },

          height:{
            ideal:480
          },

          facingMode:"user"

        },

        audio:false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    cameraReady = true;

    previousCameraFrame = null;


    document
    .getElementById(
      "cameraBtn"
    )
    .textContent =
      "攝像頭已開啟";


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "已啟動";

  }
  catch(error){

    cameraReady = false;

    console.error(error);


    document
    .getElementById(
      "cameraState"
    )
    .textContent =

      "啟動失敗：" +
      error.name;

  }

}


document
.getElementById("cameraBtn")
.addEventListener(
  "click",
  startCamera
);


/* =========================================================
   CAMERA ANALYSIS
========================================================= */

function analyzeCamera(now){

  if(
    !cameraReady
    ||
    video.readyState < 2
  ){

    return;

  }


  analysisCtx.drawImage(

    video,

    0,
    0,

    analysisCanvas.width,
    analysisCanvas.height

  );


  const frame =

    analysisCtx
    .getImageData(

      0,
      0,

      analysisCanvas.width,
      analysisCanvas.height

    )
    .data;


  if(
    !previousCameraFrame
  ){

    previousCameraFrame =

      new Uint8ClampedArray(
        frame
      );

    return;

  }


  let changed = 0;

  let xTotal = 0;

  let checked = 0;


  const width =
    analysisCanvas.width;


  const height =
    analysisCanvas.height;


  const threshold =

    mapValue(

      viewer.sensitivity,

      5,
      80,

      85,
      18

    );


  for(
    let y = 0;
    y < height;
    y += 4
  ){

    for(
      let x = 0;
      x < width;
      x += 4
    ){

      const i =

        (
          y * width
          +
          x
        )

        *
        4;


      const difference =

        Math.abs(
          frame[i] -
          previousCameraFrame[i]
        )

        +

        Math.abs(
          frame[i+1] -
          previousCameraFrame[i+1]
        )

        +

        Math.abs(
          frame[i+2] -
          previousCameraFrame[i+2]
        );


      checked++;


      if(
        difference >
        threshold
      ){

        changed++;

        xTotal += x;

      }

    }

  }


  previousCameraFrame =

    new Uint8ClampedArray(
      frame
    );


  const ratio =

    changed

    /

    Math.max(
      1,
      checked
    );


  viewer.movement =

    lerp(

      viewer.movement,

      constrain(
        ratio * 3,
        0,
        1
      ),

      .30

    );


  if(
    changed > 0
  ){

    let averageX =

      xTotal /
      changed;


    /*
      video 顯示為鏡像，
      因此反轉一次。
    */

    averageX =

      width -
      averageX;


    const targetX =

      constrain(

        averageX /
        width,

        0,
        1

      );


    viewer.x =

      lerp(

        viewer.x,

        targetX,

        .35

      );

  }


  if(
    ratio >
    .005
  ){

    viewer.present = true;

    viewer.absentTime = 0;

  }

  else{

    viewer.absentTime +=
      100;


    /*
      停下來時保留最後位置一段時間。
    */

    if(
      viewer.absentTime >
      6000
    ){

      viewer.present = false;

    }

  }


  viewerHistory.push({

    time:now,

    x:viewer.x,

    present:viewer.present

  });


  const cutoff =
    now - 5000;


  while(
    viewerHistory.length > 0
    &&
    viewerHistory[0].time <
    cutoff
  ){

    viewerHistory.shift();

  }

}


/* =========================================================
   DELAYED VIEWER
========================================================= */

function getDelayedViewer(
  targetTime
){

  if(
    viewerHistory.length === 0
  ){

    return{

      x:viewer.x,

      present:viewer.present

    };

  }


  for(
    let i =
      viewerHistory.length - 1;

    i >= 0;

    i--
  ){

    if(
      viewerHistory[i].time
      <=
      targetTime
    ){

      return viewerHistory[i];

    }

  }


  return viewerHistory[0];

}


/* =========================================================
   MICROPHONE START
========================================================= */

async function startMicrophone(){

  try{

    if(micReady){
      return;
    }


    micStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        audio:{

          echoCancellation:true,

          noiseSuppression:false,

          autoGainControl:false

        },

        video:false

      });


    const AudioCtx =

      window.AudioContext

      ||

      window.webkitAudioContext;


    audioContext =
      new AudioCtx();


    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();

    }


    analyser =
      audioContext
      .createAnalyser();


    analyser.fftSize =
      1024;


    analyser.smoothingTimeConstant =
      .18;


    waveformBuffer =

      new Uint8Array(
        analyser.fftSize
      );


    microphoneSource =

      audioContext
      .createMediaStreamSource(
        micStream
      );


    microphoneSource.connect(
      analyser
    );


    micReady = true;


    document
    .getElementById(
      "micBtn"
    )
    .textContent =
      "麥克風已開啟";


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "已啟動";

  }
  catch(error){

    micReady = false;

    console.error(error);


    document
    .getElementById(
      "micState"
    )
    .textContent =

      "啟動失敗：" +
      error.name;

  }

}


/* =========================================================
   STOP MIC
========================================================= */

async function stopMicrophone(){

  if(micStream){

    micStream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );

  }


  micStream = null;


  if(microphoneSource){

    try{
      microphoneSource.disconnect();
    }
    catch(e){}

  }


  microphoneSource = null;


  if(audioContext){

    try{
      await audioContext.close();
    }
    catch(e){}

  }


  audioContext = null;

  analyser = null;

  waveformBuffer = null;

  micReady = false;

  voiceLevel = 0;

  audioHistory.length = 0;


  document
  .getElementById(
    "micBtn"
  )
  .textContent =
    "開啟麥克風";


  document
  .getElementById(
    "micState"
  )
  .textContent =
    "未啟動";

}


document
.getElementById("micBtn")
.addEventListener(
  "click",
  startMicrophone
);


document
.getElementById("micStopBtn")
.addEventListener(
  "click",
  stopMicrophone
);


/* =========================================================
   AUDIO CAPTURE
========================================================= */

function captureAudio(now){

  if(
    !micReady
    ||
    !analyser
    ||
    !waveformBuffer
  ){

    voiceLevel =

      lerp(
        voiceLevel,
        0,
        .08
      );

    return;

  }


  if(
    now -
    lastAudioCapture <
    35
  ){

    return;

  }


  lastAudioCapture =
    now;


  analyser
  .getByteTimeDomainData(
    waveformBuffer
  );


  const count = 128;


  const samples =

    new Float32Array(
      count
    );


  let sum = 0;


  for(
    let i = 0;
    i < count;
    i++
  ){

    const sourceIndex =

      Math.floor(

        i

        *

        (
          waveformBuffer.length -
          1
        )

        /

        (
          count -
          1
        )

      );


    const value =

      (
        waveformBuffer[sourceIndex]
        -
        128
      )

      /
      128;


    samples[i] = value;


    sum +=

      value *
      value;

  }


  const rms =

    Math.sqrt(

      sum /
      count

    );


  voiceLevel =

    lerp(

      voiceLevel,

      levelFromRms(
        rms
      ),

      .36

    );


  audioHistory.push({

    time:now,

    rms:rms,

    samples:samples,

    sourceIndex:
      currentAudioSource

  });


  const cutoff =
    now - 8000;


  while(
    audioHistory.length > 0
    &&
    audioHistory[0].time <
    cutoff
  ){

    audioHistory.shift();

  }

}


/* =========================================================
   AUDIO LEVEL
========================================================= */

function levelFromRms(rms){

  return constrain(

    (
      rms -
      .007
    )

    *
    17,

    0,
    1

  );

}


/* =========================================================
   DELAYED AUDIO
========================================================= */

function getDelayedAudio(
  targetTime
){

  if(
    audioHistory.length === 0
  ){

    return null;

  }


  if(
    targetTime <
    audioHistory[0].time
  ){

    return null;

  }


  for(
    let i =
      audioHistory.length - 1;

    i >= 0;

    i--
  ){

    if(
      audioHistory[i].time
      <=
      targetTime
    ){

      return audioHistory[i];

    }

  }


  return null;

}


/* =========================================================
   DISPLAY TABLE
========================================================= */

function drawDisplayTable(){

  /*
    展櫃上方平台。
  */

  const tableY =
    H * .72;


  ctx.fillStyle =
    "#e6e1d8";


  ctx.fillRect(

    W * .06,

    tableY,

    W * .88,

    H * .16

  );


  ctx.fillStyle =
    "rgba(0,0,0,.07)";


  ctx.fillRect(

    W * .06,

    tableY,

    W * .88,

    4

  );

}


/* =========================================================
   DEVICE DRAW
========================================================= */

function drawDevice(
  device,
  now
){

  const p =
    getDevicePosition(
      device.index
    );


  /*
    模擬實體約30cm高，
    比之前矮很多。
  */

  const bodyHeight =

    Math.min(
      260,
      H * .35
    );


  const frontWidth = 62;


  const yawRad =

    device.yaw

    *
    Math.PI

    /
    180;


  /*
    旋轉時略微變窄。
  */

  const visibleWidth =

    34

    +

    28

    *
    Math.abs(
      Math.cos(
        yawRad
      )
    );


  const facing =

    .35

    +

    .65

    *
    Math.abs(
      Math.cos(
        yawRad
      )
    );


  /*
    正面元件跟著柱體移動。
  */

  const surfaceX =

    Math.sin(
      yawRad
    )

    *
    visibleWidth

    *
    .48;


  ctx.save();


  ctx.translate(
    p.x,
    p.y
  );


  /*
    地面陰影。
  */

  ctx.fillStyle =
    "rgba(0,0,0,.10)";


  ctx.beginPath();

  ctx.ellipse(

    6,

    bodyHeight / 2 + 17,

    38,

    10,

    0,

    0,

    Math.PI * 2

  );

  ctx.fill();


  /*
    本體。
  */

  const bodyGradient =

    ctx.createLinearGradient(

      -visibleWidth/2,
      0,

      visibleWidth/2,
      0

    );


  bodyGradient.addColorStop(
    0,
    "#050505"
  );

  bodyGradient.addColorStop(
    .32,
    "#111"
  );

  bodyGradient.addColorStop(
    .54,
    "#303030"
  );

  bodyGradient.addColorStop(
    .74,
    "#121212"
  );

  bodyGradient.addColorStop(
    1,
    "#030303"
  );


  ctx.fillStyle =
    bodyGradient;


  ctx.beginPath();

  ctx.roundRect(

    -visibleWidth/2,

    -bodyHeight/2,

    visibleWidth,

    bodyHeight,

    16

  );

  ctx.fill();


  /*
    頂面。
  */

  ctx.fillStyle =
    "#101010";


  ctx.beginPath();

  ctx.ellipse(

    0,

    -bodyHeight/2 + 4,

    visibleWidth/2 - 2,

    7,

    0,

    0,

    Math.PI * 2

  );

  ctx.fill();


  /* =====================================================
     LED RING
  ===================================================== */

  drawLedRing(

    device,

    now,

    0,

    -bodyHeight/2 + 9,

    visibleWidth,

    yawRad

  );


  /* =====================================================
     CAMERA
  ===================================================== */

  const cameraY =

    -bodyHeight *
    .25;


  const cameraRadius =

    Math.max(
      4,
      8 * facing
    );


  /*
    camera housing
  */

  ctx.fillStyle =
    "#050606";


  ctx.strokeStyle =
    "#353b39";


  ctx.lineWidth = 1;


  ctx.beginPath();

  ctx.arc(

    surfaceX,

    cameraY,

    cameraRadius + 4,

    0,

    Math.PI * 2

  );

  ctx.fill();

  ctx.stroke();


  /*
    lens
  */

  ctx.fillStyle =
    "#020406";


  ctx.beginPath();

  ctx.arc(

    surfaceX,

    cameraY,

    cameraRadius,

    0,

    Math.PI * 2

  );

  ctx.fill();


  /*
    lens reflection
  */

  ctx.fillStyle =
    "rgba(90,135,160,.48)";


  ctx.beginPath();

  ctx.arc(

    surfaceX -
    cameraRadius*.25,

    cameraY -
    cameraRadius*.28,

    Math.max(
      1,
      cameraRadius*.23
    ),

    0,

    Math.PI * 2

  );

  ctx.fill();


  /* =====================================================
     SCREEN
  ===================================================== */

  const screenY =

    bodyHeight *
    .02;


  const screenWidth =

    Math.max(
      16,
      42 * facing
    );


  const screenHeight =
    64;


  ctx.fillStyle =
    "#030505";


  ctx.strokeStyle =
    "#262b29";


  ctx.lineWidth = 1;


  ctx.beginPath();

  ctx.roundRect(

    surfaceX -
    screenWidth/2,

    screenY -
    screenHeight/2,

    screenWidth,

    screenHeight,

    3

  );

  ctx.fill();

  ctx.stroke();


  const innerX =

    surfaceX -
    screenWidth/2 +
    3;


  const innerY =

    screenY -
    screenHeight/2 +
    3;


  const innerW =

    Math.max(
      4,
      screenWidth - 6
    );


  const innerH =

    screenHeight - 6;


  ctx.save();


  ctx.beginPath();

  ctx.roundRect(

    innerX,
    innerY,
    innerW,
    innerH,
    2

  );

  ctx.clip();


  drawWaveScreen(

    device.index,

    innerX,
    innerY,
    innerW,
    innerH,

    now

  );


  ctx.restore();


  ctx.restore();

}


/* =========================================================
   LED RING
========================================================= */

function drawLedRing(
  device,
  now,
  x,
  y,
  width,
  yawRad
){

  /*
    待機呼吸。
  */

  const breath =

    (
      Math.sin(

        now

        *
        (
          .001

          +

          breathSpeed *
          .0025
        )

      )

      +
      1

    )

    /
    2;


  let brightness =

    .08

    +

    breath *
    .08;


  /*
    攝像頭感知。
  */

  brightness +=

    device.attention

    *
    .60

    *
    ledStrength;


  /*
    聲音傳遞。
  */

  const audioDistance =

    Math.abs(

      device.index

      -

      currentAudioSource

    );


  const delayedAudio =

    getDelayedAudio(

      now

      -

      audioDistance *
      soundPropagationDelay

    );


  if(
    delayedAudio
    &&
    micReady
  ){

    const level =

      levelFromRms(
        delayedAudio.rms
      );


    /*
      越遠亮度越弱，
      但還是能看見訊號傳出去。
    */

    const transmission =

      Math.max(

        .25,

        1

        -

        audioDistance *
        .18

      );


    brightness +=

      level

      *
      .75

      *
      transmission;

  }


  brightness =

    constrain(
      brightness,
      .05,
      1
    );


  /*
    LED暗底。
  */

  ctx.strokeStyle =
    "rgba(70,80,82,.25)";


  ctx.lineWidth =
    5;


  ctx.beginPath();

  ctx.ellipse(

    x,
    y,

    width/2 - 2,

    5,

    0,

    0,

    Math.PI * 2

  );

  ctx.stroke();


  /*
    主LED環。
  */

  ctx.shadowBlur =

    7

    +

    brightness *
    13;


  ctx.shadowColor =

    `rgba(
      190,
      225,
      235,
      ${brightness}
    )`;


  ctx.strokeStyle =

    `rgba(
      210,
      238,
      245,
      ${brightness}
    )`;


  ctx.lineWidth =
    3;


  ctx.beginPath();

  ctx.ellipse(

    x,
    y,

    width/2 - 2,

    5,

    0,

    0,

    Math.PI * 2

  );

  ctx.stroke();


  ctx.shadowBlur = 0;


  /*
    正面方向再稍微亮一點，
    讓圓柱旋轉更容易看出來。

    不是眼睛，
    只是LED環的一小段亮區。
  */

  const frontShift =

    Math.sin(
      yawRad
    )

    *
    width

    *
    .27;


  ctx.fillStyle =

    `rgba(
      235,
      250,
      255,
      ${brightness*.75}
    )`;


  ctx.beginPath();

  ctx.ellipse(

    x +
    frontShift,

    y,

    Math.max(
      3,
      width*.12
    ),

    2.5,

    0,

    0,

    Math.PI * 2

  );

  ctx.fill();

}


/* =========================================================
   WAVE SCREEN
========================================================= */

function drawWaveScreen(
  deviceIndex,
  x,
  y,
  w,
  h,
  now
){

  ctx.fillStyle =
    "#020405";


  ctx.fillRect(
    x,
    y,
    w,
    h
  );


  const distance =

    Math.abs(

      deviceIndex

      -

      currentAudioSource

    );


  const snapshot =

    getDelayedAudio(

      now

      -

      distance *
      soundPropagationDelay

    );


  if(
    !micReady
    ||
    !snapshot
  ){

    drawIdleSignal(

      x,
      y,
      w,
      h,

      now,
      deviceIndex

    );

    return;

  }


  const actualDistance =

    Math.abs(

      deviceIndex

      -

      snapshot.sourceIndex

    );


  const distortion =

    constrain(

      actualDistance

      *
      .24

      *
      distortionStrength,

      0,
      .92

    );


  const samples =
    snapshot.samples;


  const localLevel =

    levelFromRms(
      snapshot.rms
    );


  /*
    signal
  */

  ctx.beginPath();


  const points =
    72;


  for(
    let i = 0;
    i < points;
    i++
  ){

    const t =

      i

      /

      (
        points - 1
      );


    const index =

      Math.floor(

        t

        *

        (
          samples.length -
          1
        )

      );


    let sample =

      samples[index]

      *
      2.8;


    if(
      actualDistance > 0
    ){

      const noise =

        (
          pseudoNoise(

            i * .13
            +
            deviceIndex * 12,

            now * .003

          )

          -
          .5

        )

        *
        2;


      sample +=

        noise

        *
        distortion

        *
        .6;

    }


    if(
      actualDistance >= 2
    ){

      sample +=

        Math.sin(

          t

          *
          Math.PI

          *
          (
            9
            +
            actualDistance * 4
          )

          +

          now * .008

        )

        *
        distortion

        *
        .20;

    }


    const px =

      x

      +
      t * w;


    const py =

      y

      +
      h/2

      +
      sample

      *
      h

      *
      .27;


    const broken =

      pseudoRandom(

        i +
        deviceIndex * 81,

        Math.floor(
          now / 110
        )

      )

      <
      distortion * .13;


    if(
      i === 0
      ||
      broken
    ){

      ctx.moveTo(
        px,
        py
      );

    }
    else{

      ctx.lineTo(
        px,
        py
      );

    }

  }


  ctx.lineWidth =
    1.3;


  ctx.strokeStyle =

    `rgba(
      205,
      232,
      240,
      ${.35 + localLevel*.65}
    )`;


  ctx.shadowBlur =
    6;


  ctx.shadowColor =
    "rgba(165,215,230,.45)";


  ctx.stroke();


  ctx.shadowBlur = 0;


  /*
    glitch
  */

  const glitches =

    Math.floor(

      actualDistance

      *
      distortionStrength

      *
      3

    );


  for(
    let i = 0;
    i < glitches;
    i++
  ){

    const gy =

      y

      +

      pseudoRandom(

        deviceIndex * 40
        +
        i * 7,

        Math.floor(
          now / 90
        )

      )

      *
      h;


    ctx.fillStyle =

      `rgba(
        220,
        240,
        245,
        ${.04 + distortion*.10}
      )`;


    ctx.fillRect(

      x,
      gy,
      w,
      1

    );

  }


  /*
    dots
  */

  const dotCount =

    Math.floor(
      distortion * 55
    );


  for(
    let i = 0;
    i < dotCount;
    i++
  ){

    const px =

      x

      +

      pseudoRandom(

        deviceIndex * 90
        +
        i * 10,

        Math.floor(
          now / 65
        )

      )

      *
      w;


    const py =

      y

      +

      pseudoRandom(

        deviceIndex * 60
        +
        i * 13,

        Math.floor(
          now / 65
        )
        +
        4

      )

      *
      h;


    ctx.fillStyle =

      `rgba(
        225,
        242,
        247,
        ${.04 + distortion*.15}
      )`;


    ctx.fillRect(
      px,
      py,
      1,
      1
    );

  }

}


/* =========================================================
   IDLE SCREEN
========================================================= */

function drawIdleSignal(
  x,
  y,
  w,
  h,
  now,
  index
){

  ctx.beginPath();


  for(
    let i = 0;
    i < 48;
    i++
  ){

    const t =
      i / 47;


    const px =

      x

      +
      t * w;


    const py =

      y

      +
      h/2

      +

      Math.sin(

        t

        *
        Math.PI

        *
        4

        +

        now /
        1100

        +

        index

      )

      *
      1.2;


    if(
      i === 0
    ){

      ctx.moveTo(
        px,
        py
      );

    }
    else{

      ctx.lineTo(
        px,
        py
      );

    }

  }


  ctx.lineWidth = 1;


  ctx.strokeStyle =
    "rgba(150,180,180,.18)";


  ctx.stroke();

}

/* =========================================================
   UTILITY
========================================================= */

function random(
  min,
  max
){

  if(
    max === undefined
  ){

    max = min;
    min = 0;

  }


  return(

    Math.random()

    *
    (
      max -
      min
    )

    +
    min

  );

}


function lerp(
  a,
  b,
  t
){

  return(

    a

    +
    (
      b -
      a
    )

    *
    t

  );

}


function constrain(
  value,
  minimum,
  maximum
){

  return Math.max(

    minimum,

    Math.min(
      maximum,
      value
    )

  );

}


function mapValue(
  value,
  inMin,
  inMax,
  outMin,
  outMax
){

  return(

    (
      value -
      inMin
    )

    /

    (
      inMax -
      inMin
    )

    *

    (
      outMax -
      outMin
    )

    +
    outMin

  );

}


function pseudoRandom(
  a,
  b
){

  const value =

    Math.sin(

      a * 12.9898

      +

      b * 78.233

    )

    *
    43758.5453;


  return(

    value

    -
    Math.floor(
      value
    )

  );

}


function pseudoNoise(
  x,
  y
){

  return pseudoRandom(

    Math.floor(
      x * 100
    ),

    Math.floor(
      y * 100
    )

  );

}


/* =========================================================
   ANIMATION
========================================================= */

let previousCameraAnalysis = 0;


function animate(now){

  /*
    CAMERA
  */

  if(
    now -
    previousCameraAnalysis >
    100
  ){

    analyzeCamera(now);

    previousCameraAnalysis =
      now;

  }


  /*
    AUDIO
  */

  captureAudio(now);


  /*
    delayed viewer
  */

  const delayedViewer =

    getDelayedViewer(

      now -
      gazeDelay

    );


  /*
    最近棒子
  */

  if(
    delayedViewer.present
  ){

    nearestViewerIndex =

      constrain(

        Math.round(

          delayedViewer.x

          *
          (
            DEVICE_COUNT - 1
          )

        ),

        0,
        DEVICE_COUNT - 1

      );

  }


  /*
    device update
  */

  devices.forEach(
    device => {

      device.update(

        now,

        delayedViewer.x,

        delayedViewer.present

      );

    }
  );


  /*
    draw
  */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawDisplayTable();


  devices.forEach(
    device => {

      drawDevice(
        device,
        now
      );

    }
  );


  updateUI();


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);

</script>
