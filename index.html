<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
誤會機器｜五支棒狀裝置模擬
</title>


<style>

/* ======================================
   基本
====================================== */

*{
  box-sizing:border-box;
}


body{

  margin:0;

  overflow:hidden;

  background:#f1eee7;

  color:#303633;

  font-family:
  "Microsoft JhengHei",
  "Noto Sans TC",
  sans-serif;

}


/* ======================================
   整體版面
====================================== */

#app{

  display:grid;

  grid-template-columns:
  1fr
  340px;

  height:100vh;

}


/* ======================================
   左側作品區
====================================== */

#stageWrap{

  position:relative;

  overflow:hidden;

  background:

  radial-gradient(
    circle at center,
    #faf9f6 0%,
    #ece8df 100%
  );

}


#stage{

  width:100%;

  height:100%;

  display:block;

}


/* ======================================
   標題
====================================== */

#title{

  position:absolute;

  left:28px;

  top:22px;

  pointer-events:none;

}


#title h1{

  margin:0;

  font-size:26px;

  font-weight:700;

}


#title p{

  margin:6px 0 0;

  color:#687772;

  font-size:13px;

}


/* ======================================
   下方提示
====================================== */

#hint{

  position:absolute;

  left:28px;

  bottom:24px;

  max-width:560px;

  padding:10px 14px;

  background:
  rgba(255,255,255,.88);

  border:
  1px solid rgba(0,0,0,.05);

  border-radius:10px;

  font-size:13px;

  line-height:1.6;

}


/* ======================================
   右側控制面板
====================================== */

#panel{

  padding:22px;

  background:#fbfaf7;

  border-left:
  1px solid #ddd8ce;

  overflow-y:auto;

}


.section{

  margin-bottom:22px;

}


.sectionTitle{

  color:#444;

  font-size:13px;

  font-weight:bold;

  margin-bottom:10px;

}


/* ======================================
   攝影機畫面
====================================== */

video{

  width:100%;

  border-radius:8px;

  background:#111;

  transform:
  scaleX(-1);

}


/* ======================================
   按鈕
====================================== */

button{

  width:100%;

  padding:11px;

  margin-bottom:8px;

  border:none;

  border-radius:9px;

  font-weight:bold;

}


#cameraBtn{

}

====================================== */

label{

input[type="range"]{

}

   狀態
====================================== */

  padding:10px;

  background:white;

  border:
  1px solid #dfdbd2;

  border-radius:8px;

  font-size:12px;

}


.device{

  margin-bottom:7px;

  padding:8px 10px;

  background:#fff;

  border:
  1px solid #e3dfd6;

  border-radius:7px;

  font-size:11px;

  line-height:1.55;

}

</style>

</head>



<body>


<div id="app">


<!-- ======================================
     左側模擬畫面
====================================== -->

<div id="stageWrap">


<canvas id="stage">
</canvas>


<div id="title">

  <h1>
    《誤會機器》
  </h1>

  <p>
    攝像頭感知 × 群體擾動 × 自主反應
  </p>

</div>


<div id="hint">

  觀者不是控制器。人的進入與移動只會造成擾動，
  五支裝置會依照彼此狀態、過去記憶與隨機偏差產生自己的反應。

</div>


</div>



<!-- ======================================
     右側面板
====================================== -->

<aside id="panel">


<div class="section">

  <div class="sectionTitle">
    電腦攝像頭
  </div>


  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <br><br>


  <button id="cameraBtn">
    開啟攝像頭
  </button>


  <button id="leaveBtn">
    模擬觀者離開
  </button>

</div>



<div class="section">

  <div class="sectionTitle">
    感知設定
  </div>


  <label>

    攝像頭敏感度：

    <span id="sensitivityValue">
      35
    </span>

  </label>


  <input
    type="range"
    id="sensitivity"
    min="5"
    max="80"
    value="35"
  >

</div>



<div class="section">

  <div class="sectionTitle">
    系統狀態
  </div>


  <div
    id="globalStatus"
    class="status">

    尚未開啟攝像頭

  </div>

</div>



<div class="section">

  <div class="sectionTitle">
    個體狀態
  </div>


  <div id="deviceStatus">
  </div>

</div>



<button id="resetBtn">
  重設系統
</button>


</aside>


</div>



<!-- ======================================
     隱藏攝影機分析畫布
====================================== -->

<canvas
  id="analysisCanvas"
  width="160"
  height="120"
  style="display:none;">
</canvas>



<script>

/* ======================================
   DOM
====================================== */

const canvas =

document.getElementById(
  "stage"
);


const ctx =

canvas.getContext(
  "2d"
);


const video =

document.getElementById(
  "video"
);


const analysisCanvas =

document.getElementById(
  "analysisCanvas"
);


const analysisCtx =

analysisCanvas.getContext(

  "2d",

  {
    willReadFrequently:true
  }

);



/* ======================================
   畫面尺寸
====================================== */

let W = 0;

let H = 0;



/* ======================================
   五支裝置

   程式內部：
   中央第 3 支是第一個接收擾動的節點

   但畫面上完全不顯示這件事
====================================== */

const DEVICE_COUNT = 5;

const SOURCE_INDEX = 2;

const devices = [];



/* ======================================
   攝像頭
====================================== */

let cameraStream = null;

let cameraReady = false;



/* ======================================
   攝像頭感知
====================================== */

const viewer = {

  present:false,

  movement:0,

  movementX:.5,

  stayTime:0,

  absentTime:0,

  sensitivity:35

};



/* ======================================
   前一幀
====================================== */

let previousFrame = null;



/* ======================================
   群體混亂程度

   0 = 穩定
   1 = 高度失序
====================================== */

let globalChaos = 0;



/* ======================================
   Device
====================================== */

class Device{


constructor(index){


  this.index =
  index;



  /*
    左右旋轉角度

    -90 = 朝左
      0 = 朝前
     90 = 朝右
  */

  this.yaw =

  random(-4,4);



  this.targetYaw =

  this.yaw;



  /*
    記憶
  */

  this.memoryYaw =

  random(-7,7);



  /*
    個體差異
  */

  this.neighborWeight =

  random(.32,.55);



  this.memoryWeight =

  random(.15,.32);



  this.randomWeight =

  random(.08,.20);



  /*
    每支棒子的自主節奏
  */

  this.phase =

  random(

    0,

    Math.PI * 2

  );



  /*
    活性
  */

  this.activity =

  random(.03,.08);

}



/* ======================================
   更新
====================================== */

update(){


  const neighbor =

  this.getNeighbor();



  /*
    距離資訊起點
  */

  const distanceFromSource =

  Math.abs(

    this.index -
    SOURCE_INDEX

  );



  /* ==================================
     無人狀態
  ================================== */

  if(
    !viewer.present
  ){


    /*
      很微弱的自主活動
    */

    const calmWave =

    Math.sin(

      performance.now()
      /
      2200

      +

      this.phase

    )

    *
    4;



    this.targetYaw =

    neighbor *
    .42

    +

    this.memoryYaw *
    .35

    +

    calmWave *
    .23;



    /*
      非常慢
    */

    this.yaw =

    lerp(

      this.yaw,

      this.targetYaw,

      .018

    );



    this.activity =

    lerp(

      this.activity,

      .03,

      .02

    );


    return;

  }



  /* ==================================
     有人進入
  ================================== */


  /*
    影響從中央向兩側擴散

    3 → 2、4 → 1、5
  */

  let propagation = 1;


  if(
    distanceFromSource === 1
  ){

    propagation =
    .66;

  }


  if(
    distanceFromSource === 2
  ){

    propagation =
    .36;

  }



  /* ==================================
     第一個節點受到刺激
  ================================== */

  let sourceStimulus = 0;


  if(
    this.index ===
    SOURCE_INDEX
  ){


    sourceStimulus =

    .20

    +

    viewer.movement *
    5

    +

    Math.min(

      viewer.stayTime
      /
      15000,

      .42

    );

  }



  /*
    人的位置不決定旋轉方向。

    人只提供「擾動強度」。
  */

  const sourceDisturbance =

  random(
    -75,
    75
  )

  *

  sourceStimulus;



  /* ==================================
     鄰居影響
  ================================== */

  const neighborInfluence =

  neighbor

  *

  this.neighborWeight;



  /* ==================================
     記憶
  ================================== */

  const memoryInfluence =

  this.memoryYaw

  *

  this.memoryWeight;



  /* ==================================
     個體隨機偏差
  ================================== */

  const randomInfluence =

  random(
    -50,
    50
  )

  *

  this.randomWeight

  *

  (
    .2 +
    globalChaos
  );



  /* ==================================
     群體波動
  ================================== */

  const groupWave =

  Math.sin(

    performance.now()
    /
    620

    +

    this.phase

  )

  *

  18

  *

  globalChaos

  *

  propagation;



  /* ==================================
     最後角度
  ================================== */

  this.targetYaw =

  neighborInfluence

  +

  memoryInfluence

  +

  randomInfluence

  +

  groupWave;



  /*
    第一支接收資訊的個體
    再加第一手刺激
  */

  if(
    this.index ===
    SOURCE_INDEX
  ){

    this.targetYaw +=

    sourceDisturbance;

  }



  this.targetYaw =

  constrain(

    this.targetYaw,

    -85,
    85

  );



  /* ==================================
     速度

     中間先動

     第二層較慢

     最外層最慢
  ================================== */

  let speed =

  .012

  +

  globalChaos *
  .038

  +

  this.activity *
  .015;



  if(
    distanceFromSource === 0
  ){

    speed *=
    1.35;

  }


  if(
    distanceFromSource === 1
  ){

    speed *=
    .78;

  }


  if(
    distanceFromSource === 2
  ){

    speed *=
    .52;

  }



  this.yaw =

  lerp(

    this.yaw,

    this.targetYaw,

    speed

  );



  /* ==================================
     活性
  ================================== */

  this.activity =

  lerp(

    this.activity,

    constrain(

      globalChaos *
      propagation

      +

      sourceStimulus *
      .5,

      0,
      1

    ),

    .025

  );



  /* ==================================
     留下記憶
  ================================== */

  this.memoryYaw =

  lerp(

    this.memoryYaw,

    this.yaw,

    .002

  );

}



/* ======================================
   鄰居資訊
====================================== */

getNeighbor(){


  let total = 0;

  let count = 0;



  if(
    this.index >
    0
  ){


    total +=

    devices[
      this.index - 1
    ].yaw;


    count++;

  }



  if(
    this.index <
    DEVICE_COUNT - 1
  ){


    total +=

    devices[
      this.index + 1
    ].yaw;


    count++;

  }



  if(
    count === 0
  ){

    return this.yaw;

  }



  return total / count;

}


}



/* ======================================
   初始化
====================================== */

function init(){


  devices.length =
  0;



  for(
    let i=0;
    i<DEVICE_COUNT;
    i++
  ){


    devices.push(

      new Device(i)

    );

  }



  globalChaos =
  0;


  viewer.present =
  false;


  viewer.movement =
  0;


  viewer.stayTime =
  0;


  viewer.absentTime =
  0;

}



/* ======================================
   畫布尺寸
====================================== */

function resize(){


  const rect =

  canvas
  .parentElement
  .getBoundingClientRect();



  canvas.width =

  rect.width *
  devicePixelRatio;



  canvas.height =

  rect.height *
  devicePixelRatio;



  canvas.style.width =

  rect.width +
  "px";



  canvas.style.height =

  rect.height +
  "px";



  ctx.setTransform(

    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0

  );



  W =
  rect.width;


  H =
  rect.height;

}



window.addEventListener(

  "resize",

  resize

);



/* ======================================
   開啟攝像頭
====================================== */

document
.getElementById(
  "cameraBtn"
)
.onclick = async () => {


  try{



    if(

      !navigator.mediaDevices

      ||

      !navigator.mediaDevices.getUserMedia

    ){


      throw new Error(

        "目前瀏覽器無法使用攝像頭"

      );

    }



    cameraStream =

    await navigator
    .mediaDevices
    .getUserMedia({

      video:{

        width:{
          ideal:640
        },

        height:{
          ideal:480
        },

        facingMode:"user"

      },

      audio:false

    });



    video.srcObject =

    cameraStream;



    await video.play();



    cameraReady =
    true;



    previousFrame =
    null;



    document
    .getElementById(
      "cameraBtn"
    )
    .textContent =

    "攝像頭已開啟";


  }
  catch(error){


    cameraReady =
    false;



    console.error(
      error
    );



    document
    .getElementById(
      "globalStatus"
    )
    .innerHTML = `

      <b>
      攝像頭啟動失敗
      </b>

      <br><br>

      ${error.message}

    `;

  }

};



/* ======================================
   模擬觀者離開
====================================== */

document
.getElementById(
  "leaveBtn"
)
.onclick = () => {


  viewer.present =
  false;


  viewer.movement =
  0;


  viewer.stayTime =
  0;


  viewer.absentTime =
  0;

};



/* ======================================
   敏感度
====================================== */

document
.getElementById(
  "sensitivity"
)
.addEventListener(

  "input",

  e => {


    viewer.sensitivity =

    Number(
      e.target.value
    );



    document
    .getElementById(
      "sensitivityValue"
    )
    .textContent =

    viewer.sensitivity;

  }

);



/* ======================================
   Reset
====================================== */

document
.getElementById(
  "resetBtn"
)
.onclick = () => {


  init();

};



/* ======================================
   攝影機畫面分析
====================================== */

function analyzeCamera(){


  if(
    !cameraReady
  ){

    return;

  }



  if(
    video.readyState <
    2
  ){

    return;

  }



  analysisCtx.drawImage(

    video,

    0,
    0,

    analysisCanvas.width,
    analysisCanvas.height

  );



  const image =

  analysisCtx
  .getImageData(

    0,
    0,

    analysisCanvas.width,
    analysisCanvas.height

  );



  const data =

  image.data;



  /*
    第一幀
  */

  if(
    !previousFrame
  ){


    previousFrame =

    new Uint8ClampedArray(
      data
    );


    return;

  }



  let changedPixels = 0;

  let changedXTotal = 0;



  const width =

  analysisCanvas.width;


  const height =

  analysisCanvas.height;



  /*
    敏感度越高
    threshold越低
  */

  const threshold =

  map(

    viewer.sensitivity,

    5,
    80,

    75,
    18

  );



  /*
    每4px取樣
  */

  for(
    let y=0;
    y<height;
    y+=4
  ){


    for(
      let x=0;
      x<width;
      x+=4
    ){


      const index =

      (
        y *
        width

        +

        x
      )

      *
      4;



      const difference =

      Math.abs(

        data[index]

        -

        previousFrame[index]

      )

      +

      Math.abs(

        data[index+1]

        -

        previousFrame[index+1]

      )

      +

      Math.abs(

        data[index+2]

        -

        previousFrame[index+2]

      );



      if(
        difference >
        threshold
      ){


        changedPixels++;


        changedXTotal +=
        x;

      }

    }

  }



  previousFrame =

  new Uint8ClampedArray(
    data
  );



  const sampleCount =

  Math.ceil(
    width / 4
  )

  *

  Math.ceil(
    height / 4
  );



  const movementRatio =

  changedPixels

  /

  sampleCount;



  viewer.movement =

  lerp(

    viewer.movement,

    movementRatio,

    .28

  );



  /*
    擾動大概發生的位置

    只供畫面顯示使用

    不會決定棒子方向
  */

  if(
    changedPixels >
    0
  ){


    let avgX =

    changedXTotal

    /

    changedPixels;



    avgX =

    width -
    avgX;



    viewer.movementX =

    lerp(

      viewer.movementX,

      avgX /
      width,

      .25

    );

  }



  /*
    判斷觀者存在
  */

  if(
    movementRatio >
    .009
  ){


    viewer.present =
    true;


    viewer.absentTime =
    0;

  }
  else{


    viewer.absentTime +=
    100;



    /*
      約4秒沒變化
      才視為離開
    */

    if(
      viewer.absentTime >
      4000
    ){


      viewer.present =
      false;

    }

  }

}



/* ======================================
   更新群體
====================================== */

function updateSystem(dt){


  if(
    viewer.present
  ){


    viewer.stayTime +=
    dt;



    const movementFactor =

    constrain(

      viewer.movement *
      9,

      0,
      1

    );



    const stayFactor =

    constrain(

      viewer.stayTime
      /
      15000,

      0,
      1

    );



    /*
      有人出現
      本身就會增加一點擾動

      移動、停留再進一步增加
    */

    const targetChaos =

    constrain(

      .14

      +

      movementFactor *
      .46

      +

      stayFactor *
      .40,

      0,
      1

    );



    globalChaos =

    lerp(

      globalChaos,

      targetChaos,

      .015

    );

  }
  else{


    /*
      人離開之後
      不馬上恢復
    */

    globalChaos =

    lerp(

      globalChaos,

      0,

      .0035

    );



    viewer.stayTime =
    0;



    viewer.movement =

    lerp(

      viewer.movement,

      0,

      .04

    );

  }

}



/* ======================================
   Animation
====================================== */

let lastTime =

performance.now();


let lastAnalyze =

0;



function draw(){


  const now =

  performance.now();



  const dt =

  Math.min(

    50,

    now -
    lastTime

  );


  lastTime =
  now;



  /*
    每100ms分析攝像頭
  */

  if(

    now -
    lastAnalyze >
    100

  ){


    analyzeCamera();


    lastAnalyze =
    now;

  }



  updateSystem(
    dt
  );



  ctx.clearRect(

    0,
    0,
    W,
    H

  );



  drawGround();



  devices.forEach(

    device =>
    device.update()

  );



  devices.forEach(

    drawDevice

  );



  drawViewerInfluence();



  updateDebug();



  requestAnimationFrame(
    draw
  );

}



/* ======================================
   場地
====================================== */

function drawGround(){


  ctx.strokeStyle =

  "rgba(45,49,48,.08)";


  ctx.lineWidth =
  1;


  ctx.beginPath();


  ctx.moveTo(

    50,

    H * .74

  );


  ctx.lineTo(

    W - 50,

    H * .74

  );


  ctx.stroke();

}



/* ======================================
   五支裝置位置
====================================== */

function getPosition(index){


  return{

    x:

    map(

      index,

      0,
      DEVICE_COUNT - 1,

      W * .18,
      W * .82

    ),


    y:

    H * .50

  };

}



/* ======================================
   畫黑色細長棒狀裝置
====================================== */

function drawDevice(device){


  const pos =

  getPosition(
    device.index
  );



  /*
    細長型
  */

  const bodyHeight =
  205;


  const bodyWidth =
  20;



  const yawRad =

  device.yaw

  *

  Math.PI

  /

  180;



  ctx.save();



  ctx.translate(

    pos.x,

    pos.y

  );



  /*
    整體圓柱陰影
  */

  ctx.shadowBlur =

  7

  +

  device.activity *
  10;


  ctx.shadowColor =

  "rgba(0,0,0,.24)";



  /*
    黑色圓柱本體

    所有棒子完全相同顏色
  */

  const bodyGradient =

  ctx.createLinearGradient(

    -bodyWidth / 2,

    0,

    bodyWidth / 2,

    0

  );



  /*
    光影隨旋轉稍微偏移

    讓人感覺整支本體有旋轉
  */

  const lightShift =

  Math.sin(
    yawRad
  )

  *
  .15;



  bodyGradient.addColorStop(

    0,

    "#020202"

  );


  bodyGradient.addColorStop(

    constrain(
      .32 + lightShift,
      .15,
      .45
    ),

    "#0a0a0a"

  );


  bodyGradient.addColorStop(

    constrain(
      .52 + lightShift,
      .35,
      .70
    ),

    "#282828"

  );


  bodyGradient.addColorStop(

    constrain(
      .72 + lightShift,
      .55,
      .88
    ),

    "#0f0f0f"

  );


  bodyGradient.addColorStop(

    1,

    "#020202"

  );



  ctx.fillStyle =
  bodyGradient;



  ctx.beginPath();


  ctx.roundRect(

    -bodyWidth / 2,

    -bodyHeight / 2,

    bodyWidth,

    bodyHeight,

    bodyWidth / 2

  );


  ctx.fill();



  /*
    上方圓面
  */

  ctx.shadowBlur =
  0;


  ctx.fillStyle =
  "#161616";


  ctx.beginPath();


  ctx.ellipse(

    0,

    -bodyHeight / 2,

    bodyWidth / 2,

    3.2,

    0,

    0,

    Math.PI * 2

  );


  ctx.fill();



  /*
    下方圓面
  */

  ctx.fillStyle =
  "#050505";


  ctx.beginPath();


  ctx.ellipse(

    0,

    bodyHeight / 2,

    bodyWidth / 2,

    3.2,

    0,

    0,

    Math.PI * 2

  );


  ctx.fill();



  /* ==================================
     攝像頭電子模組

     這個模組固定在棒子上，
     所以棒子旋轉時，
     它會一起轉到左／右／背面
  ================================== */


  /*
    攝像頭在棒子上方
  */

  const cameraY =

  -bodyHeight *
  .28;



  /*
    模組在圓柱表面的位置
  */

  const cameraOffsetX =

  Math.sin(
    yawRad
  )

  *

  (
    bodyWidth *
    .52
  );



  /*
    轉到側面時，
    元件看起來會比較窄
  */

  const facing =

  Math.abs(

    Math.cos(
      yawRad
    )

  );



  /*
    模組轉到背面時
    透明度降低

    代表它繞到棒子後面
  */

  const cameraVisible =

  .32

  +

  facing *
  .68;



  ctx.globalAlpha =

  cameraVisible;



  /*
    綠黑色電子板
  */

  const moduleWidth =

  19

  *

  (
    .30 +
    facing * .70
  );


  const moduleHeight =
  17;



  ctx.fillStyle =
  "#18221c";


  ctx.strokeStyle =
  "#404942";


  ctx.lineWidth =
  1;



  ctx.beginPath();


  ctx.roundRect(

    cameraOffsetX

    -

    moduleWidth / 2,

    cameraY

    -

    moduleHeight / 2,

    moduleWidth,

    moduleHeight,

    2

  );


  ctx.fill();

  ctx.stroke();



  /*
    攝像頭鏡頭
  */

  const lensRadius =

  Math.max(

    2,

    4.5 *
    (
      .35 +
      facing *
      .65
    )

  );



  ctx.fillStyle =
  "#020202";


  ctx.beginPath();


  ctx.arc(

    cameraOffsetX,

    cameraY,

    lensRadius,

    0,

    Math.PI * 2

  );


  ctx.fill();



  /*
    鏡頭玻璃反光
  */

  ctx.fillStyle =
  "rgba(110,145,160,.45)";


  ctx.beginPath();


  ctx.arc(

    cameraOffsetX

    -

    lensRadius *
    .28,

    cameraY

    -

    lensRadius *
    .28,

    Math.max(
      .7,
      lensRadius *
      .24
    ),

    0,

    Math.PI * 2

  );


  ctx.fill();



  /*
    模組小接點
  */

  ctx.fillStyle =
  "#777c71";


  ctx.beginPath();


  ctx.arc(

    cameraOffsetX

    -

    moduleWidth *
    .35,

    cameraY

    +

    moduleHeight *
    .32,

    1,

    0,

    Math.PI * 2

  );


  ctx.fill();



  ctx.beginPath();


  ctx.arc(

    cameraOffsetX

    +

    moduleWidth *
    .35,

    cameraY

    +

    moduleHeight *
    .32,

    1,

    0,

    Math.PI * 2

  );


  ctx.fill();



  ctx.globalAlpha =
  1;



  /*
    底部小固定座
  */

  ctx.fillStyle =
  "#181818";


  ctx.beginPath();


  ctx.ellipse(

    0,

    bodyHeight / 2 +
    7,

    14,

    4,

    0,

    0,

    Math.PI * 2

  );


  ctx.fill();



  ctx.restore();

}



/* ======================================
   畫面顯示擾動範圍

   只作Debug用途
====================================== */

function drawViewerInfluence(){


  if(
    !viewer.present
  ){

    return;

  }



  const x =

  map(

    viewer.movementX,

    0,
    1,

    W * .10,
    W * .90

  );



  const radius =

  35

  +

  globalChaos *
  90;



  const gradient =

  ctx.createRadialGradient(

    x,

    H * .85,

    0,

    x,

    H * .85,

    radius

  );



  gradient.addColorStop(

    0,

    `rgba(
      50,
      50,
      50,
      ${.08 + globalChaos * .07}
    )`

  );



  gradient.addColorStop(

    1,

    "rgba(50,50,50,0)"

  );



  ctx.fillStyle =
  gradient;



  ctx.beginPath();


  ctx.arc(

    x,

    H * .85,

    radius,

    0,

    Math.PI * 2

  );


  ctx.fill();



  ctx.fillStyle =
  "#555";


  ctx.beginPath();


  ctx.arc(

    x,

    H * .85,

    5,

    0,

    Math.PI * 2

  );


  ctx.fill();


}

}



/* ======================================
   Utility
====================================== */

function random(
  min,
  max
){


  if(
    max ===
    undefined
  ){


    max =
    min;


    min =
    0;

  }



  return(

    Math.random()

    *

    (
      max -
      min
    )

    +

    min

  );

}



function map(
  value,
  inMin,
  inMax,
  outMin,
  outMax
){


  return(

    (
      value -
      inMin
    )

    /

    (
      inMax -
      inMin
    )

    *

    (
      outMax -
      outMin
    )

    +

    outMin

  );

}



function lerp(
  a,
  b,
  t
){


  return(

    a

    +

    (
      b -
      a
    )

    *
    t

  );

}



function constrain(
  value,
  min,
  max
){


  return Math.max(

    min,

    Math.min(

      max,

      value

    )

  );

}
