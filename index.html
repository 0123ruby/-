<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>誤會機器｜五支棒子群體模擬</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;

  background:#f3efe6;
  color:#303633;

  font-family:
  "Microsoft JhengHei",
  "Noto Sans TC",
  sans-serif;
}


#app{

  display:grid;

  grid-template-columns:
  1fr
  340px;

  height:100vh;

}


/* =========================
   左側畫面
========================= */

#stageWrap{

  position:relative;

  overflow:hidden;

  background:

  radial-gradient(
    circle at center,
    #faf9f5 0%,
    #ece8df 100%
  );

}


#stage{

  width:100%;
  height:100%;

  display:block;

}


#title{

  position:absolute;

  left:28px;
  top:22px;

  pointer-events:none;

}


#title h1{

  margin:0;

  font-size:26px;

}


#title p{

  margin:6px 0 0;

  color:#687772;

  font-size:13px;

}


#hint{

  position:absolute;

  left:28px;
  bottom:24px;

  padding:10px 14px;

  background:
  rgba(255,255,255,.88);

  border-radius:10px;

  font-size:13px;

}


/* =========================
   右側控制區
========================= */

#panel{

  padding:22px;

  background:#fbfaf7;

  border-left:
  1px solid #ddd8ce;

  overflow-y:auto;

}


.section{

  margin-bottom:22px;

}


.sectionTitle{

  color:#a84d3d;

  font-size:13px;

  font-weight:bold;

  margin-bottom:10px;

}


video{

  width:100%;

  border-radius:8px;

  background:#111;

  transform:scaleX(-1);

}


button{

  width:100%;

  padding:11px;

  margin-bottom:8px;

  border:none;

  border-radius:9px;

  font-weight:bold;

  cursor:pointer;

}


#cameraBtn{

  background:#ad4c3d;

  color:white;

}


#leaveBtn{

  background:#e5e0d6;

}


#resetBtn{

  background:#d4d4cf;

}


label{

  display:block;

  margin:10px 0 5px;

  font-size:13px;

}


input[type="range"]{

  width:100%;

}


.status{

  padding:10px;

  background:#fff;

  border:
  1px solid #dfdbd2;

  border-radius:8px;

  font-size:12px;

  line-height:1.7;

}


.device{

  margin-bottom:7px;

  padding:8px 10px;

  background:#fff;

  border:
  1px solid #e3dfd6;

  border-radius:7px;

  font-size:11px;

  line-height:1.5;

}


.leader{

  border:
  2px solid #a84d3d;

}

</style>

</head>


<body>


<div id="app">


<!-- =========================
     左側模擬
========================= -->

<div id="stageWrap">


<canvas id="stage"></canvas>


<div id="title">

  <h1>
    《誤會機器》
  </h1>

  <p>
    五支圓柱 × 固定主導者 × 攝像頭擾動
  </p>

</div>


<div id="hint">

  第 3 支永遠是主導者。觀者只造成擾動，不直接控制棒子的朝向。

</div>


</div>



<!-- =========================
     右側控制
========================= -->

<aside id="panel">


<div class="section">

  <div class="sectionTitle">
    電腦攝像頭
  </div>


  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <br><br>


  <button id="cameraBtn">
    開啟攝像頭
  </button>


  <button id="leaveBtn">
    模擬觀者離開
  </button>

</div>



<div class="section">

  <div class="sectionTitle">
    感知設定
  </div>


  <label>

    攝像頭敏感度：

    <span id="sensitivityValue">
      35
    </span>

  </label>


  <input
    type="range"
    id="sensitivity"
    min="5"
    max="80"
    value="35">

</div>



<div class="section">

  <div class="sectionTitle">
    系統狀態
  </div>


  <div
    id="globalStatus"
    class="status">

    尚未開啟攝像頭

  </div>

</div>



<div class="section">

  <div class="sectionTitle">
    個體狀態
  </div>


  <div id="deviceStatus">
  </div>

</div>



<button id="resetBtn">
  重設系統
</button>


</aside>


</div>



<!-- =========================
     隱藏攝像頭分析畫布
========================= -->

<canvas
  id="analysisCanvas"
  width="160"
  height="120"
  style="display:none;">
</canvas>



<script>

/* ======================================
   DOM
====================================== */

const canvas =

document.getElementById(
  "stage"
);


const ctx =

canvas.getContext(
  "2d"
);


const video =

document.getElementById(
  "video"
);


const analysisCanvas =

document.getElementById(
  "analysisCanvas"
);


const analysisCtx =

analysisCanvas.getContext(

  "2d",

  {
    willReadFrequently:true
  }

);



/* ======================================
   畫布
====================================== */

let W = 0;

let H = 0;



/* ======================================
   裝置設定

   只有 5 支
   第 3 支固定主導
====================================== */

const DEVICE_COUNT = 5;

const LEADER_INDEX = 2;

const devices = [];



/* ======================================
   攝像頭
====================================== */

let cameraStream = null;

let cameraReady = false;



/* ======================================
   觀者狀態
====================================== */

const viewer = {

  present:false,

  movement:0,

  movementX:.5,

  stayTime:0,

  absentTime:0,

  sensitivity:35

};



/* ======================================
   攝像頭前一幀
====================================== */

let previousFrame = null;



/* ======================================
   群體混亂度

   0 = 平靜
   1 = 非常混亂
====================================== */

let globalChaos = 0;



/* ======================================
   Device
====================================== */

class Device {


constructor(index){


  this.index =
  index;


  this.isLeader =

  index ===
  LEADER_INDEX;



  /*
    yaw：

    -90 = 左轉
      0 = 正面
     90 = 右轉

    棒子不移動位置
    只繞垂直軸旋轉
  */

  this.yaw =

  random(-5,5);


  this.targetYaw =

  this.yaw;



  /*
    自己過去的記憶
  */

  this.memoryYaw =

  random(-8,8);



  /*
    個體差異
  */

  this.neighborWeight =

  random(.30,.55);


  this.memoryWeight =

  random(.15,.35);


  this.randomWeight =

  random(.08,.22);



  /*
    每支自己的節奏
  */

  this.phase =

  random(
    0,
    Math.PI * 2
  );



  /*
    活性
  */

  this.activity =

  random(.04,.10);

}



/* ======================================
   更新
====================================== */

update(){


  const neighbor =

  this.getNeighbor();



  /* ==================================
     無人狀態
  ================================== */

  if(
    !viewer.present
  ){


    /*
      五支棒子維持一個
      很慢、微弱的自主秩序
    */

    const calmWave =

    Math.sin(

      performance.now()
      /
      1800

      +

      this.phase

    )

    *
    5;



    this.targetYaw =

    neighbor *
    .45

    +

    this.memoryYaw *
    .30

    +

    calmWave *
    .25;



    this.yaw =

    lerp(

      this.yaw,

      this.targetYaw,

      .025

    );



    this.activity =

    lerp(

      this.activity,

      .05,

      .02

    );


    return;

  }



  /* ==================================
     有人進入
  ================================== */


  /*
    距離主導者：

    3號 = 0
    2、4號 = 1
    1、5號 = 2
  */

  const distanceFromLeader =

  Math.abs(

    this.index -
    LEADER_INDEX

  );



  /*
    影響層級：

    主導者最強

    第二層
    2、4

    第三層
    1、5
  */

  const propagation =

  distanceFromLeader === 0
  ?
  1

  :

  distanceFromLeader === 1
  ?
  .72

  :

  .42;



  /* ==================================
     主導者第一手刺激
  ================================== */

  let leaderStimulus = 0;


  if(
    this.isLeader
  ){


    /*
      人存在
      +
      移動
      +
      停留

      都只會增加刺激強度

      不決定方向
    */

    leaderStimulus =

    .25

    +

    viewer.movement *
    5

    +

    Math.min(

      viewer.stayTime
      /
      12000,

      .45

    );

  }



  /*
    主導者產生
    不可預測的旋轉方向
  */

  const leaderDisturbance =

  random(
    -85,
    85
  )

  *

  leaderStimulus;



  /* ==================================
     鄰居影響
  ================================== */

  const neighborInfluence =

  neighbor

  *

  this.neighborWeight;



  /* ==================================
     過去記憶
  ================================== */

  const memoryInfluence =

  this.memoryYaw

  *

  this.memoryWeight;



  /* ==================================
     隨機偏差
  ================================== */

  const randomInfluence =

  random(
    -55,
    55
  )

  *

  this.randomWeight

  *

  (
    .25
    +
    globalChaos
  );



  /* ==================================
     群體振盪
  ================================== */

  const wave =

  Math.sin(

    performance.now()
    /
    500

    +

    this.phase

  )

  *

  22

  *

  globalChaos

  *

  propagation;



  /* ==================================
     最終目標方向
  ================================== */

  this.targetYaw =

  neighborInfluence

  +

  memoryInfluence

  +

  randomInfluence

  +

  wave;



  /*
    只有 3 號
    直接接收第一手刺激
  */

  if(
    this.isLeader
  ){

    this.targetYaw +=

    leaderDisturbance;

  }



  this.targetYaw =

  constrain(

    this.targetYaw,

    -90,
    90

  );



  /* ==================================
     轉動速度

     距離主導者越遠
     反應越慢
  ================================== */

  let speed =

  .012

  +

  globalChaos *
  .045

  +

  this.activity *
  .018;



  /*
    主導者最快
  */

  if(
    distanceFromLeader === 0
  ){

    speed +=
    .035;

  }


  /*
    2、4號
  */

  if(
    distanceFromLeader === 1
  ){

    speed *=
    .72;

  }


  /*
    1、5號最慢
  */

  if(
    distanceFromLeader === 2
  ){

    speed *=
    .45;

  }



  this.yaw =

  lerp(

    this.yaw,

    this.targetYaw,

    speed

  );



  /* ==================================
     活性
  ================================== */

  this.activity =

  lerp(

    this.activity,

    constrain(

      globalChaos *
      propagation

      +

      leaderStimulus *
      .5,

      0,
      1

    ),

    .03

  );



  /* ==================================
     記憶
  ================================== */

  this.memoryYaw =

  lerp(

    this.memoryYaw,

    this.yaw,

    .0025

  );

}



/* ======================================
   取得鄰居
====================================== */

getNeighbor(){


  let total = 0;

  let count = 0;



  if(
    this.index >
    0
  ){

    total +=

    devices[
      this.index - 1
    ].yaw;


    count++;

  }



  if(
    this.index <
    DEVICE_COUNT - 1
  ){

    total +=

    devices[
      this.index + 1
    ].yaw;


    count++;

  }



  if(
    count === 0
  ){

    return this.yaw;

  }



  return total / count;

}


}



/* ======================================
   初始化
====================================== */

function init(){


  devices.length =
  0;



  for(
    let i = 0;
    i < DEVICE_COUNT;
    i++
  ){

    devices.push(

      new Device(i)

    );

  }



  globalChaos =
  0;


  viewer.present =
  false;


  viewer.movement =
  0;


  viewer.stayTime =
  0;


  viewer.absentTime =
  0;

}



/* ======================================
   畫布尺寸
====================================== */

function resize(){


  const rect =

  canvas
  .parentElement
  .getBoundingClientRect();



  canvas.width =

  rect.width *
  devicePixelRatio;



  canvas.height =

  rect.height *
  devicePixelRatio;



  canvas.style.width =

  rect.width +
  "px";



  canvas.style.height =

  rect.height +
  "px";



  ctx.setTransform(

    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0

  );



  W =
  rect.width;


  H =
  rect.height;

}


window.addEventListener(

  "resize",

  resize

);



/* ======================================
   開啟攝像頭
====================================== */

document
.getElementById(
  "cameraBtn"
)
.onclick = async () => {


  try{


    if(

      !navigator.mediaDevices

      ||

      !navigator.mediaDevices.getUserMedia

    ){

      throw new Error(
        "目前瀏覽器無法使用攝像頭"
      );

    }



    cameraStream =

    await navigator
    .mediaDevices
    .getUserMedia({

      video:{

        width:{
          ideal:640
        },

        height:{
          ideal:480
        },

        facingMode:"user"

      },

      audio:false

    });



    video.srcObject =

    cameraStream;



    await video.play();



    cameraReady =
    true;



    previousFrame =
    null;



    document
    .getElementById(
      "cameraBtn"
    )
    .textContent =

    "攝像頭已開啟";


  }
  catch(error){


    cameraReady =
    false;


    console.error(
      error
    );


    document
    .getElementById(
      "globalStatus"
    )
    .innerHTML = `

      <b>
      攝像頭啟動失敗
      </b>

      <br><br>

      ${error.message}

    `;

  }

};



/* ======================================
   模擬觀者離開
====================================== */

document
.getElementById(
  "leaveBtn"
)
.onclick = () => {


  viewer.present =
  false;


  viewer.movement =
  0;


  viewer.stayTime =
  0;


  viewer.absentTime =
  0;

};



/* ======================================
   攝像頭敏感度
====================================== */

document
.getElementById(
  "sensitivity"
)
.addEventListener(

  "input",

  e => {


    viewer.sensitivity =

    Number(
      e.target.value
    );



    document
    .getElementById(
      "sensitivityValue"
    )
    .textContent =

    viewer.sensitivity;

  }

);



/* ======================================
   Reset
====================================== */

document
.getElementById(
  "resetBtn"
)
.onclick =

() => {

  init();

};



/* ======================================
   攝像頭分析
====================================== */

function analyzeCamera(){


  if(
    !cameraReady
  ){

    return;

  }



  if(
    video.readyState <
    2
  ){

    return;

  }



  analysisCtx.drawImage(

    video,

    0,
    0,

    analysisCanvas.width,
    analysisCanvas.height

  );



  const image =

  analysisCtx
  .getImageData(

    0,
    0,

    analysisCanvas.width,
    analysisCanvas.height

  );



  const data =

  image.data;



  /*
    第一幀
  */

  if(
    !previousFrame
  ){


    previousFrame =

    new Uint8ClampedArray(
      data
    );


    return;

  }



  let changedPixels = 0;

  let changedXTotal = 0;



  const width =

  analysisCanvas.width;


  const height =

  analysisCanvas.height;



  /*
    敏感度越高
    threshold 越低
  */

  const threshold =

  map(

    viewer.sensitivity,

    5,
    80,

    75,
    18

  );



  /*
    每4像素取一次
  */

  for(
    let y=0;
    y<height;
    y+=4
  ){


    for(
      let x=0;
      x<width;
      x+=4
    ){


      const index =

      (
        y *
        width

        +

        x
      )

      *
      4;



      const difference =

      Math.abs(

        data[index]

        -

        previousFrame[index]

      )

      +

      Math.abs(

        data[index+1]

        -

        previousFrame[index+1]

      )

      +

      Math.abs(

        data[index+2]

        -

        previousFrame[index+2]

      );



      if(
        difference >
        threshold
      ){


        changedPixels++;

        changedXTotal +=
        x;

      }

    }

  }



  previousFrame =

  new Uint8ClampedArray(
    data
  );



  const sampleCount =

  Math.ceil(
    width / 4
  )

  *

  Math.ceil(
    height / 4
  );



  const movementRatio =

  changedPixels

  /

  sampleCount;



  viewer.movement =

  lerp(

    viewer.movement,

    movementRatio,

    .28

  );



  /*
    擾動位置

    只拿來顯示
    不拿來控制棒子朝向
  */

  if(
    changedPixels >
    0
  ){


    let avgX =

    changedXTotal

    /

    changedPixels;



    avgX =

    width -
    avgX;



    viewer.movementX =

    lerp(

      viewer.movementX,

      avgX / width,

      .25

    );

  }



  /*
    有明顯畫面變化
    視為觀者存在
  */

  if(
    movementRatio >
    .009
  ){


    viewer.present =
    true;


    viewer.absentTime =
    0;

  }
  else{


    viewer.absentTime +=
    100;



    /*
      4秒沒明顯變化
      視為離開
    */

    if(
      viewer.absentTime >
      4000
    ){

      viewer.present =
      false;

    }

  }

}



/* ======================================
   群體系統
====================================== */

function updateSystem(dt){


  if(
    viewer.present
  ){


    viewer.stayTime +=
    dt;



    const movementFactor =

    constrain(

      viewer.movement *
      9,

      0,
      1

    );



    const stayFactor =

    constrain(

      viewer.stayTime
      /
      12000,

      0,
      1

    );



    /*
      人越動
      人停越久

      混亂度越高
    */

    const targetChaos =

    constrain(

      .16

      +

      movementFactor *
      .44

      +

      stayFactor *
      .40,

      0,
      1

    );



    globalChaos =

    lerp(

      globalChaos,

      targetChaos,

      .018

    );

  }
  else{


    /*
      人離開後
      慢慢恢復
    */

    globalChaos =

    lerp(

      globalChaos,

      0,

      .004

    );



    viewer.stayTime =
    0;



    viewer.movement =

    lerp(

      viewer.movement,

      0,

      .05

    );

  }

}



/* ======================================
   動畫
====================================== */

let lastTime =

performance.now();


let lastAnalyze =

0;



function draw(){


  const now =

  performance.now();



  const dt =

  Math.min(

    50,

    now -
    lastTime

  );


  lastTime =
  now;



  /*
    每100ms分析一次鏡頭
  */

  if(
    now -
    lastAnalyze >
    100
  ){


    analyzeCamera();


    lastAnalyze =
    now;

  }



  updateSystem(
    dt
  );



  ctx.clearRect(

    0,
    0,
    W,
    H

  );



  drawGround();



  devices.forEach(

    device =>
    device.update()

  );



  drawConnections();



  devices.forEach(

    drawDevice

  );



  drawViewerInfluence();



  updateDebug();



  requestAnimationFrame(
    draw
  );

}



/* ======================================
   地面
====================================== */

function drawGround(){


  ctx.strokeStyle =

  "rgba(45,49,48,.10)";


  ctx.lineWidth =
  1;


  ctx.beginPath();


  ctx.moveTo(

    45,

    H * .73

  );


  ctx.lineTo(

    W - 45,

    H * .73

  );


  ctx.stroke();

}



/* ======================================
   五支棒子的位置
====================================== */

function getPosition(index){


  return{

    x:

    map(

      index,

      0,
      DEVICE_COUNT - 1,

      W * .20,
      W * .80

    ),


    y:

    H * .50

  };

}



/* ======================================
   畫整支圓柱

   重點：
   不是畫一條線在動
   而是整支圓柱的明暗面一起旋轉
====================================== */

function drawDevice(device){


  const pos =

  getPosition(
    device.index
  );



  const bodyHeight =
  160;



  const yawRad =

  device.yaw

  *

  Math.PI

  /

  180;



  /*
    圓柱轉側面時會變窄
  */

  const visibleWidth =

  13

  +

  34

  *

  Math.abs(

    Math.cos(
      yawRad
    )

  );



  /*
    正面亮面的位置
  */

  const surfaceShift =

  Math.sin(
    yawRad
  )

  *

  visibleWidth *
  .38;



  ctx.save();



  ctx.translate(

    pos.x,
    pos.y

  );



  /*
    活性越高
    光暈越強
  */

  ctx.shadowBlur =

  5

  +

  device.activity *
  24;



  ctx.shadowColor =

  device.isLeader

  ?

  "rgba(180,74,56,.55)"

  :

  "rgba(90,90,90,.24)";



  /*
    整支圓柱明暗

    gradient的位置
    會隨yaw移動

    所以看起來是整支轉
  */

  const gradient =

  ctx.createLinearGradient(

    -visibleWidth/2,
    0,

    visibleWidth/2,
    0

  );



  /*
    根據旋轉方向
    改變明暗面
  */

  const lightPos =

  constrain(

    .5

    +

    Math.sin(
      yawRad
    )
    *
    .32,

    .12,
    .88

  );



  const darkPos =

  constrain(

    lightPos -
    .34,

    0,
    1

  );



  const brightPos =

  constrain(

    lightPos +
    .25,

    0,
    1

  );



  gradient.addColorStop(

    0,

    "#3d413f"

  );


  gradient.addColorStop(

    darkPos,

    "#696b65"

  );


  gradient.addColorStop(

    lightPos,

    device.isLeader

    ?

    "#c66d57"

    :

    "#d6d1c6"

  );


  gradient.addColorStop(

    brightPos,

    "#f4f0e7"

  );


  gradient.addColorStop(

    1,

    "#575a56"

  );



  ctx.fillStyle =
  gradient;



  /*
    圓柱身體
  */

  ctx.beginPath();


  ctx.roundRect(

    -visibleWidth/2,

    -bodyHeight/2,

    visibleWidth,

    bodyHeight,

    visibleWidth/2

  );


  ctx.fill();



  /*
    上圓面
  */

  ctx.shadowBlur =
  0;


  ctx.fillStyle =

  device.isLeader

  ?

  "#c47a66"

  :

  "#c9c4b8";


  ctx.beginPath();


  ctx.ellipse(

    0,

    -bodyHeight/2,

    visibleWidth/2,

    Math.max(
      4,
      visibleWidth * .18
    ),

    0,

    0,

    Math.PI * 2

  );


  ctx.fill();



  /*
    下圓面
  */

  ctx.fillStyle =

  device.isLeader

  ?

  "#9f4d3d"

  :

  "#8f8a80";


  ctx.beginPath();


  ctx.ellipse(

    0,

    bodyHeight/2,

    visibleWidth/2,

    Math.max(
      4,
      visibleWidth * .18
    ),

    0,

    0,

    Math.PI * 2

  );


  ctx.fill();



  /*
    表面高光

    不是獨立線條
    而是圓柱表面的一部分
  */

  ctx.globalAlpha =
  .28;


  ctx.fillStyle =
  "#ffffff";


  ctx.beginPath();


  ctx.roundRect(

    surfaceShift -
    visibleWidth * .08,

    -bodyHeight/2 + 10,

    visibleWidth * .16,

    bodyHeight - 20,

    visibleWidth * .08

  );


  ctx.fill();


  ctx.globalAlpha =
  1;



  ctx.restore();



  /* ==================================
     編號
  ================================== */

  ctx.textAlign =
  "center";


  ctx.fillStyle =

  device.isLeader

  ?

  "#a84d3d"

  :

  "#59635f";


  ctx.font =

  device.isLeader

  ?

  "bold 12px sans-serif"

  :

  "11px sans-serif";



  if(
    device.isLeader
  ){


    ctx.fillText(

      "3",

      pos.x,

      pos.y +
      bodyHeight/2 +
      28

    );


    ctx.fillText(

      "主導者",

      pos.x,

      pos.y +
      bodyHeight/2 +
      45

    );

  }
  else{


    ctx.fillText(

      `${device.index + 1}`,

      pos.x,

      pos.y +
      bodyHeight/2 +
      32

    );

  }

}



/* ======================================
   群體傳播線

   只是系統Debug提示

   如果未來覺得太干擾
   可以拿掉
====================================== */

function drawConnections(){


  if(
    globalChaos <
    .08
  ){

    return;

  }



  for(
    let i = 0;
    i < DEVICE_COUNT - 1;
    i++
  ){


    const a =

    getPosition(i);


    const b =

    getPosition(
      i + 1
    );



    const activity =

    (
      devices[i].activity

      +

      devices[i+1].activity
    )

    /
    2;



    const wobble =

    Math.sin(

      performance.now()
      /
      210

      +

      i

    )

    *

    18

    *

    globalChaos;



    ctx.strokeStyle =

    `rgba(
      168,
      77,
      61,
      ${.03 + activity * .14}
    )`;


    ctx.lineWidth =

    1

    +

    activity;



    ctx.beginPath();



    ctx.moveTo(

      a.x,

      a.y - 95

    );



    ctx.quadraticCurveTo(

      (
        a.x +
        b.x
      )
      /
      2,

      a.y -
      125 +
      wobble,

      b.x,

      b.y -
      95

    );



    ctx.stroke();

  }

}



/* ======================================
   攝像頭擾動位置

   只是提示
   不控制棒子的朝向
====================================== */

function drawViewerInfluence(){


  if(
    !viewer.present
  ){

    return;

  }



  const x =

  map(

    viewer.movementX,

    0,
    1,

    W * .12,
    W * .88

  );



  const radius =

  45

  +

  globalChaos *
  110;



  const gradient =

  ctx.createRadialGradient(

    x,
    H * .84,
    0,

    x,
    H * .84,
    radius

  );



  gradient.addColorStop(

    0,

    `rgba(
      168,
      77,
      61,
      ${.10 + globalChaos * .08}
    )`

  );



  gradient.addColorStop(

    1,

    "rgba(168,77,61,0)"

  );



  ctx.fillStyle =
  gradient;



  ctx.beginPath();



  ctx.arc(

    x,

    H * .84,

    radius,

    0,

    Math.PI * 2

  );



  ctx.fill();



  ctx.fillStyle =
  "#a84d3d";


  ctx.beginPath();


  ctx.arc(

    x,

    H * .84,

    7,

    0,

    Math.PI * 2

  );


  ctx.fill();



  ctx.fillStyle =
  "#59635f";


  ctx.font =
  "12px sans-serif";


  ctx.textAlign =
  "center";


  ctx.fillText(

    "攝像頭偵測到擾動",

    x,

    H * .84 +
    28

  );

}

/* ======================================
   Utility
====================================== */

function random(
  min,
  max
){


  if(
    max ===
    undefined
  ){

    max =
    min;

    min =
    0;

  }



  return(

    Math.random()

    *

    (
      max -
      min
    )

    +

    min

  );

}



function map(
  value,
  inMin,
  inMax,
  outMin,
  outMax
){


  return(

    (
      value -
      inMin
    )

    /

    (
      inMax -
      inMin
    )

    *

    (
      outMax -
      outMin
    )

    +

    outMin

  );

}



function lerp(
  a,
  b,
  t
){


  return(

    a

    +

    (
      b -
      a
    )

    *
    t

  );

}



function constrain(
  value,
  min,
  max
){


  return Math.max(

    min,

    Math.min(

      max,

      value

    )

  );

}
