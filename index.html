<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>誤會機器｜順從 → 傳遞 → 群體偏差</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  overflow:hidden;

  background:#ece9e2;
  color:#303532;

  font-family:
  "Microsoft JhengHei",
  "Noto Sans TC",
  sans-serif;
}

#app{
  width:100%;
  height:100vh;

  display:grid;

  grid-template-columns:
  minmax(0,1fr)
  360px;
}

#stageWrap{
  position:relative;
  overflow:hidden;

  background:
  radial-gradient(
    circle at 50% 42%,
    #faf9f5 0%,
    #eeebe4 58%,
    #ded9cf 100%
  );
}

#stage{
  display:block;

  width:100%;
  height:100%;

  cursor:pointer;
}

#title{
  position:absolute;

  left:28px;
  top:24px;

  pointer-events:none;
}

#title h1{
  margin:0;
  font-size:28px;
}

#title p{
  margin:7px 0 0;

  font-size:13px;

  color:#6c736f;
}

#phaseBox{
  position:absolute;

  left:28px;
  bottom:25px;

  padding:11px 15px;

  background:rgba(255,255,255,.9);

  border:
  1px solid rgba(0,0,0,.05);

  border-radius:10px;

  font-size:13px;
  line-height:1.65;

  pointer-events:none;
}

#phaseName{
  font-weight:700;
}

#panel{
  padding:20px;

  overflow-y:auto;

  background:#faf9f6;

  border-left:
  1px solid #ddd8ce;
}

.section{
  margin-bottom:22px;
}

.sectionTitle{
  margin-bottom:10px;

  font-size:13px;
  font-weight:700;
}

video{
  display:block;

  width:100%;

  min-height:145px;

  object-fit:cover;

  background:#111;

  border-radius:8px;

  transform:
  scaleX(-1);
}

button{
  width:100%;

  margin:0 0 8px;

  padding:11px;

  border:0;

  border-radius:9px;

  font-weight:700;

  cursor:pointer;
}

button.dark{
  background:#222;
  color:#fff;
}

button.light{
  background:#e5e1da;
  color:#333;
}

button.gray{
  background:#d2cec5;
  color:#333;
}

button.test{
  background:#4b514e;
  color:#fff;
}

.status{
  padding:11px;

  background:#fff;

  border:
  1px solid #dedad1;

  border-radius:8px;

  font-size:12px;
  line-height:1.8;
}

label{
  display:block;

  margin:12px 0 5px;

  font-size:12px;
}

input[type="range"]{
  width:100%;
}

.meter{
  height:8px;

  margin-top:7px;

  overflow:hidden;

  background:#e1ddd5;

  border-radius:999px;
}

#cameraMeter,
#voiceMeter,
#chaosMeter{
  width:0%;
  height:100%;

  background:#373d3a;

  transition:
  width .07s linear;
}

.small{
  margin-top:8px;

  color:#777;

  font-size:11px;
  line-height:1.6;
}

</style>
</head>

<body>

<div id="app">

  <div id="stageWrap">

    <canvas id="stage"></canvas>

    <div id="title">

      <h1>
        《誤會機器》
      </h1>

      <p>
        順從 → 說話 → 資訊傳遞 → 群體偏差
      </p>

    </div>

    <div id="phaseBox">

      目前狀態：

      <span id="phaseName">
        順從
      </span>

      <br>

      <span id="phaseDescription">
        裝置正在跟隨觀者的位置。
      </span>

    </div>

  </div>


  <aside id="panel">


    <!-- CAMERA -->

    <div class="section">

      <div class="sectionTitle">
        觀者位置
      </div>

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <br>

      <button
        id="cameraBtn"
        class="dark">
        開啟攝像頭
      </button>

      <div class="status">

        攝像頭：
        <b id="cameraState">
          未啟動
        </b>

        <br>

        觀者位置：
        <b id="viewerPosition">
          —
        </b>

        <br>

        動作量：

        <b>
          <span id="cameraPercent">
            0
          </span>%
        </b>

        <div class="meter">
          <div id="cameraMeter"></div>
        </div>

      </div>

    </div>


    <!-- MICROPHONE -->

    <div class="section">

      <div class="sectionTitle">
        聲音觸發
      </div>

      <button
        id="micBtn"
        class="dark">
        開啟麥克風
      </button>

      <button
        id="micStopBtn"
        class="light">
        停止麥克風
      </button>

      <button
        id="simulateVoiceBtn"
        class="test">
        模擬說話／開始傳遞
      </button>

      <div class="status">

        麥克風：

        <b id="micState">
          未啟動
        </b>

        <br>

        聲音強度：

        <b>
          <span id="voicePercent">
            0
          </span>%
        </b>

        <div class="meter">
          <div id="voiceMeter"></div>
        </div>

      </div>

      <div class="small">
        順從階段中，說話超過門檻後，
        距離觀者最近的裝置會成為資訊起點。
      </div>

    </div>


    <!-- SYSTEM -->

    <div class="section">

      <div class="sectionTitle">
        群體狀態
      </div>

      <div class="status">

        階段：

        <b id="modeText">
          順從
        </b>

        <br>

        資訊起點：

        <b id="sourceText">
          —
        </b>

        <br>

        混亂程度：

        <b>
          <span id="chaosPercent">
            0
          </span>%
        </b>

        <div class="meter">
          <div id="chaosMeter"></div>
        </div>

        <br>

        已接收資訊：

        <b>
          <span id="infectedCount">
            0
          </span>
          / 5
        </b>

      </div>

    </div>


    <!-- SETTINGS -->

    <div class="section">

      <div class="sectionTitle">
        動作設定
      </div>

      <label>
        攝像頭敏感度：
        <span id="sensitivityValue">40</span>
      </label>

      <input
        id="sensitivitySlider"
        type="range"
        min="5"
        max="80"
        value="40"
      >


      <label>
        順從時最大偏角：
        <span id="followAngleValue">10</span>°
      </label>

      <input
        id="followAngleSlider"
        type="range"
        min="3"
        max="20"
        value="10"
      >


      <label>
        混亂時最大偏角：
        <span id="chaosAngleValue">28</span>°
      </label>

      <input
        id="chaosAngleSlider"
        type="range"
        min="10"
        max="45"
        value="28"
      >


      <label>
        說話觸發門檻：
        <span id="voiceThresholdValue">16</span>%
      </label>

      <input
        id="voiceThresholdSlider"
        type="range"
        min="5"
        max="50"
        value="16"
      >


      <label>
        靠近速度：
        <span id="transferTimeValue">1200</span> ms
      </label>

      <input
        id="transferTimeSlider"
        type="range"
        min="500"
        max="2500"
        step="100"
        value="1200"
      >


      <label>
        混亂成長速度：
        <span id="chaosSpeedValue">40</span>%
      </label>

      <input
        id="chaosSpeedSlider"
        type="range"
        min="10"
        max="100"
        value="40"
      >

    </div>


    <button
      id="resetBtn"
      class="gray">
      回到順從狀態
    </button>

  </aside>

</div>


<canvas
  id="cameraAnalysis"
  width="160"
  height="120"
  style="display:none">
</canvas>


<script>

/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("stage");

const ctx =
  canvas.getContext("2d");

const video =
  document.getElementById("video");

const analysisCanvas =
  document.getElementById(
    "cameraAnalysis"
  );

const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );


/* =========================================================
   SYSTEM
========================================================= */

const DEVICE_COUNT = 5;

let W = 0;
let H = 0;

const devices = [];

let mode = "FOLLOW";

let chaos = 0;

let sourceIndex = -1;

let visited =
  new Set();

let pendingEdges = [];

let currentTransfer = null;


/* =========================================================
   SETTINGS
========================================================= */

let followMaxAngle = 10;

let chaosMaxAngle = 28;

let voiceThreshold = .16;

let transferApproachTime = 1200;

let chaosGrowthSpeed = .40;


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;

let cameraReady = false;

let previousCameraFrame = null;


const viewer = {

  present:false,

  x:.5,

  movement:0,

  absentTime:0,

  sensitivity:40

};


/* =========================================================
   MICROPHONE
========================================================= */

let micStream = null;

let audioContext = null;

let analyser = null;

let micSource = null;

let micBuffer = null;

let micReady = false;

let voiceLevel = 0;

let voiceHold = 0;


/* =========================================================
   DEVICE
========================================================= */

class Device{

  constructor(index){

    this.index = index;

    this.angle = 0;

    this.targetAngle = 0;

    this.info = 0;

    this.flash = 0;


    this.phase =

      Math.random()

      *

      Math.PI

      *

      2;


    this.followWeight =

      random(
        .97,
        1.03
      );


    this.chaosTarget = 0;

    this.nextChaosShift = 0;


    /* ==================================
       流體物理
    ================================== */

    this.lastAngle = 0;

    this.angularVelocity = 0;

    this.fluidOffset = 0;

    this.fluidVelocity = 0;

    this.fluidTilt = 0;


    /* ==================================
       粒子資料
    ================================== */

    this.fluidSeeds = [];


    for(
      let i = 0;
      i < 80;
      i++
    ){

      this.fluidSeeds.push({

        phase:

          Math.random()

          *

          Math.PI

          *

          2,


        speed:

          random(
            .65,
            1.4
          ),


        size:

          random(
            .5,
            1.7
          ),


        offset:

          random(
            -1,
            1
          )

      });

    }

  }


  /* =======================================================
     DEVICE MOVEMENT
  ======================================================= */

  update(now,dt){

    this.flash =

      Math.max(

        0,

        this.flash

        -

        dt /
        520

      );


    /* =====================================
       FOLLOW
    ===================================== */

    if(
      mode === "FOLLOW"
    ){

      const observerAngle =

        viewer.present

        ?

        (
          viewer.x -
          .5
        )

        *
        2

        *
        followMaxAngle

        :

        0;


      this.targetAngle =

        observerAngle

        *
        this.followWeight;


      this.angle =

        lerp(

          this.angle,

          this.targetAngle,

          .055

        );


      this.info =

        lerp(

          this.info,

          0,

          .035

        );


      return;

    }


    /* =====================================
       TRANSFER
    ===================================== */

    if(
      mode === "TRANSFER"
    ){

      /*
        正在交換資訊的兩支
        由 transfer 系統控制。
      */

      if(
        currentTransfer

        &&

        (
          this.index ===
          currentTransfer.from

          ||

          this.index ===
          currentTransfer.to
        )
      ){

        return;

      }


      if(
        now >
        this.nextChaosShift
      ){

        this.nextChaosShift =

          now

          +

          random(
            900,
            2100
          );


        this.chaosTarget =

          random(

            -chaosMaxAngle,

            chaosMaxAngle

          );

      }


      const followAngle =

        viewer.present

        ?

        (
          viewer.x -
          .5
        )

        *
        2

        *
        followMaxAngle

        :

        0;


      const obedience =

        1

        -

        chaos *
        .55;


      this.targetAngle =

        followAngle

        *
        obedience

        +

        this.chaosTarget

        *
        chaos

        *
        .22;


      this.targetAngle =

        constrain(

          this.targetAngle,

          -chaosMaxAngle,

          chaosMaxAngle

        );


      this.angle =

        lerp(

          this.angle,

          this.targetAngle,

          .035

          +

          chaos *
          .018

        );


      return;

    }


    /* =====================================
       CHAOS
    ===================================== */

    if(
      mode === "CHAOS"
    ){

      if(
        now >
        this.nextChaosShift
      ){

        this.nextChaosShift =

          now

          +

          random(
            900,
            2400
          );


        this.chaosTarget =

          random(

            -chaosMaxAngle,

            chaosMaxAngle

          );

      }


      let neighborAverage = 0;

      let neighborCount = 0;


      if(
        this.index > 0
      ){

        neighborAverage +=

          devices[
            this.index - 1
          ].angle;


        neighborCount++;

      }


      if(
        this.index <
        DEVICE_COUNT - 1
      ){

        neighborAverage +=

          devices[
            this.index + 1
          ].angle;


        neighborCount++;

      }


      if(
        neighborCount >
        0
      ){

        neighborAverage /=

          neighborCount;

      }


      const followAngle =

        viewer.present

        ?

        (
          viewer.x -
          .5
        )

        *
        2

        *
        followMaxAngle

        :

        0;


      const obedience =

        Math.max(

          .15,

          1 -
          chaos

        );


      this.targetAngle =

        followAngle

        *
        obedience

        +

        this.chaosTarget

        *
        chaos

        *
        .38

        +

        neighborAverage

        *
        chaos

        *
        .10;


      this.targetAngle =

        constrain(

          this.targetAngle,

          -chaosMaxAngle,

          chaosMaxAngle

        );


      this.angle =

        lerp(

          this.angle,

          this.targetAngle,

          .024

          +

          chaos *
          .018

        );

    }

  }


  /* =======================================================
     FLUID PHYSICS
  ======================================================= */

  updateFluidPhysics(dt){

    const safeDt =

      Math.max(
        1,
        dt
      );


    /*
      計算棒子每一幀的旋轉速度。
    */

    const newAngularVelocity =

      (
        this.angle

        -

        this.lastAngle
      )

      /

      (
        safeDt /
        16.67
      );


    this.angularVelocity =

      lerp(

        this.angularVelocity,

        newAngularVelocity,

        .22

      );


    this.lastAngle =
      this.angle;


    const angleRad =

      this.angle

      *
      Math.PI

      /
      180;


    /*
      流體因為重力＋慣性
      往反方向偏。
    */

    const targetOffset =

      constrain(

        -Math.sin(
          angleRad
        )

        *
        .52

        -

        this.angularVelocity

        *
        .12,

        -.75,

        .75

      );


    /*
      Spring：
      流體不會瞬間跟棒子一起移動。
    */

    this.fluidVelocity +=

      (
        targetOffset

        -

        this.fluidOffset
      )

      *
      .075;


    this.fluidVelocity *=
      .86;


    this.fluidOffset +=

      this.fluidVelocity;


    /*
      流體表面的傾斜。
    */

    const targetTilt =

      -Math.sin(
        angleRad
      )

      *
      .42

      -

      this.angularVelocity

      *
      .07;


    this.fluidTilt =

      lerp(

        this.fluidTilt,

        targetTilt,

        .15

      );

  }

}


/* =========================================================
   RESET
========================================================= */

function resetSystem(){

  mode =
    "FOLLOW";


  chaos =
    0;


  sourceIndex =
    -1;


  visited =
    new Set();


  pendingEdges =
    [];


  currentTransfer =
    null;


  voiceHold =
    0;


  devices.length =
    0;


  for(
    let i = 0;
    i < DEVICE_COUNT;
    i++
  ){

    devices.push(

      new Device(i)

    );

  }

}


resetSystem();


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

  const rect =

    canvas
    .parentElement
    .getBoundingClientRect();


  W =
    rect.width;


  H =
    rect.height;


  canvas.width =

    Math.round(

      W

      *
      devicePixelRatio

    );


  canvas.height =

    Math.round(

      H

      *
      devicePixelRatio

    );


  canvas.style.width =
    W + "px";


  canvas.style.height =
    H + "px";


  ctx.setTransform(

    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0

  );

}


resizeCanvas();


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   LAYOUT
========================================================= */

function getBaseY(){

  return H * .73;

}


function getBodyHeight(){

  return Math.min(

    245,

    H * .34

  );

}


function getBodyWidth(){

  return Math.min(

    65,

    W * .055

  );

}


function getDeviceX(index){

  return mapValue(

    index,

    0,
    DEVICE_COUNT - 1,

    W * .16,
    W * .84

  );

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

  try{

    cameraStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        video:{

          width:{
            ideal:640
          },

          height:{
            ideal:480
          },

          facingMode:
            "user"

        },

        audio:false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    cameraReady =
      true;


    previousCameraFrame =
      null;


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "已啟動";


    document
    .getElementById(
      "cameraBtn"
    )
    .textContent =
      "攝像頭已開啟";

  }

  catch(error){

    cameraReady =
      false;


    console.error(
      error
    );


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "啟動失敗";

  }

}


document
.getElementById(
  "cameraBtn"
)
.addEventListener(
  "click",
  startCamera
);


/* =========================================================
   CAMERA ANALYSIS
========================================================= */

function analyzeCamera(){

  if(
    !cameraReady

    ||

    video.readyState <
    2
  ){

    return;

  }


  analysisCtx.drawImage(

    video,

    0,
    0,

    analysisCanvas.width,
    analysisCanvas.height

  );


  const frame =

    analysisCtx
    .getImageData(

      0,
      0,

      analysisCanvas.width,
      analysisCanvas.height

    )
    .data;


  if(
    !previousCameraFrame
  ){

    previousCameraFrame =

      new Uint8ClampedArray(
        frame
      );

    return;

  }


  const width =
    analysisCanvas.width;


  const height =
    analysisCanvas.height;


  const threshold =

    mapValue(

      viewer.sensitivity,

      5,
      80,

      88,
      18

    );


  let changed = 0;

  let checked = 0;

  let xTotal = 0;


  for(
    let y = 0;
    y < height;
    y += 4
  ){

    for(
      let x = 0;
      x < width;
      x += 4
    ){

      const i =

        (
          y * width

          +

          x
        )

        *
        4;


      const diff =

        Math.abs(

          frame[i]

          -

          previousCameraFrame[i]

        )

        +

        Math.abs(

          frame[i+1]

          -

          previousCameraFrame[i+1]

        )

        +

        Math.abs(

          frame[i+2]

          -

          previousCameraFrame[i+2]

        );


      checked++;


      if(
        diff >
        threshold
      ){

        changed++;

        xTotal +=
          x;

      }

    }

  }


  previousCameraFrame =

    new Uint8ClampedArray(
      frame
    );


  const ratio =

    changed

    /

    Math.max(
      1,
      checked
    );


  viewer.movement =

    lerp(

      viewer.movement,

      constrain(

        ratio *
        3,

        0,
        1

      ),

      .3

    );


  if(
    changed >
    0
  ){

    let averageX =

      xTotal

      /

      changed;


    /*
      因為畫面是鏡像顯示。
    */

    averageX =

      width

      -

      averageX;


    viewer.x =

      lerp(

        viewer.x,

        constrain(

          averageX /
          width,

          0,
          1

        ),

        .32

      );

  }


  if(
    ratio >
    .005
  ){

    viewer.present =
      true;


    viewer.absentTime =
      0;

  }

  else{

    viewer.absentTime +=
      100;


    if(
      viewer.absentTime >
      6500
    ){

      viewer.present =
        false;

    }

  }

}


/* =========================================================
   MICROPHONE
========================================================= */

async function startMicrophone(){

  try{

    if(
      micReady
    ){

      return;

    }


    micStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        audio:{

          echoCancellation:true,

          noiseSuppression:false,

          autoGainControl:false

        },

        video:false

      });


    const AudioCtx =

      window.AudioContext

      ||

      window.webkitAudioContext;


    audioContext =

      new AudioCtx();


    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();

    }


    analyser =

      audioContext
      .createAnalyser();


    analyser.fftSize =
      1024;


    analyser.smoothingTimeConstant =
      .25;


    micBuffer =

      new Uint8Array(
        analyser.fftSize
      );


    micSource =

      audioContext
      .createMediaStreamSource(
        micStream
      );


    micSource.connect(
      analyser
    );


    micReady =
      true;


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "已啟動";


    document
    .getElementById(
      "micBtn"
    )
    .textContent =
      "麥克風已開啟";

  }

  catch(error){

    micReady =
      false;


    console.error(
      error
    );


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "啟動失敗";

  }

}


async function stopMicrophone(){

  if(
    micStream
  ){

    micStream
    .getTracks()
    .forEach(

      track =>
        track.stop()

    );

  }


  micStream =
    null;


  if(
    micSource
  ){

    try{

      micSource.disconnect();

    }

    catch(error){}

  }


  if(
    audioContext
  ){

    try{

      await audioContext.close();

    }

    catch(error){}

  }


  micSource =
    null;


  audioContext =
    null;


  analyser =
    null;


  micBuffer =
    null;


  micReady =
    false;


  voiceLevel =
    0;


  voiceHold =

  .getElementById(
    "micState"
  )
  .textContent =
    "未啟動";

  .getElementById(

  )
  .textContent =

}

/* =========================================================
   AUDIO LEVEL
========================================================= */

function updateAudio(dt,now){

  if(
    !micReady

    ||

    !analyser

    ||

    !micBuffer
  ){

    voiceLevel =

      lerp(

        voiceLevel,

        0,

        .06

      );


    voiceHold =
      0;


    return;

  }


  analyser
  .getByteTimeDomainData(
    micBuffer
  );


  let sum = 0;

  let count = 0;


  for(
    let i = 0;
    i < micBuffer.length;
    i += 4
  ){

    const value =

      (
        micBuffer[i]

        -

        128
      )

      /
      128;


    sum +=

      value

      *
      value;


    count++;

  }


  const rms =

    Math.sqrt(

      sum

      /

      Math.max(
        1,
        count
      )

    );


  const level =

    constrain(

      (
        rms -
        .006
      )

      *
      15,

      0,
      1

    );


  voiceLevel =

    lerp(

      voiceLevel,

      level,

      .32

    );


  if(
    mode ===
    "FOLLOW"
  ){

    if(
      voiceLevel >
      voiceThreshold
    ){

      voiceHold +=
        dt;

    }

    else{

      voiceHold =

        Math.max(

          0,

          voiceHold

          -

          dt *
          1.8

        );

    }


    if(
      voiceHold >
      280
    ){

      startInformationTransmission(
        now
      );


      voiceHold =
        0;

    }

  }

}

/* =========================================================
   START INFORMATION
========================================================= */

function startInformationTransmission(now){

  mode =
    "TRANSFER";


  chaos =
    .06;


  /*
    最靠近觀者的裝置
    變成資訊起點。
  */

  if(
    viewer.present
  ){

    sourceIndex =

      constrain(

        Math.round(

          viewer.x

          *

          (
            DEVICE_COUNT -
            1
          )

        ),

        0,

        DEVICE_COUNT -
        1

      );

  }

  else{

    sourceIndex =
      2;

  }


  visited =

    new Set([
      sourceIndex
    ]);


  devices[
    sourceIndex
  ].info =
    1;


  devices[
    sourceIndex
  ].flash =
    1;


  buildPendingEdges();


  currentTransfer =
    null;


  scheduleNextTransfer(
    now,
    450
  );

}


/* =========================================================
   TRANSFER PATH
========================================================= */

function buildPendingEdges(){

  pendingEdges =
    [];


  for(
    let i = sourceIndex;
    i > 0;
    i--
  ){

    pendingEdges.push({

      from:i,

      to:i-1

    });

  }


  for(
    let i = sourceIndex;
    i <
    DEVICE_COUNT -
    1;
    i++
  ){

    pendingEdges.push({

      from:i,

      to:i+1

    });

  }

}


function chooseEligibleEdge(){

  const possible =

    pendingEdges.filter(

      edge =>

        visited.has(
          edge.from
        )

        &&

        !visited.has(
          edge.to
        )

    );


  if(
    possible.length ===
    0
  ){

    return null;

  }


  return possible[

    Math.floor(

      Math.random()

      *

      possible.length

    )

  ];

}


function scheduleNextTransfer(
  now,
  wait
){

  currentTransfer = {

    stage:
      "WAIT_NEXT",

    stageStart:
      now,

    waitDuration:
      wait

  };

}


function beginNextEdge(now){

  const edge =
    chooseEligibleEdge();


  if(
    !edge
  ){

    if(
      visited.size >=
      DEVICE_COUNT
    ){

      mode =
        "CHAOS";


      chaos =

        Math.max(
          chaos,
          .55
        );


      currentTransfer =
        null;

    }


    return;

  }


  currentTransfer = {

    from:
      edge.from,

    to:
      edge.to,

    stage:
      "APPROACH",

    stageStart:
      now,

    approachAngle:

      getMeetingAngle(

        edge.from,

        edge.to

      )

  };

}


/* =========================================================
   UPDATE TRANSFER
========================================================= */

function updateTransfer(now){

  if(
    mode !==
    "TRANSFER"
  ){

    return;

  }


  if(
    !currentTransfer
  ){

    beginNextEdge(
      now
    );

    return;

  }


  if(
    currentTransfer.stage ===
    "WAIT_NEXT"
  ){

    if(
      now

      -

      currentTransfer.stageStart

      >=

      currentTransfer.waitDuration
    ){

      beginNextEdge(
        now
      );

    }


    return;

  }


  const fromDevice =

    devices[
      currentTransfer.from
    ];


  const toDevice =

    devices[
      currentTransfer.to
    ];


  const elapsed =

    now

    -

    currentTransfer.stageStart;


  const direction =

    currentTransfer.from

    <

    currentTransfer.to

    ?

    1

    :

    -1;


  /* =====================================
     APPROACH
  ===================================== */

  if(
    currentTransfer.stage ===
    "APPROACH"
  ){

    const angle =

      currentTransfer
      .approachAngle;


    fromDevice.targetAngle =

      angle

      *
      direction;


    toDevice.targetAngle =

      angle

      *
      -direction;


    fromDevice.angle =

      lerp(

        fromDevice.angle,

        fromDevice.targetAngle,

        .045

      );


    toDevice.angle =

      lerp(

        toDevice.angle,

        toDevice.targetAngle,

        .045

      );


    if(
      elapsed >=
      transferApproachTime
    ){

      currentTransfer.stage =
        "CONTACT";


      currentTransfer.stageStart =
        now;


      toDevice.info =

        constrain(

          Math.max(

            toDevice.info,

            fromDevice.info *
            .82

            +

            .12

          ),

          0,
          1

        );


      fromDevice.flash =
        1;


      toDevice.flash =
        1;


      visited.add(

        currentTransfer.to

      );


      chaos =

        constrain(

          chaos

          +

          .11,

          0,
          1

        );

    }


    return;

  }


  /* =====================================
     CONTACT
  ===================================== */

  if(
    currentTransfer.stage ===
    "CONTACT"
  ){

    const angle =

      currentTransfer
      .approachAngle;


    fromDevice.angle =

      lerp(

        fromDevice.angle,

        angle *
        direction,

        .10

      );


    toDevice.angle =

      lerp(

        toDevice.angle,

        angle *
        -direction,

        .10

      );


    if(
      elapsed >
      450
    ){

      currentTransfer.stage =
        "SEPARATE";


      currentTransfer.stageStart =
        now;

    }


    return;

  }


  /* =====================================
     SEPARATE
  ===================================== */

  if(
    currentTransfer.stage ===
    "SEPARATE"
  ){

    const followAngle =

      viewer.present

      ?

      (
        viewer.x -
        .5
      )

      *
      2

      *
      followMaxAngle

      :

      0;


    fromDevice.angle =

      lerp(

        fromDevice.angle,

        followAngle,

        .035

      );


    toDevice.angle =

      lerp(

        toDevice.angle,

        followAngle,

        .035

      );


    if(
      elapsed >
      650
    ){

      pendingEdges =

        pendingEdges.filter(

          edge =>

            !(
              edge.from ===
              currentTransfer.from

              &&

              edge.to ===
              currentTransfer.to
            )

        );


      scheduleNextTransfer(

        now,

        random(
          250,
          800
        )

      );

    }

  }

}


/* =========================================================
   MEETING ANGLE
========================================================= */

function getMeetingAngle(
  aIndex,
  bIndex
){

  const distance =

    Math.abs(

      getDeviceX(
        aIndex
      )

      -

      getDeviceX(
        bIndex
      )

    );


  const bodyHeight =
    getBodyHeight();


  /*
    視覺上只做接近，
    不要求棒頂真的碰在一起。
  */

  const ratio =

    constrain(

      distance

      /

      (
        bodyHeight *
        3
      ),

      .03,
      .28

    );


  const radians =

    Math.asin(
      ratio
    );


  return constrain(

    radians

    *
    180

    /
    Math.PI

    *
    .85,

    5,
    14

  );

}


/* =========================================================
   CHAOS
========================================================= */

function updateChaos(dt){

  if(
    mode ===
    "TRANSFER"
  ){

    chaos =

      constrain(

        chaos

        +

        dt

        *
        .000006

        *
        chaosGrowthSpeed,

        0,
        .60

      );

  }


  if(
    mode ===
    "CHAOS"
  ){

    chaos =

      constrain(

        chaos

        +

        dt

        *
        .000018

        *
        chaosGrowthSpeed,

        0,
        1

      );

  }

}


/* =========================================================
   TABLE
========================================================= */

function drawTable(){

  const y =

    getBaseY()

    +

    18;


  ctx.fillStyle =
    "#e4dfd6";


  ctx.fillRect(

    W *
    .055,

    y,

    W *
    .89,

    H *
    .19

  );


  ctx.fillStyle =
    "rgba(0,0,0,.07)";


  ctx.fillRect(

    W *
    .055,

    y,

    W *
    .89,

    4

  );

}


/* =========================================================
   DRAW DEVICE
========================================================= */

function drawDevice(
  device,
  now
){

  const x =

    getDeviceX(
      device.index
    );


  const baseY =
    getBaseY();


  const bodyHeight =
    getBodyHeight();


  const bodyWidth =
    getBodyWidth();


  const angleRad =

    device.angle

    *
    Math.PI

    /
    180;


  ctx.save();


  ctx.translate(
    x,
    baseY
  );


  /* SHADOW */

  ctx.fillStyle =
    "rgba(0,0,0,.09)";


  ctx.beginPath();


  ctx.ellipse(

    5,
    12,

    bodyWidth *
    .68,

    7,

    0,
    0,

    Math.PI *
    2

  );


  ctx.fill();


  /* BASE */

  ctx.fillStyle =
    "#171817";


  ctx.beginPath();


  ctx.roundRect(

    -bodyWidth *
    .63,

    -5,

    bodyWidth *
    1.26,

    18,

    7

  );


  ctx.fill();


  /* PIVOT */

  ctx.fillStyle =
    "#353936";


  ctx.beginPath();


  ctx.arc(

    0,
    0,

    8,

    0,

    Math.PI *
    2

  );


  ctx.fill();


  ctx.fillStyle =
    "#101110";


  ctx.beginPath();


  ctx.arc(

    0,
    0,

    4,

    0,

    Math.PI *
    2

  );


  ctx.fill();


  /*
    整支裝置旋轉。
  */

  ctx.rotate(
    angleRad
  );


  /* BODY */

  const bodyGradient =

    ctx.createLinearGradient(

      -bodyWidth /
      2,

      0,

      bodyWidth /
      2,

      0

    );


  bodyGradient.addColorStop(
    0,
    "#050605"
  );


  bodyGradient.addColorStop(
    .45,
    "#2b2d2c"
  );


  bodyGradient.addColorStop(
    1,
    "#070807"
  );


  ctx.fillStyle =
    bodyGradient;


  ctx.shadowBlur =
    8;


  ctx.shadowColor =
    "rgba(0,0,0,.20)";


  ctx.beginPath();


  ctx.roundRect(

    -bodyWidth /
    2,

    -bodyHeight,

    bodyWidth,

    bodyHeight,

    7

  );


  ctx.fill();


  ctx.shadowBlur =
    0;


  /* LED */

  drawLED(

    device,

    now,

    bodyWidth,

    bodyHeight

  );


  /* CAMERA */

  const cameraY =

    -bodyHeight *
    .73;


  ctx.fillStyle =
    "#050706";


  ctx.beginPath();


  ctx.arc(

    0,

    cameraY,

    9,

    0,

    Math.PI *
    2

  );


  ctx.fill();


  ctx.strokeStyle =
    "#4a504d";


  ctx.lineWidth =
    1;


  ctx.beginPath();


  ctx.arc(

    0,

    cameraY,

    9,

    0,

    Math.PI *
    2

  );


  ctx.stroke();


  ctx.fillStyle =
    "#020607";


  ctx.beginPath();


  ctx.arc(

    0,

    cameraY,

    5.5,

    0,

    Math.PI *
    2

  );


  ctx.fill();


  ctx.fillStyle =
    "rgba(100,155,180,.48)";


  ctx.beginPath();


  ctx.arc(

    -1.5,

    cameraY -
    1.7,

    1.7,

    0,

    Math.PI *
    2

  );


  ctx.fill();


  /* SCREEN */

  const screenW =

    bodyWidth *
    .70;


  const screenH =

    bodyHeight *
    .31;


  const screenX =

    -screenW /
    2;


  const screenY =

    -bodyHeight *
    .56;


  ctx.fillStyle =
    "#020405";


  ctx.beginPath();


  ctx.roundRect(

    screenX,

    screenY,

    screenW,

    screenH,

    3

  );


  ctx.fill();


  ctx.strokeStyle =
    "#303635";


  ctx.lineWidth =
    1;


  ctx.stroke();


  ctx.save();


  ctx.beginPath();


  ctx.roundRect(

    screenX +
    3,

    screenY +
    3,

    screenW -
    6,

    screenH -
    6,

    2

  );


  ctx.clip();


  drawFluidScreen(

    device,

    now,

    screenX +
    3,

    screenY +
    3,

    screenW -
    6,

    screenH -
    6

  );


  ctx.restore();


  ctx.restore();

}


/* =========================================================
   LED
========================================================= */

function drawLED(
  device,
  now,
  width,
  height
){

  let phase =
    0;


  if(
    mode !==
    "FOLLOW"
  ){

    phase =

      device.phase

      *
      chaos;

  }


  const breath =

    (
      Math.sin(

        now *
        .002

        +

        phase

      )

      +
      1
    )

    /
    2;


  let brightness =

    .18

    +

    breath *
    .09;


  brightness +=

    device.info

    *
    .30;


  brightness +=

    device.flash

    *
    .55;


  if(
    mode !==
    "FOLLOW"
  ){

    brightness +=

      chaos

      *

      (
        Math.sin(

          now

          *
          (
            .0033

            +

            device.index

            *
            .00045
          )

          +

          device.phase

        )

        +
        1
      )

      *
      .07;

  }


  brightness =

    constrain(

      brightness,

      .08,
      1

    );


  ctx.fillStyle =
    "rgba(70,85,88,.18)";


  ctx.fillRect(

    -width /
    2

    +
    3,

    -height

    +
    9,

    width

    -
    6,

    5

  );


  ctx.shadowBlur =

    5

    +

    brightness

    *
    15;


  ctx.shadowColor =

    `rgba(
      100,
      235,
      255,
      ${brightness}
    )`;


  ctx.fillStyle =

    `rgba(
      155,
      245,
      255,
      ${brightness}
    )`;


  ctx.fillRect(

    -width /
    2

    +
    3,

    -height

    +
    9,

    width

    -
    6,

    4

  );


  ctx.shadowBlur =
    0;

}


/* =========================================================
   FLUID SCREEN
========================================================= */

function drawFluidScreen(
  device,
  now,
  x,
  y,
  w,
  h
){

  /* BACKGROUND */

  const bg =

    ctx.createLinearGradient(

      x,
      y,

      x,
      y + h

    );


  bg.addColorStop(
    0,
    "#071653"
  );


  bg.addColorStop(
    .50,
    "#06144a"
  );


  bg.addColorStop(
    1,
    "#030c32"
  );


  ctx.fillStyle =
    bg;


  ctx.fillRect(
    x,
    y,
    w,
    h
  );


  const info =

    constrain(

      device.info,

      0,
      1

    );


  const turbulence =

    mode ===
    "FOLLOW"

    ?

    .015

    :

    chaos

    *
    (
      .12

      +

      info *
      .48
    );


  /*
    裝置移動速度。
  */

  const motionStrength =

    constrain(

      Math.abs(
        device.angularVelocity
      )

      *
      1.8,

      0,
      1

    );


  /*
    流體因傾斜產生的位置偏移。
  */

  const slosh =
    device.fluidOffset;


  /*
    流體表面的傾斜程度。
  */

  const tilt =
    device.fluidTilt;


  const flowTime =

    now

    *
    (
      .00075

      +

      info *
      .0008

      +

      chaos *
      .00035
    )

    +

    device.phase;


  /* =====================================
     FLUID BODY
  ===================================== */

  for(
    let yy = 0;
    yy < h;
    yy += 2
  ){

    const ny =

      yy /
      h;


    /*
      參考圖片：

      上面靠右，
      下面往左擴張。
    */

    let frontRatio =

      .91

      -

      .76

      *
      Math.pow(
        ny,
        .72
      );


    /*
      資訊越多，
      液體範圍變大。
    */

    frontRatio -=

      info *
      .10;


    /*
      ★ 跟著裝置傾斜
    */

    frontRatio +=

      slosh *
      .20;


    /*
      ★ 流體因重力保持水平感，
      因此上下偏移不同。
    */

    frontRatio +=

      tilt

      *
      (
        ny -
        .5
      )

      *
      .38;


    /*
      微小流動。
    */

    frontRatio +=

      Math.sin(

        ny *
        5.2

        +

        flowTime *
        1.2

      )

      *
      (
        .012

        +

        turbulence *
        .028
      );


    /*
      混亂後第二層波動。
    */

    frontRatio +=

      Math.sin(

        ny *
        14

        -

        flowTime *
        .7

        +

        device.phase

      )

      *
      turbulence

      *
      .015;


    /*
      棒子快速移動時，
      液體表面會多晃一下。
    */

    frontRatio +=

      Math.sin(

        ny *
        20

        +

        now *
        .006

      )

      *
      motionStrength

      *
      .018;


    frontRatio =

      constrain(

        frontRatio,

        .04,
        .97

      );


    let frontX =

      x

      +

      frontRatio

      *
      w;


    /*
      像素階梯感。
    */

    frontX =

      Math.round(
        frontX /
        2
      )

      *
      2;


    const liquidWidth =

      Math.max(

        0,

        x +
        w

        -

        frontX

      );


    const liquidGradient =

      ctx.createLinearGradient(

        frontX,
        0,

        x + w,
        0

      );


    liquidGradient.addColorStop(

      0,

      `rgba(
        80,
        250,
        255,
        ${.80 + info*.10}
      )`

    );


    liquidGradient.addColorStop(

      .40,

      "rgba(35,225,255,.90)"

    );


    liquidGradient.addColorStop(

      1,

      "rgba(15,165,250,.88)"

    );


    ctx.fillStyle =
      liquidGradient;


    ctx.fillRect(

      frontX,

      y + yy,

      liquidWidth,

      2

    );


    /*
      發光邊界。
    */

    ctx.fillStyle =

      `rgba(
        175,
        255,
        255,
        ${.42 + info*.30}
      )`;


    ctx.fillRect(

      frontX -
      1,

      y + yy,

      2,

      2

    );


    /*
      流體內細微層次。
    */

    if(
      yy %
      6 ===
      0
    ){

      ctx.fillStyle =

        `rgba(
          205,
          255,
          255,
          ${.045 + info*.075}
        )`;


      ctx.fillRect(

        frontX +
        3,

        y + yy,

        Math.max(

          0,

          liquidWidth -
          7

        ),

        1

      );

    }

  }


  /* =====================================
     EDGE PARTICLES
  ===================================== */

  const edgeParticleCount =

    Math.floor(

      26

      +

      info *
      34

      +

      chaos *
      15

      +

      motionStrength *
      15

    );


  for(
    let i = 0;
    i < edgeParticleCount;
    i++
  ){

    const seed =

      device
      .fluidSeeds[
        i %
        device
        .fluidSeeds
        .length
      ];


    const pyNorm =

      fract(

        i *
        .137

        +

        now *
        .00009

        *
        seed.speed

        +

        seed.phase

      );


    const yy =

      pyNorm

      *
      h;


    const ny =

      yy /
      h;


    let frontRatio =

      .91

      -

      .76

      *
      Math.pow(
        ny,
        .72
      );


    frontRatio -=

      info *
      .10;


    frontRatio +=

      slosh *
      .20;


    frontRatio +=

      tilt

      *
      (
        ny -
        .5
      )

      *
      .38;


    frontRatio +=

      Math.sin(

        ny *
        5.2

        +

        flowTime *
        1.2

      )

      *
      (
        .012

        +

        turbulence *
        .028
      );


    frontRatio =

      constrain(

        frontRatio,

        .04,
        .97

      );


    const edgeX =

      x

      +

      frontRatio

      *
      w;


    /*
      ★ 移動慣性：
      裝置往右，
      粒子往左拖。
    */

    const inertiaShift =

      -device.angularVelocity

      *
      w

      *
      .035;


    const particleOffset =

      2

      +

      Math.abs(
        seed.offset
      )

      *
      (
        3

        +

        info *
        7

        +

        motionStrength *
        6
      );


    const px =

      edgeX

      +

      particleOffset

      +

      inertiaShift;


    const py =

      y

      +

      yy

      +

      Math.sin(

        flowTime *
        2

        +

        seed.phase

      )

      *
      motionStrength

      *
      2;


    const alpha =

      constrain(

        .20

        +

        info *
        .36

        +

        motionStrength *
        .28,

        .12,
        .95

      );


    ctx.fillStyle =

      `rgba(
        120,
        250,
        255,
        ${alpha}
      )`;


    /*
      快速運動時出現短尾巴。
    */

    const trail =

      motionStrength

      *
      4;


    if(
      i %
      3 ===
      0
    ){

      const direction =

        Math.sign(
          device.angularVelocity
        )

        ||

        1;


      ctx.fillRect(

        px

        -

        direction *
        trail,

        py,

        1

        +

        trail,

        Math.max(
          1,
          seed.size
        )

      );

    }

    else{

      ctx.beginPath();


      ctx.arc(

        px,
        py,

        seed.size *
        .6,

        0,

        Math.PI *
        2

      );


      ctx.fill();

    }

  }


  /* =====================================
     FLOATING PARTICLES
  ===================================== */

  const floatingCount =

    Math.floor(

      7

      +

      info *
      12

      +

      motionStrength *
      8

    );


  for(
    let i = 0;
    i < floatingCount;
    i++
  ){

    const seed =

      device
      .fluidSeeds[

        (
          i +
          40
        )

        %

        device
        .fluidSeeds
        .length

      ];


    const t =

      fract(

        now

        *
        .00012

        *
        seed.speed

        +

        seed.phase

      );


    let py =

      y

      +

      h

      -

      t *
      h;


    /*
      裝置移動時，
      粒子上下晃動。
    */

    py +=

      Math.cos(

        now *
        .003

        +

        seed.phase

      )

      *
      motionStrength

      *
      3;


    const ny =

      constrain(

        (
          py -
          y
        )

        /
        h,

        0,
        1

      );


    let frontRatio =

      .91

      -

      .76

      *
      Math.pow(
        ny,
        .72
      );


    frontRatio -=

      info *
      .10;


    frontRatio +=

      slosh *
      .20;


    frontRatio +=

      tilt

      *
      (
        ny -
        .5
      )

      *
      .38;


    const inertiaShift =

      -device.angularVelocity

      *
      w

      *
      .035;


    const px =

      x

      +

      frontRatio *
      w

      +

      4

      +

      Math.abs(
        seed.offset
      )

      *
      w

      *
      .16

      +

      inertiaShift;


    ctx.fillStyle =

      `rgba(
        195,
        255,
        255,
        ${.12 + info*.24}
      )`;


    ctx.beginPath();


    ctx.arc(

      px,
      py,

      1

      +

      seed.size *
      .18,

      0,

      Math.PI *
      2

    );


    ctx.fill();

  }


  /*
    交換資訊瞬間，
    螢幕整體閃亮。
  */

  if(
    device.flash >
    0
  ){

    ctx.fillStyle =

      `rgba(
        170,
        255,
        255,
        ${device.flash*.14}
      )`;


    ctx.fillRect(

      x,
      y,
      w,
      h

    );

  }

}


/* =========================================================
   CONTACT VISUAL
========================================================= */

function drawTransferContact(now){

  if(
    !currentTransfer

    ||

    currentTransfer.stage !==
    "CONTACT"
  ){

    return;

  }


  const pointA =

    getTopPoint(
      currentTransfer.from
    );


  const pointB =

    getTopPoint(
      currentTransfer.to
    );


  const midX =

    (
      pointA.x

      +

      pointB.x
    )

    /
    2;


  const midY =

    (
      pointA.y

      +

      pointB.y
    )

    /
    2;


  const pulse =

    (
      Math.sin(
        now *
        .025
      )

      +
      1
    )

    /
    2;


  ctx.shadowBlur =

    12

    +

    pulse *
    8;


  ctx.shadowColor =
    "rgba(140,240,255,.8)";


  ctx.fillStyle =

    `rgba(
      185,
      250,
      255,
      ${.35 + pulse*.40}
    )`;


  ctx.beginPath();


  ctx.arc(

    midX,
    midY,

    3

    +

    pulse *
    3,

    0,

    Math.PI *
    2

  );


  ctx.fill();


  ctx.shadowBlur =
    0;


  /*
    粒子交換橋。
  */

  for(
    let i = 0;
    i < 10;
    i++
  ){

    const t =

      fract(

        i /
        10

        +

        now *
        .0012

      );


    const px =

      lerp(

        pointA.x,

        pointB.x,

        t

      );


    const py =

      lerp(

        pointA.y,

        pointB.y,

        t

      )

      +

      Math.sin(

        t

        *
        Math.PI

        *
        3

      )

      *
      3;


    ctx.fillStyle =
      "rgba(150,245,255,.58)";


    ctx.fillRect(

      px,
      py,

      2,
      2

    );

  }

}


/* =========================================================
   TOP POINT
========================================================= */

function getTopPoint(index){

  const device =
    devices[index];


  const angle =

    device.angle

    *
    Math.PI

    /
    180;


  const height =
    getBodyHeight();


  return{

    x:

      getDeviceX(
        index
      )

      +

      Math.sin(
        angle
      )

      *
      height,


    y:

      getBaseY()

      -

      Math.cos(
        angle
      )

      *
      height

  };

}

  }


  document
  .getElementById(
    "modeText"
  )
  .textContent =

  document
  .getElementById(
    "phaseName"
  )
  .textContent =
    modeText;

  .getElementById(
    "phaseDescription"
  )
  .textContent =
    description;

}

/* =========================================================
   HELPERS
========================================================= */

function random(
  min,
  max
){

  if(
    max ===
    undefined
  ){

    max =
      min;


    min =
      0;

  }


  return(

    Math.random()

    *
    (
      max -
      min
    )

    +

    min

  );

}


function lerp(
  a,
  b,
  t
){

  return(

    a

    +

    (
      b -
      a
    )

    *
    t

  );

}


function constrain(
  value,
  min,
  max
){

  return Math.max(

    min,

    Math.min(

      max,

      value

    )

  );

}


function mapValue(
  value,
  inMin,
  inMax,
  outMin,
  outMax
){

  return(

    (
      value -
      inMin
    )

    /

    (
      inMax -
      inMin
    )

    *

    (
      outMax -
      outMin
    )

    +

    outMin

  );

}


function fract(value){

  return(

    value

    -

    Math.floor(
      value
    )

  );

}


/* =========================================================
   LOOP
========================================================= */

let previousTime =
  performance.now();


let lastCameraAnalysis =
  0;


function animate(now){

  const dt =

    Math.min(

      50,

      now

      -

      previousTime

    );


  previousTime =
    now;


  /* CAMERA */

  if(
    now

    -

    lastCameraAnalysis

    >
    100
  ){

    analyzeCamera();


    lastCameraAnalysis =
      now;

  }


  /* AUDIO */

  updateAudio(
    dt,
    now
  );


  /* TRANSFER */

  updateTransfer(
    now
  );


  /* CHAOS */

  updateChaos(
    dt
  );


  /*
    先更新機械動作，
    再更新流體慣性。
  */

  devices.forEach(
    device => {

      device.update(
        now,
        dt
      );


      device.updateFluidPhysics(
        dt
      );

    }
  );


  /* DRAW */

  ctx.clearRect(

    0,
    0,
    W,
    H

  );


  drawTable();


  devices.forEach(
    device => {

      drawDevice(
        device,
        now
      );

    }
  );


  drawTransferContact(
    now
  );


  updateUI();


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);
