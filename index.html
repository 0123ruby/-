<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>誤會機器｜偷偷看 × 聲波傳遞</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  overflow:hidden;
  background:#f1eee7;
  color:#303633;
  font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
}

#app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 350px;
}

#stageWrap{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 45%,
      #faf9f6 0%,
      #eeeae2 63%,
      #e5e0d7 100%
    );
}

#stage{
  display:block;
  width:100%;
  height:100%;
  cursor:pointer;
}

#title{
  position:absolute;
  top:24px;
  left:28px;
  pointer-events:none;
}

#title h1{
  margin:0;
  font-size:27px;
}

#title p{
  margin:7px 0 0;
  font-size:13px;
  color:#69736e;
}

#hint{
  position:absolute;
  left:28px;
  bottom:24px;
  max-width:680px;
  padding:10px 14px;

  background:rgba(255,255,255,.88);
  border:1px solid rgba(0,0,0,.05);
  border-radius:10px;

  font-size:13px;
  line-height:1.65;

  pointer-events:none;
}

#panel{
  padding:20px;
  overflow-y:auto;

  background:#fbfaf7;
  border-left:1px solid #ddd8ce;
}

.section{
  margin-bottom:22px;
}

.sectionTitle{
  margin-bottom:10px;
  font-size:13px;
  font-weight:700;
  color:#414743;
}

video{
  display:block;
  width:100%;
  min-height:145px;

  object-fit:cover;

  background:#111;
  border-radius:8px;

  transform:scaleX(-1);
}

button{
  width:100%;
  margin:0 0 8px;
  padding:11px;

  border:none;
  border-radius:9px;

  font-weight:700;
  cursor:pointer;
}

button.dark{
  background:#222;
  color:#fff;
}

button.light{
  background:#e6e2da;
  color:#333;
}

button.gray{
  background:#d3d0c9;
  color:#333;
}

.status{
  padding:11px;

  background:#fff;
  border:1px solid #dfdbd2;
  border-radius:8px;

  font-size:12px;
  line-height:1.8;
}

.meter{
  height:8px;
  margin-top:8px;
  overflow:hidden;

  background:#e1ddd5;
  border-radius:999px;
}

#cameraMeter,
#voiceMeter{
  width:0%;
  height:100%;
  background:#343936;
  transition:width .06s linear;
}

label{
  display:block;
  margin:12px 0 5px;
  font-size:12px;
}

input[type="range"]{
  width:100%;
}

.small{
  margin-top:8px;
  font-size:11px;
  line-height:1.55;
  color:#777;
}
</style>
</head>

<body>

<div id="app">

  <div id="stageWrap">

    <canvas id="stage"></canvas>

    <div id="title">
      <h1>《誤會機器》</h1>
      <p>偷偷觀察 × 聲音傳遞 × 訊號失真</p>
    </div>

    <div id="hint">
      開啟攝像頭後，裝置不會立刻跟著你。
      它們會等待、偷偷轉向、換一支觀察；
      當你的動作突然變大時，正在看的裝置會先轉回去，像是裝作什麼都沒發生。
    </div>

  </div>


  <aside id="panel">

    <div class="section">

      <div class="sectionTitle">
        攝像頭｜偷偷看
      </div>

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <br>

      <button
        id="cameraBtn"
        class="dark">
        開啟攝像頭
      </button>

      <div class="status">

        攝像頭：
        <b id="cameraState">未啟動</b>

        <br>

        動作量：
        <b>
          <span id="cameraPercent">0</span>%
        </b>

        <div class="meter">
          <div id="cameraMeter"></div>
        </div>

        <br>

        偷看狀態：
        <b id="peekState">
          待機
        </b>

      </div>

    </div>


    <div class="section">

      <div class="sectionTitle">
        聲音互動
      </div>

      <div
        id="selectedStatus"
        class="status">
        目前說話對象：
        <b>第 3 支</b>
      </div>

      <br>

      <button
        id="micBtn"
        class="dark">
        開啟麥克風
      </button>

      <button
        id="micStopBtn"
        class="light">
        停止麥克風
      </button>

      <div class="status">

        麥克風：
        <b id="micState">
          未啟動
        </b>

        <br>

        聲音強度：
        <b>
          <span id="voicePercent">0</span>%
        </b>

        <div class="meter">
          <div id="voiceMeter"></div>
        </div>

      </div>

    </div>


    <div class="section">

      <div class="sectionTitle">
        偷看設定
      </div>

      <label>
        攝像頭敏感度：
        <span id="sensitivityValue">40</span>
      </label>

      <input
        id="sensitivitySlider"
        type="range"
        min="5"
        max="80"
        value="40"
      >


      <label>
        偷看角度：
        <span id="peekAngleValue">32</span>°
      </label>

      <input
        id="peekAngleSlider"
        type="range"
        min="12"
        max="50"
        value="32"
      >


      <label>
        偷看速度：
        <span id="peekSpeedValue">35</span>%
      </label>

      <input
        id="peekSpeedSlider"
        type="range"
        min="10"
        max="80"
        value="35"
      >


      <label>
        每支聲波延遲：
        <span id="delayValue">500</span> ms
      </label>

      <input
        id="delaySlider"
        type="range"
        min="150"
        max="1200"
        step="50"
        value="500"
      >


      <label>
        聲波失真：
        <span id="distortionValue">55</span>%
      </label>

      <input
        id="distortionSlider"
        type="range"
        min="0"
        max="100"
        value="55"
      >

    </div>


    <div class="section">

      <div class="sectionTitle">
        系統狀態
      </div>

      <div
        id="systemStatus"
        class="status">
        系統待機中
      </div>

    </div>


    <button
      id="resetBtn"
      class="gray">
      重設裝置
    </button>

  </aside>

</div>


<canvas
  id="cameraAnalysis"
  width="160"
  height="120"
  style="display:none">
</canvas>


<script>

/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("stage");

const ctx =
  canvas.getContext("2d");

const video =
  document.getElementById("video");

const cameraAnalysis =
  document.getElementById("cameraAnalysis");

const cameraCtx =
  cameraAnalysis.getContext(
    "2d",
    {willReadFrequently:true}
  );


/* =========================================================
   基本
========================================================= */

const DEVICE_COUNT = 5;

let W = 0;
let H = 0;

const devices = [];

let selectedIndex = 2;


/* =========================================================
   偷看設定
========================================================= */

let maxPeekAngle = 32;

/*
  越大，轉得越快。
*/
let peekSpeed = .035;


/*
  現在正在偷看的棒子。
  一開始沒有。
*/
let watcherIndices = [];


/*
  下一次換人的時間。
*/
let nextWatcherChange = 0;


/*
  剛偵測到觀者時，
  先不要馬上看。
*/
let firstPeekTime = 0;


/*
  被「抓到」後，
  在這之前都先裝沒事。
*/
let caughtUntil = 0;


/*
  防止連續被觸發。
*/
let lastCaughtTime = 0;


let previousViewerPresent = false;


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;
let cameraReady = false;

let previousCameraFrame = null;

const viewer = {

  present:false,

  movement:0,

  rawMovement:0,

  movementX:.5,

  absentTime:0,

  sensitivity:40,

  sudden:false

};


/* =========================================================
   MICROPHONE
========================================================= */

let micStream = null;
let audioContext = null;
let analyser = null;
let microphoneSource = null;
let waveformBuffer = null;

let micReady = false;

let voiceLevel = 0;

const audioHistory = [];

let lastAudioCapture = 0;


/* =========================================================
   聲波
========================================================= */

let propagationDelay = 500;

let distortionStrength = .55;


/* =========================================================
   Device
========================================================= */

class Device{

  constructor(index){

    this.index = index;

    this.yaw =
      random(-3,3);

    this.targetYaw =
      this.yaw;

    this.phase =
      random(
        0,
        Math.PI * 2
      );

    /*
      每支偷看的偏差不同，
      不會像機器人一樣完全精準。
    */
    this.peekBias =
      random(-6,6);

    /*
      每支回到待機方向也不完全一樣。
    */
    this.homeYaw =
      random(-4,4);

    this.activity =
      .03;

  }


  update(now){

    const watching =
      watcherIndices.includes(
        this.index
      );


    /*
      麥克風只增加很輕微的身體反應，
      不再主導偷看。
    */
    const audioDistance =
      Math.abs(
        this.index -
        selectedIndex
      );


    const snapshot =
      getDelayedAudio(

        now

        -

        audioDistance *
        propagationDelay

      );


    const localVoice =
      snapshot
      ?
      levelFromRms(
        snapshot.rms
      )
      :
      0;


    /*
      =============================
      1. 被抓到
      =============================
    */

    if(
      now <
      caughtUntil
    ){

      /*
        原本正在偷看的棒子
        會比較快轉回正面。

        其他棒子繼續裝沒事。
      */

      if(watching){

        this.targetYaw =
          this.homeYaw;

        this.yaw =
          lerp(
            this.yaw,
            this.targetYaw,
            .12
          );

      }
      else{

        this.idleUpdate(now);

      }

      return;

    }


    /*
      =============================
      2. 偷看
      =============================
    */

    if(
      viewer.present
      &&
      watching
    ){

      const rodPosition =

        this.index

        /

        (
          DEVICE_COUNT - 1
        );


      /*
        觀者在這支棒子的左邊還右邊。
      */
      const difference =

        viewer.movementX

        -

        rodPosition;


      let direction =

        difference >= 0
        ?
        1
        :
        -1;


      /*
        如果剛好站在這支正前方，
        還是讓它稍微偏一邊偷看，
        不會死死正對。
      */
      if(
        Math.abs(difference) <
        .07
      ){

        direction =

          this.peekBias >= 0
          ?
          1
          :
          -1;

      }


      /*
        人離這支越遠，
        它需要轉得多一點。

        但不會超過 maxPeekAngle。
      */
      const distanceAmount =

        constrain(

          Math.abs(difference)
          *
          1.7,

          0,
          1

        );


      let angle =

        12

        +

        distanceAmount

        *

        (
          maxPeekAngle -
          12
        );


      /*
        留一點「餘光」偏差，
        不完全精準看著人。
      */
      angle +=
        this.peekBias;


      angle =

        constrain(

          Math.abs(angle),

          10,
          maxPeekAngle

        );


      this.targetYaw =

        direction
        *
        angle;


      /*
        偷看不是瞬間追蹤，
        而是慢慢轉過去。
      */
      const followSpeed =

        peekSpeed

        *

        (
          .75
          +
          viewer.movement * 1.8
        );


      this.yaw =

        lerp(

          this.yaw,

          this.targetYaw,

          constrain(
            followSpeed,
            .015,
            .09
          )

        );


      this.activity =

        lerp(
          this.activity,
          .7,
          .04
        );


      return;

    }


    /*
      =============================
      3. 不是偷看者
      =============================
    */

    /*
      說話的棒子可以有很輕微的反應，
      但不會搶掉偷看的角色。
    */
    if(
      localVoice >
      .04
    ){

      const voiceMotion =

        Math.sin(

          now / 480

          +

          this.phase

        )

        *

        7

        *

        localVoice;


      this.targetYaw =

        this.homeYaw

        +

        voiceMotion;


      this.yaw =

        lerp(
          this.yaw,
          this.targetYaw,
          .035
        );

      return;

    }


    this.idleUpdate(now);

  }


  idleUpdate(now){

    /*
      沒有偷看時只做很微弱的呼吸式動作。
    */

    const idle =

      Math.sin(

        now / 3100

        +

        this.phase

      )

      *
      1.8;


    this.targetYaw =

      this.homeYaw

      +

      idle;


    this.yaw =

      lerp(
        this.yaw,
        this.targetYaw,
        .015
      );


    this.activity =

      lerp(
        this.activity,
        .03,
        .02
      );

  }

}


/* =========================================================
   INIT
========================================================= */

function resetDevices(){

  devices.length = 0;

  for(
    let i = 0;
    i < DEVICE_COUNT;
    i++
  ){

    devices.push(
      new Device(i)
    );

  }

  watcherIndices = [];

  nextWatcherChange = 0;

  firstPeekTime = 0;

  caughtUntil = 0;

  lastCaughtTime = 0;

}


resetDevices();


/* =========================================================
   SIZE
========================================================= */

function resizeCanvas(){

  const rect =
    canvas
    .parentElement
    .getBoundingClientRect();


  W = rect.width;
  H = rect.height;


  canvas.width =
    Math.round(
      W *
      devicePixelRatio
    );


  canvas.height =
    Math.round(
      H *
      devicePixelRatio
    );


  canvas.style.width =
    W + "px";


  canvas.style.height =
    H + "px";


  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

}


resizeCanvas();


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   POSITION
========================================================= */

function getDevicePosition(index){

  return{

    x:
      mapValue(
        index,
        0,
        DEVICE_COUNT - 1,
        W * .17,
        W * .83
      ),

    y:
      H * .51

  };

}


/* =========================================================
   偷看控制
========================================================= */

function updateStealthBehavior(now){

  /*
    剛有人進來。
  */

  if(
    viewer.present
    &&
    !previousViewerPresent
  ){

    watcherIndices = [];

    /*
      不立刻看。
      先等 0.7～1.6 秒。
    */
    firstPeekTime =

      now

      +

      random(
        700,
        1600
      );


    nextWatcherChange =

      firstPeekTime;

  }


  /*
    人離開。
  */

  if(
    !viewer.present
    &&
    previousViewerPresent
  ){

    watcherIndices = [];

    firstPeekTime = 0;

    nextWatcherChange = 0;

  }


  /*
    大動作 = 像被發現。
  */

  if(
    viewer.present
    &&
    viewer.sudden
    &&
    watcherIndices.length > 0
    &&
    now - lastCaughtTime > 1800
  ){

    caughtUntil =

      now

      +

      random(
        900,
        1500
      );


    lastCaughtTime = now;


    /*
      被抓到後，
      不會馬上換下一支。
    */
    nextWatcherChange =

      caughtUntil

      +

      random(
        800,
        1800
      );

  }


  /*
    該換偷看的棒子了。
  */

  if(
    viewer.present
    &&
    now >= nextWatcherChange
    &&
    now >= caughtUntil
  ){

    chooseNewWatcher(now);

  }


  previousViewerPresent =
    viewer.present;

}


/* =========================================================
   換一支偷看
========================================================= */

function chooseNewWatcher(now){

  const oldWatcher =
    watcherIndices.length
    ?
    watcherIndices[0]
    :
    -1;


  let next = oldWatcher;


  /*
    不要連續同一支。
  */
  let safety = 0;


  while(
    next === oldWatcher
    &&
    safety < 20
  ){

    next =
      Math.floor(
        random(
          0,
          DEVICE_COUNT
        )
      );

    safety++;

  }


  watcherIndices = [next];


  /*
    偶爾有第二支也偷看，
    但機率不高。
  */
  if(
    Math.random() <
    .23
  ){

    const possible = [];

    if(next > 0){
      possible.push(
        next - 1
      );
    }

    if(
      next <
      DEVICE_COUNT - 1
    ){
      possible.push(
        next + 1
      );
    }


    if(possible.length){

      const second =

        possible[
          Math.floor(
            random(
              0,
              possible.length
            )
          )
        ];


      watcherIndices.push(
        second
      );

    }

  }


  /*
    4～7 秒後再換。
  */
  nextWatcherChange =

    now

    +

    random(
      4000,
      7000
    );

}


/* =========================================================
   CLICK = 選擇說話對象
========================================================= */

canvas.addEventListener(
  "click",
  event => {

    const rect =
      canvas.getBoundingClientRect();


    const mx =
      event.clientX -
      rect.left;


    const my =
      event.clientY -
      rect.top;


    let nearest = -1;

    let nearestDistance =
      Infinity;


    for(
      let i = 0;
      i < DEVICE_COUNT;
      i++
    ){

      const p =
        getDevicePosition(i);


      const dx =
        mx - p.x;


      const dy =
        my - p.y;


      const distance =
        Math.sqrt(
          dx * dx
          +
          dy * dy
        );


      if(
        distance < 140
        &&
        distance <
        nearestDistance
      ){

        nearest = i;

        nearestDistance =
          distance;

      }

    }


    if(
      nearest >= 0
    ){

      selectedIndex =
        nearest;

    }

  }
);


/* =========================================================
   CAMERA START
========================================================= */

async function startCamera(){

  try{

    if(
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "目前瀏覽器無法使用攝像頭"
      );

    }


    cameraStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        video:{
          width:{
            ideal:640
          },
          height:{
            ideal:480
          },
          facingMode:"user"
        },

        audio:false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    cameraReady = true;

    previousCameraFrame = null;


    document
    .getElementById(
      "cameraBtn"
    )
    .textContent =
      "攝像頭已開啟";


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "已啟動";

  }
  catch(error){

    cameraReady = false;

    console.error(error);


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "啟動失敗：" +
      error.name;

  }

}


document
.getElementById(
  "cameraBtn"
)
.addEventListener(
  "click",
  startCamera
);


/* =========================================================
   CAMERA ANALYSIS
========================================================= */

function analyzeCamera(){

  if(
    !cameraReady
    ||
    video.readyState < 2
  ){

    return;

  }


  cameraCtx.drawImage(

    video,

    0,
    0,

    cameraAnalysis.width,
    cameraAnalysis.height

  );


  const frame =

    cameraCtx
    .getImageData(

      0,
      0,

      cameraAnalysis.width,
      cameraAnalysis.height

    )
    .data;


  if(
    !previousCameraFrame
  ){

    previousCameraFrame =
      new Uint8ClampedArray(
        frame
      );

    return;

  }


  let changed = 0;

  let xTotal = 0;

  let checked = 0;


  const width =
    cameraAnalysis.width;


  const height =
    cameraAnalysis.height;


  const threshold =

    mapValue(

      viewer.sensitivity,

      5,
      80,

      85,
      18

    );


  for(
    let y = 0;
    y < height;
    y += 4
  ){

    for(
      let x = 0;
      x < width;
      x += 4
    ){

      const index =

        (
          y * width
          +
          x
        )
        *
        4;


      const difference =

        Math.abs(
          frame[index]
          -
          previousCameraFrame[index]
        )

        +

        Math.abs(
          frame[index + 1]
          -
          previousCameraFrame[index + 1]
        )

        +

        Math.abs(
          frame[index + 2]
          -
          previousCameraFrame[index + 2]
        );


      checked++;


      if(
        difference >
        threshold
      ){

        changed++;

        xTotal += x;

      }

    }

  }


  previousCameraFrame =
    new Uint8ClampedArray(
      frame
    );


  const ratio =

    changed

    /

    Math.max(
      1,
      checked
    );


  viewer.rawMovement =
    ratio;


  /*
    平滑過的動作量。
  */
  viewer.movement =

    lerp(

      viewer.movement,

      constrain(
        ratio * 2.5,
        0,
        1
      ),

      .28

    );


  /*
    動作中心位置。
  */

  if(
    changed > 0
  ){

    let averageX =

      xTotal /
      changed;


    /*
      video 是鏡像，
      這裡反轉一次。
    */
    averageX =

      width -
      averageX;


    viewer.movementX =

      lerp(

        viewer.movementX,

        averageX /
        width,

        .25

      );

  }


  /*
    判定觀者存在。
  */
  if(
    ratio >
    .0055
  ){

    viewer.present = true;

    viewer.absentTime = 0;

  }
  else{

    viewer.absentTime += 100;


    /*
      你暫時不動，
      不會馬上被判定消失。
    */
    if(
      viewer.absentTime >
      5500
    ){

      viewer.present = false;

    }

  }


  /*
    動作突然很大時，
    視為「它覺得好像被發現」。
  */
  viewer.sudden =

    ratio >
    .032;

}


/* =========================================================
   MICROPHONE
========================================================= */

async function startMicrophone(){

  try{

    if(
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "目前瀏覽器無法使用麥克風"
      );

    }


    if(micReady){
      return;
    }


    micStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:false,
          autoGainControl:false
        },

        video:false

      });


    const AudioCtx =

      window.AudioContext
      ||
      window.webkitAudioContext;


    audioContext =
      new AudioCtx();


    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();

    }


    analyser =
      audioContext
      .createAnalyser();


    analyser.fftSize =
      1024;


    analyser.smoothingTimeConstant =
      .18;


    waveformBuffer =

      new Uint8Array(
        analyser.fftSize
      );


    microphoneSource =

      audioContext
      .createMediaStreamSource(
        micStream
      );


    microphoneSource.connect(
      analyser
    );


    micReady = true;


    document
    .getElementById(
      "micBtn"
    )
    .textContent =
      "麥克風已開啟";


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "已啟動";

  }
  catch(error){

    micReady = false;

    console.error(error);


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "啟動失敗：" +
      error.name;

  }

}


async function stopMicrophone(){

  if(micStream){

    micStream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );

  }


  micStream = null;


  if(microphoneSource){

    try{
      microphoneSource.disconnect();
    }
    catch(error){}

  }


  microphoneSource = null;


  if(audioContext){

    try{
      await audioContext.close();
    }
    catch(error){}

  }


  audioContext = null;

  analyser = null;

  waveformBuffer = null;

  micReady = false;

  voiceLevel = 0;

  audioHistory.length = 0;


  document
  .getElementById(
    "micBtn"
  )
  .textContent =
    "開啟麥克風";


  document
  .getElementById(
    "micState"
  )
  .textContent =
    "未啟動";

}


document
.getElementById(
  "micBtn"
)
.addEventListener(
  "click",
  startMicrophone
);


document
.getElementById(
  "micStopBtn"
)
.addEventListener(
  "click",
  stopMicrophone
);


/* =========================================================
   AUDIO CAPTURE
========================================================= */

function captureAudio(now){

  if(
    !micReady
    ||
    !analyser
    ||
    !waveformBuffer
  ){

    voiceLevel =

      lerp(
        voiceLevel,
        0,
        .08
      );

    return;

  }


  if(
    now -
    lastAudioCapture <
    35
  ){

    return;

  }


  lastAudioCapture =
    now;


  analyser
  .getByteTimeDomainData(
    waveformBuffer
  );


  const sampleCount = 128;


  const samples =

    new Float32Array(
      sampleCount
    );


  let sumSquares = 0;


  for(
    let i = 0;
    i < sampleCount;
    i++
  ){

    const sourceIndex =

      Math.floor(

        i

        *

        (
          waveformBuffer.length -
          1
        )

        /

        (
          sampleCount -
          1
        )

      );


    const value =

      (
        waveformBuffer[sourceIndex]
        -
        128
      )

      /
      128;


    samples[i] =
      value;


    sumSquares +=

      value *
      value;

  }


  const rms =

    Math.sqrt(

      sumSquares
      /
      sampleCount

    );


  const currentLevel =

    levelFromRms(
      rms
    );


  voiceLevel =

    lerp(

      voiceLevel,

      currentLevel,

      .36

    );


  audioHistory.push({

    time:now,

    rms:rms,

    samples:samples

  });


  const cutoff =
    now - 8000;


  while(
    audioHistory.length > 0
    &&
    audioHistory[0].time <
    cutoff
  ){

    audioHistory.shift();

  }

}


function levelFromRms(rms){

  return constrain(

    (
      rms -
      .007
    )

    *
    17,

    0,
    1

  );

}


/* =========================================================
   AUDIO DELAY
========================================================= */

function getDelayedAudio(targetTime){

  if(
    audioHistory.length === 0
  ){

    return null;

  }


  if(
    targetTime <
    audioHistory[0].time
  ){

    return null;

  }


  for(
    let i =
      audioHistory.length - 1;

    i >= 0;

    i--
  ){

    if(
      audioHistory[i].time
      <=
      targetTime
    ){

      return audioHistory[i];

    }

  }


  return null;

}


/* =========================================================
   DRAW FLOOR
========================================================= */

function drawGround(){

  const floorY =
    H * .755;


  ctx.strokeStyle =
    "rgba(45,49,48,.08)";

  ctx.lineWidth = 1;


  ctx.beginPath();

  ctx.moveTo(
    45,
    floorY
  );

  ctx.lineTo(
    W - 45,
    floorY
  );

  ctx.stroke();

}


/* =========================================================
   DRAW DEVICE
========================================================= */

function drawDevice(
  device,
  now
){

  const p =

    getDevicePosition(
      device.index
    );


  const bodyHeight =

    Math.min(
      390,
      H * .48
    );


  const yawRad =

    device.yaw

    *
    Math.PI

    /
    180;


  /*
    圓柱正面寬約20，
    側面稍微縮窄。
  */
  const visibleWidth =

    11

    +

    9

    *
    Math.abs(
      Math.cos(
        yawRad
      )
    );


  /*
    攝像頭與螢幕固定在正面，
    所以會跟著棒子轉。
  */
  const surfaceX =

    Math.sin(
      yawRad
    )

    *
    visibleWidth

    *
    .57;


  const facing =

    .24

    +

    .76

    *
    Math.abs(
      Math.cos(
        yawRad
      )
    );


  ctx.save();


  ctx.translate(
    p.x,
    p.y
  );


  /* -----------------------------
     BLACK CYLINDER
  ----------------------------- */

  ctx.shadowBlur =

    7

    +

    device.activity *
    14;


  ctx.shadowColor =
    "rgba(0,0,0,.24)";


  const gradient =

    ctx.createLinearGradient(

      -visibleWidth / 2,
      0,

      visibleWidth / 2,
      0

    );


  const lightShift =

    Math.sin(
      yawRad
    )
    *
    .12;


  gradient.addColorStop(
    0,
    "#020202"
  );

  gradient.addColorStop(
    constrain(
      .30 + lightShift,
      .15,
      .43
    ),
    "#0b0b0b"
  );

  gradient.addColorStop(
    constrain(
      .52 + lightShift,
      .36,
      .67
    ),
    "#292929"
  );

  gradient.addColorStop(
    constrain(
      .72 + lightShift,
      .57,
      .87
    ),
    "#101010"
  );

  gradient.addColorStop(
    1,
    "#020202"
  );


  ctx.fillStyle =
    gradient;


  ctx.beginPath();

  ctx.roundRect(

    -visibleWidth / 2,

    -bodyHeight / 2,

    visibleWidth,

    bodyHeight,

    visibleWidth / 2

  );

  ctx.fill();


  ctx.shadowBlur = 0;


  /* -----------------------------
     TOP
  ----------------------------- */

  ctx.fillStyle =
    "#151515";


  ctx.beginPath();

  ctx.ellipse(

    0,

    -bodyHeight / 2,

    visibleWidth / 2,

    3,

    0,

    0,

    Math.PI * 2

  );

  ctx.fill();


  /* -----------------------------
     CAMERA
  ----------------------------- */

  const cameraY =

    -bodyHeight *
    .31;


  const cameraW =

    Math.max(
      7,
      20 * facing
    );


  const cameraH = 16;


  ctx.fillStyle =
    "#171d19";


  ctx.strokeStyle =
    "#464d47";


  ctx.lineWidth = 1;


  ctx.beginPath();

  ctx.roundRect(

    surfaceX -
    cameraW / 2,

    cameraY -
    cameraH / 2,

    cameraW,

    cameraH,

    2

  );

  ctx.fill();

  ctx.stroke();


  const lensR =

    Math.max(
      2,
      4.5 * facing
    );


  ctx.fillStyle =
    "#020303";


  ctx.beginPath();

  ctx.arc(

    surfaceX,

    cameraY,

    lensR,

    0,

    Math.PI * 2

  );

  ctx.fill();


  ctx.fillStyle =
    "rgba(125,160,170,.42)";


  ctx.beginPath();

  ctx.arc(

    surfaceX -
    lensR * .27,

    cameraY -
    lensR * .27,

    Math.max(
      .7,
      lensR * .22
    ),

    0,

    Math.PI * 2

  );

  ctx.fill();


  /* -----------------------------
     SCREEN
  ----------------------------- */

  const screenY =

    -bodyHeight *
    .01;


  const screenW =

    Math.max(
      10,
      54 * facing
    );


  const screenH = 82;


  ctx.fillStyle =
    "#060808";


  ctx.strokeStyle =

    device.index ===
    selectedIndex

    ?

    "rgba(210,220,215,.82)"

    :

    "#303432";


  ctx.lineWidth =

    device.index ===
    selectedIndex

    ?

    1.5

    :

    1;


  ctx.beginPath();

  ctx.roundRect(

    surfaceX -
    screenW / 2,

    screenY -
    screenH / 2,

    screenW,

    screenH,

    3

  );

  ctx.fill();

  ctx.stroke();


  const innerX =

    surfaceX -
    screenW / 2 +
    3;


  const innerY =

    screenY -
    screenH / 2 +
    3;


  const innerW =

    Math.max(
      3,
      screenW - 6
    );


  const innerH =

    screenH - 6;


  ctx.save();


  ctx.beginPath();

  ctx.roundRect(

    innerX,

    innerY,

    innerW,

    innerH,

    2

  );

  ctx.clip();


  drawWaveScreen(

    device.index,

    innerX,

    innerY,

    innerW,

    innerH,

    now

  );


  ctx.restore();


  /* -----------------------------
     BASE
  ----------------------------- */

  ctx.fillStyle =
    "#151515";


  ctx.beginPath();

  ctx.ellipse(

    0,

    bodyHeight / 2 + 8,

    16,

    4,

    0,

    0,

    Math.PI * 2

  );

  ctx.fill();


  ctx.restore();


  /*
    說話對象選取圈。
    實體作品可以拿掉。
  */
  if(
    device.index ===
    selectedIndex
  ){

    ctx.strokeStyle =
      "rgba(60,65,62,.20)";

    ctx.lineWidth = 1;


    ctx.beginPath();

    ctx.ellipse(

      p.x,

      p.y +
      bodyHeight / 2 +
      17,

      29,

      7,

      0,

      0,

      Math.PI * 2

    );

    ctx.stroke();

  }

}


/* =========================================================
   WAVE SCREEN
========================================================= */

function drawWaveScreen(
  deviceIndex,
  x,
  y,
  w,
  h,
  now
){

  ctx.fillStyle =
    "#040708";


  ctx.fillRect(
    x,
    y,
    w,
    h
  );


  const distance =

    Math.abs(

      deviceIndex

      -

      selectedIndex

    );


  const snapshot =

    getDelayedAudio(

      now

      -

      distance *
      propagationDelay

    );


  /*
    沒麥克風：
    顯示待機波。
  */
  if(
    !micReady
    ||
    !snapshot
  ){

    drawIdleSignal(
      x,
      y,
      w,
      h,
      now,
      deviceIndex
    );

    return;

  }


  const samples =
    snapshot.samples;


  const localLevel =

    levelFromRms(
      snapshot.rms
    );


  const distortion =

    constrain(

      distance

      *
      .24

      *
      distortionStrength,

      0,
      .88

    );


  /* -----------------------------
     SCAN LINE
  ----------------------------- */

  const scanY =

    y

    +

    (
      now / 18
      +
      deviceIndex * 17
    )

    %
    h;


  ctx.fillStyle =

    `rgba(
      180,
      215,
      220,
      ${.025 + distortion * .06}
    )`;


  ctx.fillRect(
    x,
    scanY,
    w,
    1
  );


  /* -----------------------------
     SIGNAL
  ----------------------------- */

  ctx.beginPath();


  const pointCount = 80;


  for(
    let i = 0;
    i < pointCount;
    i++
  ){

    const t =

      i

      /

      (
        pointCount - 1
      );


    const sourceIndex =

      Math.floor(

        t

        *

        (
          samples.length -
          1
        )

      );


    let sample =

      samples[
        sourceIndex
      ]

      *
      2.7;


    /*
      每多傳一支，
      多一點失真。
    */
    if(
      distance > 0
    ){

      const noise =

        (
          noise2D(

            i * .13
            +
            deviceIndex * 13,

            now * .003

          )

          -
          .5

        )

        *
        2;


      sample +=

        noise

        *
        distortion

        *
        .65;

    }


    if(
      distance >= 2
    ){

      sample +=

        Math.sin(

          t

          *
          Math.PI

          *
          (
            8
            +
            distance * 5
          )

          +

          now * .008

        )

        *
        distortion

        *
        .17;

    }


    const px =

      x

      +

      t *
      w;


    let py =

      y

      +

      h / 2

      +

      sample

      *
      h

      *
      .27;


    py +=

      Math.sin(

        t * 10

        +

        now * .006

        +

        deviceIndex

      )

      *
      distortion

      *
      h

      *
      .05;


    const breakChance =

      distance > 0

      ?

      distortion *
      .16

      :

      0;


    const broken =

      pseudoRandom(

        i

        +

        deviceIndex * 71,

        Math.floor(
          now / 120
        )

      )

      <
      breakChance;


    if(
      i === 0
      ||
      broken
    ){

      ctx.moveTo(
        px,
        py
      );

    }
    else{

      ctx.lineTo(
        px,
        py
      );

    }

  }


  const alpha =

    constrain(

      .35

      +

      localLevel *
      .8,

      .28,
      1

    );


  ctx.lineWidth =
    1.35;


  ctx.strokeStyle =

    `rgba(
      205,
      232,
      238,
      ${alpha}
    )`;


  ctx.shadowBlur =
    5;


  ctx.shadowColor =
    "rgba(170,215,225,.45)";


  ctx.stroke();


  ctx.shadowBlur = 0;


  /* -----------------------------
     GLITCH
  ----------------------------- */

  const glitchCount =

    Math.floor(

      distance

      *
      distortionStrength

      *
      3

    );


  for(
    let i = 0;
    i < glitchCount;
    i++
  ){

    const gy =

      y

      +

      pseudoRandom(

        deviceIndex * 50
        +
        i * 9,

        Math.floor(
          now / 100
        )

      )

      *
      h;


    ctx.fillStyle =

      `rgba(
        210,
        230,
        235,
        ${.03 + distortion * .09}
      )`;


    ctx.fillRect(
      x,
      gy,
      w,
      1.5
    );

  }


  /* -----------------------------
     NOISE
  ----------------------------- */

  const dots =

    Math.floor(
      distortion * 65
    );


  for(
    let i = 0;
    i < dots;
    i++
  ){

    const px =

      x

      +

      pseudoRandom(

        deviceIndex * 100
        +
        i * 11,

        Math.floor(
          now / 70
        )

      )

      *
      w;


    const py =

      y

      +

      pseudoRandom(

        deviceIndex * 70
        +
        i * 17,

        Math.floor(
          now / 70
        )
        +
        4

      )

      *
      h;


    ctx.fillStyle =

      `rgba(
        220,
        240,
        242,
        ${.03 + distortion * .16}
      )`;


    ctx.fillRect(
      px,
      py,
      1,
      1
    );

  }

}


/* =========================================================
   IDLE SCREEN
========================================================= */

function drawIdleSignal(
  x,
  y,
  w,
  h,
  now,
  index
){

  ctx.beginPath();


  for(
    let i = 0;
    i < 50;
    i++
  ){

    const t =
      i / 49;


    const px =

      x

      +

      t *
      w;


    const py =

      y

      +

      h / 2

      +

      Math.sin(

        t
        *
        Math.PI
        *
        4

        +

        now / 1000

        +

        index

      )

      *
      1.1;


    if(i === 0){

      ctx.moveTo(
        px,
        py
      );

    }
    else{

      ctx.lineTo(
        px,
        py
      );

    }

  }


  ctx.lineWidth = 1;


  ctx.strokeStyle =
    "rgba(145,170,165,.20)";


  ctx.stroke();

}

      "peekSpeedValue"
    )
    .textContent =
      value;

  }
);


document

)
.addEventListener(

      );

    )

  }
);


document

)

      )

    .getElementById(

    )

  }
);

.getElementById(

)

/* =========================================================
   UTILITY
========================================================= */

function random(min,max){

  if(max === undefined){

    max = min;
    min = 0;

  }

  return(
    Math.random()
    *
    (
      max - min
    )
    +
    min
  );

}


function lerp(a,b,t){

  return(
    a
    +
    (
      b - a
    )
    *
    t
  );

}


function constrain(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function mapValue(
  value,
  inMin,
  inMax,
  outMin,
  outMax
){

  return(

    (
      value - inMin
    )

    /

    (
      inMax - inMin
    )

    *

    (
      outMax - outMin
    )

    +

    outMin

  );

}


function noise2D(
  x,
  y
){

  return pseudoRandom(
    Math.floor(
      x * 100
    ),
    Math.floor(
      y * 100
    )
  );

}


function pseudoRandom(
  a,
  b
){

  const value =

    Math.sin(

      a * 12.9898

      +

      b * 78.233

    )

    *
    43758.5453;


  return(
    value
    -
    Math.floor(
      value
    )
  );

}


/* =========================================================
   ANIMATION
========================================================= */

let previousTime =
  performance.now();


let previousCameraAnalysis = 0;


function animate(now){

  const dt =

    Math.min(
      50,
      now - previousTime
    );


  previousTime =
    now;


  /*
    Camera analysis
  */
  if(
    now -
    previousCameraAnalysis >
    100
  ){

    analyzeCamera();

    previousCameraAnalysis =
      now;

  }


  /*
    聲音
  */
  captureAudio(now);


  /*
    偷看邏輯
  */
  updateStealthBehavior(now);


  /*
    更新棒子
  */
  devices.forEach(
    device =>
      device.update(now)
  );


  /*
    Draw
  */
  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawGround();


  devices.forEach(
    device =>
      drawDevice(
        device,
        now
      )
  );


  updateUI(now);


  /*
    sudden 只維持很短，
    避免每一 frame 都觸發。
  */
  viewer.sudden = false;


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);
