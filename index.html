<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搖曳時光</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; background:#101b2d; font-family:"Noto Sans TC",system-ui,sans-serif; color:#fff; }
    #game { position:fixed; inset:0; }
    canvas { display:block; }
    .panel { position:fixed; z-index:4; border:1px solid #ffffff44; background:#0b1325b8; backdrop-filter:blur(12px); border-radius:16px; padding:14px 16px; box-shadow:0 10px 35px #0004; }
    #title { left:20px; top:20px; } #title h1 { margin:0; font-size:25px; letter-spacing:.12em; } #seasonName { margin-top:5px; color:#ffe5a3; }
    #status { left:20px; bottom:20px; font-size:14px; line-height:1.7; }
    #help { right:20px; bottom:20px; max-width:290px; font-size:13px; line-height:1.6; }
    #cameraWrap { position:fixed; right:20px; top:20px; z-index:3; width:min(31vw,390px); aspect-ratio:4/3; border-radius:17px; overflow:hidden; border:1px solid #ffffff66; background:#000; box-shadow:0 10px 35px #0007; }
    #cameraWrap video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
    #cameraLabel { position:absolute; top:9px; left:10px; padding:4px 8px; background:#0008; border-radius:8px; font-size:12px; }
    #start { position:fixed; z-index:10; inset:0; display:grid; place-items:center; background:#081224e8; text-align:center; padding:24px; }
    #start .card { max-width:530px; padding:32px; border-radius:22px; background:#14233e; border:1px solid #ffffff2e; }
    button { padding:13px 22px; border:0; border-radius:99px; cursor:pointer; font:inherit; font-weight:700; background:#f8c96e; color:#243147; }
    @media(max-width:650px) { #cameraWrap{width:43vw;right:12px;top:12px} .panel{padding:10px 12px} #title{left:12px;top:12px} #status{left:12px;bottom:12px} #help{display:none} }
  </style>
</head>
<body>
  <main id="game"></main>
  <section id="title" class="panel"><h1>搖曳時光</h1><div id="seasonName">春・播種</div></section>
  <section id="cameraWrap"><video id="camera" playsinline muted></video><span id="cameraLabel">你的攝影機</span></section>
  <section id="status" class="panel">鏡頭：尚未啟動<br>人體：等待辨識<br>得分：0</section>
  <section id="help" class="panel">按 <b>← →</b> 或點擊畫面切換季節。<br>春：前傾＋手向下撒種　夏：左右搖擺＋揮手抓螢火蟲<br>秋：站在中央穩定＋收割動作　冬：後仰＋雙手舉高點燈籠</section>
  <div id="start"><div class="card"><h2>準備進入《搖曳時光》</h2><p>按下按鈕後，瀏覽器會要求使用攝影機。影像只在你的裝置上用於姿勢辨識，不會上傳。</p><button id="startButton">開啟攝影機並開始</button><p id="error" aria-live="polite"></p></div></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.2/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script>
  (() => {
    const video = document.querySelector('#camera'), status = document.querySelector('#status'), start = document.querySelector('#start'), error = document.querySelector('#error');
    const seasons=[{name:'春・播種',bg:['#83cfa2','#bee99d'],accent:'#4b8f57',instruction:'前傾＋手向下撒種'}, {name:'夏・捕捉螢火蟲',bg:['#267c9c','#08354c'],accent:'#ffd96b',instruction:'左右搖擺＋揮手抓螢火蟲'}, {name:'秋・收割',bg:['#d98a45','#5d3531'],accent:'#ffe2a0',instruction:'中心穩定＋收割動作'}, {name:'冬・點燈籠',bg:['#59799d','#192b4c'],accent:'#ffd675',instruction:'後仰＋雙手舉高點燈籠'}];
    let season=0, points=0, pose, poseNet, lastAction=0, cameraReady=false, modelReady=false;
    const now=()=>performance.now();
    function kp(n){ return pose && pose.keypoints && pose.keypoints.find(k=>k.part===n && k.score>.25); }
    function addPoint(label){ if(now()-lastAction<850) return; lastAction=now(); points++; flash=1; actionText=label; }
    let flash=0, actionText='';
    async function begin(){
      try {
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:720}},audio:false});
        video.srcObject=stream; await video.play(); cameraReady=true; start.style.display='none';
        poseNet=ml5.poseNet(video,{flipHorizontal:true},()=>{modelReady=true});
        poseNet.on('pose', results=>{ pose=results[0]?.pose; });
      } catch(e) { error.textContent='無法開啟攝影機：'+(e.name==='NotAllowedError'?'請允許攝影機權限後重新整理。':e.message); }
    }
    document.querySelector('#startButton').onclick=begin;
    function act(){
      if(!pose) return; const lw=kp('leftWrist'),rw=kp('rightWrist'),ls=kp('leftShoulder'),rs=kp('rightShoulder'),lh=kp('leftHip'),rh=kp('rightHip');
      if(!lw||!rw||!ls||!rs) return;
      const shoulderY=(ls.position.y+rs.position.y)/2, wristY=(lw.position.y+rw.position.y)/2, shoulderX=(ls.position.x+rs.position.x)/2;
      if(season===0 && lh && rh && wristY>shoulderY+65) addPoint('種子落入春土');
      if(season===1 && Math.abs(lw.position.x-rw.position.x)>150 && wristY<shoulderY+55) addPoint('捕捉到螢火蟲');
      if(season===2 && Math.abs(shoulderX-video.videoWidth/2)<95 && Math.abs(lw.position.y-rw.position.y)>55) addPoint('收成一束金穗');
      if(season===3 && lw.position.y<shoulderY-55 && rw.position.y<shoulderY-55) addPoint('燈籠亮起');
    }
    function switchSeason(next){ season=(season+next+4)%4; document.querySelector('#seasonName').textContent=seasons[season].name; actionText=''; }
    window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')switchSeason(-1);if(e.key==='ArrowRight')switchSeason(1)});
    new p5(p=>{
      p.setup=()=>p.createCanvas(p.windowWidth,p.windowHeight).parent('game'); p.windowResized=()=>p.resizeCanvas(p.windowWidth,p.windowHeight);
      p.mousePressed=()=>{if(p.mouseY>100 && p.mouseX<p.width*.6)switchSeason(1)};
      p.draw=()=>{ const s=seasons[season]; p.background(s.bg[0]);
        for(let y=0;y<p.height;y+=7){p.stroke(p.lerpColor(p.color(s.bg[0]),p.color(s.bg[1]),y/p.height));p.line(0,y,p.width,y)}
        p.noStroke(); p.fill(255,255,255,20); for(let i=0;i<18;i++)p.ellipse((i*137+p.frameCount*.18)%p.width,(i*83)%p.height,90,40);
        p.fill(s.accent); if(season===0){for(let i=0;i<p.width;i+=38){let h=60+22*Math.sin(p.frameCount*.02+i);p.triangle(i,p.height,i+19,p.height-h,i+38,p.height)}}
        if(season===1){for(let i=0;i<35;i++){p.fill('#fff49a');p.circle((i*103+p.frameCount*(i%2?1:-1))%p.width,120+(i*67)%Math.max(160,p.height-190),5+3*Math.sin(p.frameCount*.08+i));}}
        if(season===2){p.fill('#774128');for(let x=0;x<p.width;x+=32){p.rect(x,p.height-130,3,130);p.fill('#f3c35d');p.ellipse(x+4,p.height-170,14,80);p.fill('#774128');}}
        if(season===3){for(let i=0;i<10;i++){p.fill('#f7bf50');p.rect(70+i*(p.width-140)/9,130+(i%2)*60,28,42,6);p.fill(255,240,170);p.circle(84+i*(p.width-140)/9,151+(i%2)*60,15)}}
        act(); flash*=.93; if(flash>.03){p.fill(255,255,255,flash*150);p.rect(0,0,p.width,p.height);}
        p.fill(255);p.textAlign(p.CENTER);p.textSize(25);p.text(actionText||s.instruction,p.width/2,p.height*.84);
        const cam=cameraReady?'已開啟':'尚未啟動', human=pose?'偵測到':'等待辨識'; status.innerHTML=`鏡頭：${cam}<br>人體：${human}<br>得分：${points}`;
      };
    });
  })();
  </script>
</body>
</html>
