<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>誤會機器｜順從 → 傳遞 → 混亂</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  overflow:hidden;

  background:#ece9e2;
  color:#303532;

  font-family:
  "Microsoft JhengHei",
  "Noto Sans TC",
  sans-serif;
}

#app{
  width:100%;
  height:100vh;

  display:grid;

  grid-template-columns:
  minmax(0,1fr)
  360px;
}

#stageWrap{
  position:relative;
  overflow:hidden;

  background:
  radial-gradient(
    circle at 50% 42%,
    #faf9f5 0%,
    #eeebe4 58%,
    #ded9cf 100%
  );
}

#stage{
  display:block;

  width:100%;
  height:100%;

  cursor:pointer;
}

#title{
  position:absolute;

  left:28px;
  top:24px;

  pointer-events:none;
}

#title h1{
  margin:0;

  font-size:28px;
}

#title p{
  margin:7px 0 0;

  font-size:13px;

  color:#6c736f;
}

#phaseBox{
  position:absolute;

  left:28px;
  bottom:25px;

  padding:11px 15px;

  background:rgba(255,255,255,.9);

  border:
  1px solid rgba(0,0,0,.05);

  border-radius:10px;

  font-size:13px;
  line-height:1.65;

  pointer-events:none;
}

#phaseName{
  font-weight:700;
}

#panel{
  padding:20px;

  overflow-y:auto;

  background:#faf9f6;

  border-left:
  1px solid #ddd8ce;
}

.section{
  margin-bottom:22px;
}

.sectionTitle{
  margin-bottom:10px;

  font-size:13px;
  font-weight:700;
}

video{
  display:block;

  width:100%;

  min-height:145px;

  object-fit:cover;

  background:#111;

  border-radius:8px;

  transform:
  scaleX(-1);
}

button{
  width:100%;

  margin:0 0 8px;

  padding:11px;

  border:0;

  border-radius:9px;

  font-weight:700;

  cursor:pointer;
}

button.dark{
  background:#222;
  color:#fff;
}

button.light{
  background:#e5e1da;
  color:#333;
}

button.gray{
  background:#d2cec5;
  color:#333;
}

button.test{
  background:#4b514e;
  color:#fff;
}

.status{
  padding:11px;

  background:#fff;

  border:
  1px solid #dedad1;

  border-radius:8px;

  font-size:12px;
  line-height:1.8;
}

label{
  display:block;

  margin:12px 0 5px;

  font-size:12px;
}

input[type="range"]{
  width:100%;
}

.meter{
  height:8px;

  margin-top:7px;

  overflow:hidden;

  background:#e1ddd5;

  border-radius:999px;
}

#cameraMeter,
#voiceMeter,
#chaosMeter{
  width:0%;
  height:100%;

  background:#373d3a;

  transition:
  width .07s linear;
}

.small{
  margin-top:8px;

  color:#777;

  font-size:11px;
  line-height:1.6;
}

</style>
</head>

<body>

<div id="app">

  <!-- 左側模擬畫面 -->

  <div id="stageWrap">

    <canvas id="stage"></canvas>

    <div id="title">

      <h1>
        《誤會機器》
      </h1>

      <p>
        順從 → 說話 → 資訊傳遞 → 群體偏差
      </p>

    </div>

    <div id="phaseBox">

      目前狀態：

      <span id="phaseName">
        順從
      </span>

      <br>

      <span id="phaseDescription">
        裝置正在跟隨觀者的位置。
      </span>

    </div>

  </div>


  <!-- 右側控制 -->

  <aside id="panel">


    <!-- 攝像頭 -->

    <div class="section">

      <div class="sectionTitle">
        觀者位置
      </div>

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <br>

      <button
        id="cameraBtn"
        class="dark">
        開啟攝像頭
      </button>

      <div class="status">

        攝像頭：

        <b id="cameraState">
          未啟動
        </b>

        <br>

        觀者位置：

        <b id="viewerPosition">
          —
        </b>

        <br>

        動作量：

        <b>
          <span id="cameraPercent">
            0
          </span>%
        </b>

        <div class="meter">

          <div id="cameraMeter"></div>

        </div>

      </div>

    </div>


    <!-- 麥克風 -->

    <div class="section">

      <div class="sectionTitle">
        聲音觸發
      </div>

      <button
        id="micBtn"
        class="dark">
        開啟麥克風
      </button>

      <button
        id="micStopBtn"
        class="light">
        停止麥克風
      </button>

      <button
        id="simulateVoiceBtn"
        class="test">
        模擬說話／開始傳遞
      </button>

      <div class="status">

        麥克風：

        <b id="micState">
          未啟動
        </b>

        <br>

        聲音強度：

        <b>
          <span id="voicePercent">
            0
          </span>%
        </b>

        <div class="meter">

          <div id="voiceMeter"></div>

        </div>

      </div>

      <div class="small">

        順從階段中，說話超過門檻後，
        距離觀者最近的裝置會成為資訊起點。

      </div>

    </div>


    <!-- 群體狀態 -->

    <div class="section">

      <div class="sectionTitle">
        群體狀態
      </div>

      <div class="status">

        階段：

        <b id="modeText">
          順從
        </b>

        <br>

        資訊起點：

        <b id="sourceText">
          —
        </b>

        <br>

        混亂程度：

        <b>
          <span id="chaosPercent">
            0
          </span>%
        </b>

        <div class="meter">

          <div id="chaosMeter"></div>

        </div>

        <br>

        已接收資訊：

        <b>

          <span id="infectedCount">
            0
          </span>

          / 5

        </b>

      </div>

    </div>


    <!-- 參數 -->

    <div class="section">

      <div class="sectionTitle">
        動作設定
      </div>


      <label>

        攝像頭敏感度：

        <span id="sensitivityValue">
          40
        </span>

      </label>

      <input
        id="sensitivitySlider"
        type="range"
        min="5"
        max="80"
        value="40"
      >


      <label>

        順從時最大偏角：

        <span id="followAngleValue">
          10
        </span>°

      </label>

      <input
        id="followAngleSlider"
        type="range"
        min="3"
        max="20"
        value="10"
      >


      <label>

        混亂時最大偏角：

        <span id="chaosAngleValue">
          28
        </span>°

      </label>

      <input
        id="chaosAngleSlider"
        type="range"
        min="10"
        max="45"
        value="28"
      >


      <label>

        說話觸發門檻：

        <span id="voiceThresholdValue">
          16
        </span>%

      </label>

      <input
        id="voiceThresholdSlider"
        type="range"
        min="5"
        max="50"
        value="16"
      >


      <label>

        靠近速度：

        <span id="transferTimeValue">
          1200
        </span> ms

      </label>

      <input
        id="transferTimeSlider"
        type="range"
        min="500"
        max="2500"
        step="100"
        value="1200"
      >


      <label>

        混亂成長速度：

        <span id="chaosSpeedValue">
          40
        </span>%

      </label>

      <input
        id="chaosSpeedSlider"
        type="range"
        min="10"
        max="100"
        value="40"
      >

    </div>


    <button
      id="resetBtn"
      class="gray">
      回到順從狀態
    </button>

  </aside>

</div>


<!-- 攝像頭分析畫布 -->

<canvas
  id="cameraAnalysis"
  width="160"
  height="120"
  style="display:none">
</canvas>


<script>

/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("stage");

const ctx =
  canvas.getContext("2d");

const video =
  document.getElementById("video");

const analysisCanvas =
  document.getElementById(
    "cameraAnalysis"
  );

const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );


/* =========================================================
   SYSTEM
========================================================= */

const DEVICE_COUNT = 5;

let W = 0;
let H = 0;

const devices = [];


/*
  三個主要狀態：

  FOLLOW
  TRANSFER
  CHAOS
*/

let mode = "FOLLOW";

let chaos = 0;

let sourceIndex = -1;

let visited =
  new Set();

let pendingEdges = [];

let currentTransfer = null;


/* =========================================================
   SETTINGS
========================================================= */

let followMaxAngle = 10;

let chaosMaxAngle = 28;

let voiceThreshold = .16;

let transferApproachTime = 1200;

let chaosGrowthSpeed = .40;


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;

let cameraReady = false;

let previousCameraFrame = null;


const viewer = {

  present:false,

  x:.5,

  movement:0,

  absentTime:0,

  sensitivity:40

};


/* =========================================================
   MICROPHONE
========================================================= */

let micStream = null;

let audioContext = null;

let analyser = null;

let micSource = null;

let micBuffer = null;

let micReady = false;

let voiceLevel = 0;

let voiceHold = 0;


/* =========================================================
   DEVICE
========================================================= */

class Device{

  constructor(index){

    this.index = index;

    this.angle = 0;

    this.targetAngle = 0;

    /*
      info：

      0 = 沒資訊
      1 = 已經收到大量資訊
    */

    this.info = 0;

    /*
      接觸時 LED / 螢幕閃一下。
    */

    this.flash = 0;


    this.phase =

      Math.random()

      *

      Math.PI

      *

      2;


    /*
      每支只有非常小的個體差異。
    */

    this.followWeight =

      random(
        .97,
        1.03
      );


    /*
      混亂期自己的目標。
    */

    this.chaosTarget = 0;


    this.nextChaosShift = 0;


    /*
      流體內部粒子。
    */

    this.fluidSeeds = [];


    for(
      let i = 0;
      i < 80;
      i++
    ){

      this.fluidSeeds.push({

        phase:
          Math.random()
          *
          Math.PI
          *
          2,

        speed:
          random(
            .65,
            1.4
          ),

        size:
          random(
            .5,
            1.7
          ),

        offset:
          random(
            -1,
            1
          )

      });

    }

  }



  update(now,dt){

    /*
      flash 慢慢衰退。
    */

    this.flash =

      Math.max(

        0,

        this.flash

        -

        dt /
        520

      );


    /* =====================================
       FOLLOW
    ===================================== */

    if(
      mode === "FOLLOW"
    ){

      const observerAngle =

        viewer.present

        ?

        (
          viewer.x -
          .5
        )

        *
        2

        *
        followMaxAngle

        :

        0;


      this.targetAngle =

        observerAngle

        *
        this.followWeight;


      /*
        動作偏慢，
        不會像直接控制 Servo。
      */

      this.angle =

        lerp(

          this.angle,

          this.targetAngle,

          .055

        );


      this.info =

        lerp(

          this.info,

          0,

          .035

        );


      return;

    }



    /* =====================================
       TRANSFER
    ===================================== */

    if(
      mode === "TRANSFER"
    ){

      /*
        正在交換資訊的兩支
        由 updateTransfer() 控制。
      */

      if(
        currentTransfer

        &&

        (
          this.index ===
          currentTransfer.from

          ||

          this.index ===
          currentTransfer.to
        )
      ){

        return;

      }


      /*
        其他支仍然保留一些順從，
        但開始產生輕微偏差。
      */

      if(
        now >
        this.nextChaosShift
      ){

        this.nextChaosShift =

          now

          +

          random(
            900,
            2100
          );


        this.chaosTarget =

          random(

            -chaosMaxAngle,

            chaosMaxAngle

          );

      }


      const followAngle =

        viewer.present

        ?

        (
          viewer.x -
          .5
        )

        *
        2

        *
        followMaxAngle

        :

        0;


      /*
        Chaos 越高，
        越不服從人。
      */

      const obedience =

        1

        -

        chaos *
        .55;


      this.targetAngle =

        followAngle

        *
        obedience

        +

        this.chaosTarget

        *
        chaos

        *
        .22;


      this.targetAngle =

        constrain(

          this.targetAngle,

          -chaosMaxAngle,

          chaosMaxAngle

        );


      this.angle =

        lerp(

          this.angle,

          this.targetAngle,

          .035
          +
          chaos *
          .018

        );


      return;

    }



    /* =====================================
       CHAOS
    ===================================== */

    if(
      mode === "CHAOS"
    ){

      /*
        每隔一段時間，
        每支產生新的個體偏差。
      */

      if(
        now >
        this.nextChaosShift
      ){

        this.nextChaosShift =

          now

          +

          random(
            900,
            2400
          );


        this.chaosTarget =

          random(

            -chaosMaxAngle,

            chaosMaxAngle

          );

      }


      /*
        鄰居平均。
      */

      let neighborAverage = 0;

      let neighborCount = 0;


      if(
        this.index > 0
      ){

        neighborAverage +=

          devices[
            this.index - 1
          ].angle;


        neighborCount++;

      }


      if(
        this.index <
        DEVICE_COUNT - 1
      ){

        neighborAverage +=

          devices[
            this.index + 1
          ].angle;


        neighborCount++;

      }


      if(
        neighborCount > 0
      ){

        neighborAverage /=

          neighborCount;

      }


      /*
        觀者仍然存在，
        但控制力越來越弱。
      */

      const followAngle =

        viewer.present

        ?

        (
          viewer.x -
          .5
        )

        *
        2

        *
        followMaxAngle

        :

        0;


      const obedience =

        Math.max(

          .15,

          1 -
          chaos

        );


      /*
        不是純亂數。

        由三件事共同決定：

        1. 觀者
        2. 自己
        3. 鄰居
      */

      this.targetAngle =

        followAngle

        *
        obedience

        +

        this.chaosTarget

        *
        chaos

        *
        .38

        +

        neighborAverage

        *
        chaos

        *
        .10;


      this.targetAngle =

        constrain(

          this.targetAngle,

          -chaosMaxAngle,

          chaosMaxAngle

        );


      /*
        平滑移動，
        不抽搐。
      */

      this.angle =

        lerp(

          this.angle,

          this.targetAngle,

          .024
          +
          chaos *
          .018

        );

    }

  }

}


/* =========================================================
   RESET
========================================================= */

function resetSystem(){

  mode =
    "FOLLOW";

  chaos =
    0;

  sourceIndex =
    -1;

  visited =
    new Set();

  pendingEdges =
    [];

  currentTransfer =
    null;

  voiceHold =
    0;


  devices.length =
    0;


  for(
    let i = 0;
    i < DEVICE_COUNT;
    i++
  ){

    devices.push(

      new Device(i)

    );

  }

}


resetSystem();


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas(){

  const rect =

    canvas
    .parentElement
    .getBoundingClientRect();


  W =
    rect.width;

  H =
    rect.height;


  canvas.width =

    Math.round(

      W *
      devicePixelRatio

    );


  canvas.height =

    Math.round(

      H *
      devicePixelRatio

    );


  canvas.style.width =
    W + "px";


  canvas.style.height =
    H + "px";


  ctx.setTransform(

    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0

  );

}


resizeCanvas();


window.addEventListener(

  "resize",

  resizeCanvas

);


/* =========================================================
   LAYOUT
========================================================= */

function getBaseY(){

  return H * .73;

}


function getBodyHeight(){

  return Math.min(

    245,

    H * .34

  );

}


function getBodyWidth(){

  return Math.min(

    65,

    W * .055

  );

}


function getDeviceX(index){

  return mapValue(

    index,

    0,
    DEVICE_COUNT - 1,

    W * .16,
    W * .84

  );

}


/* =========================================================
   CAMERA START
========================================================= */

async function startCamera(){

  try{

    cameraStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        video:{

          width:{
            ideal:640
          },

          height:{
            ideal:480
          },

          facingMode:
            "user"

        },

        audio:false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    cameraReady =
      true;


    previousCameraFrame =
      null;


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "已啟動";


    document
    .getElementById(
      "cameraBtn"
    )
    .textContent =
      "攝像頭已開啟";

  }

  catch(error){

    cameraReady =
      false;


    console.error(
      error
    );


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "啟動失敗";

  }

}


document
.getElementById(
  "cameraBtn"
)
.addEventListener(
  "click",
  startCamera
);


/* =========================================================
   CAMERA ANALYSIS
========================================================= */

function analyzeCamera(){

  if(
    !cameraReady

    ||

    video.readyState <
    2
  ){

    return;

  }


  analysisCtx.drawImage(

    video,

    0,
    0,

    analysisCanvas.width,
    analysisCanvas.height

  );


  const frame =

    analysisCtx
    .getImageData(

      0,
      0,

      analysisCanvas.width,
      analysisCanvas.height

    )
    .data;


  if(
    !previousCameraFrame
  ){

    previousCameraFrame =

      new Uint8ClampedArray(
        frame
      );

    return;

  }


  const width =
    analysisCanvas.width;


  const height =
    analysisCanvas.height;


  const threshold =

    mapValue(

      viewer.sensitivity,

      5,
      80,

      88,
      18

    );


  let changed = 0;

  let checked = 0;

  let xTotal = 0;


  for(
    let y = 0;
    y < height;
    y += 4
  ){

    for(
      let x = 0;
      x < width;
      x += 4
    ){

      const i =

        (
          y * width
          +
          x
        )

        *
        4;


      const diff =

        Math.abs(

          frame[i]

          -

          previousCameraFrame[i]

        )

        +

        Math.abs(

          frame[i+1]

          -

          previousCameraFrame[i+1]

        )

        +

        Math.abs(

          frame[i+2]

          -

          previousCameraFrame[i+2]

        );


      checked++;


      if(
        diff >
        threshold
      ){

        changed++;

        xTotal +=
          x;

      }

    }

  }


  previousCameraFrame =

    new Uint8ClampedArray(
      frame
    );


  const ratio =

    changed

    /

    Math.max(
      1,
      checked
    );


  viewer.movement =

    lerp(

      viewer.movement,

      constrain(

        ratio * 3,

        0,
        1

      ),

      .3

    );


  /*
    主要移動位置。
  */

  if(
    changed > 0
  ){

    let averageX =

      xTotal

      /

      changed;


    /*
      Video 是鏡像顯示，
      所以反轉。
    */

    averageX =

      width

      -

      averageX;


    viewer.x =

      lerp(

        viewer.x,

        constrain(

          averageX /
          width,

          0,
          1

        ),

        .32

      );

  }


  /*
    判斷觀者存在。
  */

  if(
    ratio >
    .005
  ){

    viewer.present =
      true;

    viewer.absentTime =
      0;

  }

  else{

    viewer.absentTime +=
      100;


    /*
      停下來不會立即消失。
    */

    if(
      viewer.absentTime >
      6500
    ){

      viewer.present =
        false;

    }

  }

}


/* =========================================================
   MICROPHONE START
========================================================= */

async function startMicrophone(){

  try{

    if(
      micReady
    ){

      return;

    }


    micStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        audio:{

          echoCancellation:true,

          noiseSuppression:false,

          autoGainControl:false

        },

        video:false

      });


    const AudioCtx =

      window.AudioContext

      ||

      window.webkitAudioContext;


    audioContext =

      new AudioCtx();


    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();

    }


    analyser =

      audioContext
      .createAnalyser();


    analyser.fftSize =
      1024;


    analyser.smoothingTimeConstant =
      .25;


    micBuffer =

      new Uint8Array(
        analyser.fftSize
      );


    micSource =

      audioContext
      .createMediaStreamSource(
        micStream
      );


    micSource.connect(
      analyser
    );


    micReady =
      true;


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "已啟動";


    document
    .getElementById(
      "micBtn"
    )
    .textContent =
      "麥克風已開啟";

  }

  catch(error){

    micReady =
      false;


    console.error(
      error
    );


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "啟動失敗";

  }

}


/* =========================================================
   STOP MICROPHONE
========================================================= */

async function stopMicrophone(){

  if(
    micStream
  ){

    micStream
    .getTracks()
    .forEach(

      track =>
        track.stop()

    );

  }


  micStream =
    null;


  if(
    micSource
  ){

    try{

      micSource.disconnect();

    }

    catch(error){}

  }


  if(
    audioContext
  ){

    try{

      await audioContext.close();

    }

    catch(error){}

  }


  micSource =
    null;

  audioContext =
    null;

  analyser =
    null;

  micBuffer =
    null;

  micReady =
    false;

  voiceLevel =

  voiceHold =

  )

  )

}

/* =========================================================
   AUDIO LEVEL
========================================================= */

function updateAudio(dt,now){

  if(
    !micReady

    ||

    !analyser

    ||

    !micBuffer
  ){

    voiceLevel =

      lerp(

        voiceLevel,

        0,

        .06

      );


    voiceHold =
      0;


    return;

  }


  analyser
  .getByteTimeDomainData(
    micBuffer
  );


  let sum = 0;

  let count = 0;


  for(
    let i = 0;
    i < micBuffer.length;
    i += 4
  ){

    const value =

      (
        micBuffer[i]

        -

        128
      )

      /
      128;


    sum +=

      value

      *
      value;


    count++;

  }


  const rms =

    Math.sqrt(

      sum

      /

      Math.max(
        1,
        count
      )

    );


  const level =

    constrain(

      (
        rms -
        .006
      )

      *
      15,

      0,
      1

    );


  voiceLevel =

    lerp(

      voiceLevel,

      level,

      .32

    );


  /*
    只有順從期說話
    才會啟動後續系統。
  */

  if(
    mode ===
    "FOLLOW"
  ){

    if(
      voiceLevel >
      voiceThreshold
    ){

      voiceHold +=
        dt;

    }

    else{

      voiceHold =

        Math.max(

          0,

          voiceHold

          -

          dt * 1.8

        );

    }


    if(
      voiceHold >
      280
    ){

      startInformationTransmission(
        now
      );


      voiceHold =
        0;

    }

  }

}

/* =========================================================
   START INFORMATION
========================================================= */

function startInformationTransmission(now){

  mode =
    "TRANSFER";


  chaos =
    .06;


  /*
    說話時，
    離觀者最近的裝置
    變成資訊起點。
  */

  if(
    viewer.present
  ){

    sourceIndex =

      constrain(

        Math.round(

          viewer.x

          *

          (
            DEVICE_COUNT -
            1
          )

        ),

        0,

        DEVICE_COUNT -
        1

      );

  }

  else{

    sourceIndex =
      2;

  }


  visited =

    new Set([
      sourceIndex
    ]);


  devices[
    sourceIndex
  ].info =
    1;


  devices[
    sourceIndex
  ].flash =
    1;


  buildPendingEdges();


  currentTransfer =
    null;


  scheduleNextTransfer(
    now,
    450
  );

}


/* =========================================================
   TRANSFER PATH
========================================================= */

function buildPendingEdges(){

  pendingEdges = [];


  /*
    往左。
  */

  for(
    let i = sourceIndex;
    i > 0;
    i--
  ){

    pendingEdges.push({

      from:i,

      to:i-1

    });

  }


  /*
    往右。
  */

  for(
    let i = sourceIndex;
    i <
    DEVICE_COUNT - 1;
    i++
  ){

    pendingEdges.push({

      from:i,

      to:i+1

    });

  }

}


/* =========================================================
   ELIGIBLE EDGE
========================================================= */

function chooseEligibleEdge(){

  const possible =

    pendingEdges.filter(

      edge =>

        visited.has(
          edge.from
        )

        &&

        !visited.has(
          edge.to
        )

    );


  if(
    possible.length === 0
  ){

    return null;

  }


  return possible[

    Math.floor(

      Math.random()

      *

      possible.length

    )

  ];

}


/* =========================================================
   SCHEDULE NEXT
========================================================= */

function scheduleNextTransfer(
  now,
  wait
){

  currentTransfer = {

    stage:"WAIT_NEXT",

    stageStart:now,

    waitDuration:wait

  };

}


/* =========================================================
   BEGIN NEXT EDGE
========================================================= */

function beginNextEdge(now){

  const edge =
    chooseEligibleEdge();


  if(
    !edge
  ){

    if(
      visited.size >=
      DEVICE_COUNT
    ){

      mode =
        "CHAOS";


      chaos =

        Math.max(
          chaos,
          .55
        );


      currentTransfer =
        null;

    }


    return;

  }


  currentTransfer = {

    from:edge.from,

    to:edge.to,

    stage:"APPROACH",

    stageStart:now,

    approachAngle:
      getMeetingAngle(
        edge.from,
        edge.to
      )

  };

}


/* =========================================================
   UPDATE TRANSFER
========================================================= */

function updateTransfer(now){

  if(
    mode !==
    "TRANSFER"
  ){

    return;

  }


  if(
    !currentTransfer
  ){

    beginNextEdge(
      now
    );

    return;

  }


  /*
    等待下一次傳遞。
  */

  if(
    currentTransfer.stage ===
    "WAIT_NEXT"
  ){

    if(
      now -
      currentTransfer.stageStart
      >=
      currentTransfer.waitDuration
    ){

      beginNextEdge(
        now
      );

    }


    return;

  }


  const fromDevice =

    devices[
      currentTransfer.from
    ];


  const toDevice =

    devices[
      currentTransfer.to
    ];


  const elapsed =

    now

    -

    currentTransfer.stageStart;


  const direction =

    currentTransfer.from

    <

    currentTransfer.to

    ?

    1

    :

    -1;


  /* =====================================
     APPROACH
  ===================================== */

  if(
    currentTransfer.stage ===
    "APPROACH"
  ){

    const angle =

      currentTransfer
      .approachAngle;


    fromDevice.targetAngle =

      angle

      *
      direction;


    toDevice.targetAngle =

      angle

      *
      -direction;


    fromDevice.angle =

      lerp(

        fromDevice.angle,

        fromDevice.targetAngle,

        .045

      );


    toDevice.angle =

      lerp(

        toDevice.angle,

        toDevice.targetAngle,

        .045

      );


    if(
      elapsed >=
      transferApproachTime
    ){

      currentTransfer.stage =
        "CONTACT";


      currentTransfer.stageStart =
        now;


      /*
        資訊真的被傳入。
      */

      toDevice.info =

        constrain(

          Math.max(

            toDevice.info,

            fromDevice.info *
            .82

            +
            .12

          ),

          0,
          1

        );


      fromDevice.flash =
        1;


      toDevice.flash =
        1;


      visited.add(

        currentTransfer.to

      );


      chaos =

        constrain(

          chaos +
          .11,

          0,
          1

        );

    }


    return;

  }


  /* =====================================
     CONTACT
  ===================================== */

  if(
    currentTransfer.stage ===
    "CONTACT"
  ){

    const angle =

      currentTransfer
      .approachAngle;


    fromDevice.angle =

      lerp(

        fromDevice.angle,

        angle *
        direction,

        .10

      );


    toDevice.angle =

      lerp(

        toDevice.angle,

        angle *
        -direction,

        .10

      );


    if(
      elapsed >
      450
    ){

      currentTransfer.stage =
        "SEPARATE";


      currentTransfer.stageStart =
        now;

    }


    return;

  }


  /* =====================================
     SEPARATE
  ===================================== */

  if(
    currentTransfer.stage ===
    "SEPARATE"
  ){

    const followAngle =

      viewer.present

      ?

      (
        viewer.x -
        .5
      )

      *
      2

      *
      followMaxAngle

      :

      0;


    fromDevice.angle =

      lerp(

        fromDevice.angle,

        followAngle,

        .035

      );


    toDevice.angle =

      lerp(

        toDevice.angle,

        followAngle,

        .035

      );


    if(
      elapsed >
      650
    ){

      pendingEdges =

        pendingEdges.filter(

          edge =>

            !(
              edge.from ===
              currentTransfer.from

              &&

              edge.to ===
              currentTransfer.to
            )

        );


      scheduleNextTransfer(

        now,

        random(
          250,
          800
        )

      );

    }

  }

}


/* =========================================================
   SMALL MEETING ANGLE
========================================================= */

function getMeetingAngle(
  aIndex,
  bIndex
){

  const distance =

    Math.abs(

      getDeviceX(
        aIndex
      )

      -

      getDeviceX(
        bIndex
      )

    );


  const bodyHeight =
    getBodyHeight();


  /*
    不真的要求棒頂碰在一起。

    視覺上只做「接近」，
    避免傾斜太大。
  */

  const ratio =

    constrain(

      distance

      /

      (
        bodyHeight *
        3
      ),

      .03,
      .28

    );


  const radians =

    Math.asin(
      ratio
    );


  return constrain(

    radians

    *
    180

    /
    Math.PI

    *
    .85,

    5,
    14

  );

}


/* =========================================================
   CHAOS LEVEL
========================================================= */

function updateChaos(dt){

  if(
    mode ===
    "TRANSFER"
  ){

    chaos =

      constrain(

        chaos

        +

        dt
        *
        .000006
        *
        chaosGrowthSpeed,

        0,
        .60

      );

  }


  if(
    mode ===
    "CHAOS"
  ){

    chaos =

      constrain(

        chaos

        +

        dt
        *
        .000018
        *
        chaosGrowthSpeed,

        0,
        1

      );

  }

}


/* =========================================================
   TABLE
========================================================= */

function drawTable(){

  const y =

    getBaseY()

    +
    18;


  ctx.fillStyle =
    "#e4dfd6";


  ctx.fillRect(

    W * .055,

    y,

    W * .89,

    H * .19

  );


  ctx.fillStyle =
    "rgba(0,0,0,.07)";


  ctx.fillRect(

    W * .055,

    y,

    W * .89,

    4

  );

}


/* =========================================================
   DRAW DEVICE
========================================================= */

function drawDevice(
  device,
  now
){

  const x =

    getDeviceX(
      device.index
    );


  const baseY =
    getBaseY();


  const bodyHeight =
    getBodyHeight();


  const bodyWidth =
    getBodyWidth();


  const angleRad =

    device.angle

    *
    Math.PI

    /
    180;


  ctx.save();


  ctx.translate(
    x,
    baseY
  );


  /* =====================================
     SHADOW
  ===================================== */

  ctx.fillStyle =
    "rgba(0,0,0,.09)";


  ctx.beginPath();


  ctx.ellipse(

    5,
    12,

    bodyWidth * .68,

    7,

    0,
    0,

    Math.PI * 2

  );


  ctx.fill();


  /* =====================================
     BASE
  ===================================== */

  ctx.fillStyle =
    "#171817";


  ctx.beginPath();


  ctx.roundRect(

    -bodyWidth * .63,

    -5,

    bodyWidth * 1.26,

    18,

    7

  );


  ctx.fill();


  /* =====================================
     PIVOT
  ===================================== */

  ctx.fillStyle =
    "#353936";


  ctx.beginPath();


  ctx.arc(

    0,
    0,

    8,

    0,
    Math.PI * 2

  );


  ctx.fill();


  ctx.fillStyle =
    "#101110";


  ctx.beginPath();


  ctx.arc(

    0,
    0,

    4,

    0,
    Math.PI * 2

  );


  ctx.fill();


  /* =====================================
     BODY ROTATION
  ===================================== */

  ctx.rotate(
    angleRad
  );


  const bodyGradient =

    ctx.createLinearGradient(

      -bodyWidth / 2,
      0,

      bodyWidth / 2,
      0

    );


  bodyGradient.addColorStop(
    0,
    "#050605"
  );


  bodyGradient.addColorStop(
    .45,
    "#2b2d2c"
  );


  bodyGradient.addColorStop(
    1,
    "#070807"
  );


  ctx.fillStyle =
    bodyGradient;


  ctx.shadowBlur =
    8;


  ctx.shadowColor =
    "rgba(0,0,0,.20)";


  ctx.beginPath();


  ctx.roundRect(

    -bodyWidth / 2,

    -bodyHeight,

    bodyWidth,

    bodyHeight,

    7

  );


  ctx.fill();


  ctx.shadowBlur =
    0;


  /* =====================================
     LED
  ===================================== */

  drawLED(

    device,

    now,

    bodyWidth,

    bodyHeight

  );


  /* =====================================
     CAMERA
  ===================================== */

  const cameraY =

    -bodyHeight *
    .73;


  ctx.fillStyle =
    "#050706";


  ctx.beginPath();


  ctx.arc(

    0,

    cameraY,

    9,

    0,

    Math.PI * 2

  );


  ctx.fill();


  ctx.strokeStyle =
    "#4a504d";


  ctx.lineWidth =
    1;


  ctx.beginPath();


  ctx.arc(

    0,

    cameraY,

    9,

    0,

    Math.PI * 2

  );


  ctx.stroke();


  ctx.fillStyle =
    "#020607";


  ctx.beginPath();


  ctx.arc(

    0,

    cameraY,

    5.5,

    0,

    Math.PI * 2

  );


  ctx.fill();


  ctx.fillStyle =
    "rgba(100,155,180,.48)";


  ctx.beginPath();


  ctx.arc(

    -1.5,

    cameraY -
    1.7,

    1.7,

    0,

    Math.PI * 2

  );


  ctx.fill();


  /* =====================================
     SCREEN
  ===================================== */

  const screenW =

    bodyWidth *
    .70;


  const screenH =

    bodyHeight *
    .31;


  const screenX =

    -screenW /
    2;


  const screenY =

    -bodyHeight *
    .56;


  ctx.fillStyle =
    "#020405";


  ctx.beginPath();


  ctx.roundRect(

    screenX,

    screenY,

    screenW,

    screenH,

    3

  );


  ctx.fill();


  ctx.strokeStyle =
    "#303635";


  ctx.lineWidth =
    1;


  ctx.stroke();


  /*
    只在螢幕範圍內畫。
  */

  ctx.save();


  ctx.beginPath();


  ctx.roundRect(

    screenX + 3,

    screenY + 3,

    screenW - 6,

    screenH - 6,

    2

  );


  ctx.clip();


  drawFluidScreen(

    device,

    now,

    screenX + 3,

    screenY + 3,

    screenW - 6,

    screenH - 6

  );


  ctx.restore();


  ctx.restore();

}


/* =========================================================
   LED
========================================================= */

function drawLED(
  device,
  now,
  width,
  height
){

  /*
    初始階段：
    五支呼吸接近同步。
  */

  let phase = 0;


  if(
    mode !==
    "FOLLOW"
  ){

    phase =

      device.phase

      *
      chaos;

  }


  const breath =

    (
      Math.sin(

        now * .002

        +

        phase

      )

      +
      1
    )

    /
    2;


  let brightness =

    .18

    +

    breath *
    .09;


  /*
    收到資訊之後更亮。
  */

  brightness +=

    device.info

    *
    .30;


  /*
    接觸瞬間脈衝。
  */

  brightness +=

    device.flash

    *
    .55;


  /*
    混亂後每支開始略微不同步。
  */

  if(
    mode !==
    "FOLLOW"
  ){

    brightness +=

      chaos

      *

      (
        Math.sin(

          now

          *
          (
            .0033

            +

            device.index *
            .00045
          )

          +

          device.phase

        )

        +
        1
      )

      *
      .07;

  }


  brightness =

    constrain(

      brightness,

      .08,
      1

    );


  /*
    LED 暗底。
  */

  ctx.fillStyle =
    "rgba(70,85,88,.18)";


  ctx.fillRect(

    -width / 2 + 3,

    -height + 9,

    width - 6,

    5

  );


  /*
    LED 主光。
  */

  ctx.shadowBlur =

    5

    +

    brightness *
    15;


  ctx.shadowColor =

    `rgba(
      100,
      235,
      255,
      ${brightness}
    )`;


  ctx.fillStyle =

    `rgba(
      155,
      245,
      255,
      ${brightness}
    )`;


  ctx.fillRect(

    -width / 2 + 3,

    -height + 9,

    width - 6,

    4

  );


  ctx.shadowBlur =
    0;

}


/* =========================================================
   FLUID SCREEN
   參考：深藍底＋青色流體＋像素粒子
========================================================= */

function drawFluidScreen(
  device,
  now,
  x,
  y,
  w,
  h
){

  /*
    --------------------------------
    BACKGROUND
    --------------------------------
  */

  const bg =

    ctx.createLinearGradient(

      x,
      y,

      x,
      y + h

    );


  bg.addColorStop(
    0,
    "#071653"
  );


  bg.addColorStop(
    .52,
    "#06144a"
  );


  bg.addColorStop(
    1,
    "#030d35"
  );


  ctx.fillStyle =
    bg;


  ctx.fillRect(
    x,
    y,
    w,
    h
  );


  /*
    資訊量。
  */

  const info =

    constrain(

      device.info,

      0,
      1

    );


  /*
    混亂量。

    順從時非常低。
  */

  const turbulence =

    mode === "FOLLOW"

    ?

    .03

    :

    chaos

    *
    (
      .18

      +

      info *
      .65
    );


  const flowTime =

    now

    *
    (
      .0010

      +

      info *
      .0012

      +

      chaos *
      .00055
    )

    +

    device.phase;


  /*
    參考圖：
    上方邊界偏右，
    下方邊界偏左。

    流體存在右側。
  */

  for(
    let yy = 0;
    yy < h;
    yy += 2
  ){

    const ny =

      yy /
      h;


    /*
      基本斜向曲線。
    */

    let frontRatio =

      .91

      -

      .76

      *
      Math.pow(
        ny,
        .72
      );


    /*
      收到的資訊越多，
      流體範圍往左擴張。
    */

    frontRatio -=

      info *
      .11;


    /*
      波動。
    */

    frontRatio +=

      Math.sin(

        ny * 5.2

        +

        flowTime * 1.25

      )

      *
      (
        .020

        +

        turbulence *
        .035
      );


    frontRatio +=

      Math.sin(

        ny * 14

        -

        flowTime * .65

        +

        device.phase

      )

      *
      turbulence

      *
      .018;


    frontRatio =

      constrain(

        frontRatio,

        .05,

        .96

      );


    /*
      階梯感 / 像素邊緣。
    */

    let frontX =

      x

      +

      frontRatio *
      w;


    frontX =

      Math.round(
        frontX / 2
      )

      *
      2;


    const liquidWidth =

      Math.max(

        0,

        x + w -
        frontX

      );


    /*
      主體青藍。
    */

    const liquidGradient =

      ctx.createLinearGradient(

        frontX,
        0,

        x + w,
        0

      );


    liquidGradient.addColorStop(

      0,

      `rgba(
        70,
        245,
        255,
        ${.78 + info*.12}
      )`

    );


    liquidGradient.addColorStop(

      .45,

      `rgba(
        35,
        220,
        255,
        ${.80 + info*.10}
      )`

    );


    liquidGradient.addColorStop(

      1,

      `rgba(
        20,
        175,
        250,
        ${.82}
      )`

    );


    ctx.fillStyle =
      liquidGradient;


    ctx.fillRect(

      frontX,

      y + yy,

      liquidWidth,

      2

    );


    /*
      邊界亮線。
    */

    ctx.fillStyle =

      `rgba(
        160,
        255,
        255,
        ${.45 + info*.35}
      )`;


    ctx.fillRect(

      frontX - 1,

      y + yy,

      2,

      2

    );


    /*
      流體中的微小亮線。
    */

    if(
      yy % 6 === 0
    ){

      ctx.fillStyle =

        `rgba(
          190,
          255,
          255,
          ${.06 + info*.09}
        )`;


      ctx.fillRect(

        frontX + 3,

        y + yy,

        Math.max(

          0,

          liquidWidth -
          7

        ),

        1

      );

    }

  }


  /*
    --------------------------------
    PARTICLES NEAR FRONT
    --------------------------------
  */

  const edgeParticleCount =

    Math.floor(

      22

      +

      info * 35

      +

      chaos * 20

    );


  for(
    let i = 0;
    i < edgeParticleCount;
    i++
  ){

    const seed =

      device
      .fluidSeeds[
        i %
        device.fluidSeeds.length
      ];


    const pyNorm =

      fract(

        i * .137

        +

        now *
        .00012 *
        seed.speed

        +

        seed.phase

      );


    const yy =

      pyNorm *
      h;


    const ny =

      yy /
      h;


    let frontRatio =

      .91

      -

      .76

      *
      Math.pow(
        ny,
        .72
      );


    frontRatio -=

      info *
      .11;


    frontRatio +=

      Math.sin(

        ny * 5.2

        +

        flowTime * 1.25

      )

      *
      (
        .02

        +

        turbulence *
        .035
      );


    frontRatio +=

      Math.sin(

        ny * 14

        -

        flowTime * .65

        +

        device.phase

      )

      *
      turbulence

      *
      .018;


    frontRatio =

      constrain(

        frontRatio,

        .05,
        .96

      );


    const edgeX =

      x

      +

      frontRatio *
      w;


    /*
      粒子主要存在於
      流體邊界右側。
    */

    const offset =

      Math.abs(
        seed.offset
      )

      *
      (
        3

        +

        info * 8

        +

        chaos * 5
      );


    const px =

      edgeX

      +

      offset;


    const py =

      y

      +

      yy;


    const alpha =

      .22

      +

      info *
      .35

      +

      chaos *
      .12;


    ctx.fillStyle =

      `rgba(
        110,
        250,
        255,
        ${alpha}
      )`;


    /*
      保留參考圖的像素感，
      多數是方形，不全是圓點。
    */

    if(
      i % 3 === 0
    ){

      ctx.fillRect(

        px,

        py,

        Math.max(
          1,
          seed.size
        ),

        Math.max(
          1,
          seed.size
        )

      );

    }

    else{

      ctx.beginPath();


      ctx.arc(

        px,
        py,

        seed.size *
        .65,

        0,
        Math.PI * 2

      );


      ctx.fill();

    }

  }


  /*
    --------------------------------
    FLOATING PARTICLES
    --------------------------------
  */

  const floatingCount =

    Math.floor(

      6

      +

      info * 14

      +

      chaos * 5

    );


  for(
    let i = 0;
    i < floatingCount;
    i++
  ){

    const seed =

      device
      .fluidSeeds[
        (
          i + 40
        )
        %
        device.fluidSeeds.length
      ];


    const t =

      fract(

        now *
        .00016 *
        seed.speed

        +

        seed.phase

      );


    const py =

      y

      +

      h

      -

      t *
      h;


    const ny =

      (
        py - y
      )

      /
      h;


    let frontRatio =

      .91

      -

      .76

      *
      Math.pow(
        ny,
        .72
      );


    frontRatio -=

      info *
      .11;


    frontRatio +=

      Math.sin(

        ny * 5.2

        +

        flowTime * 1.25

      )

      *
      .025;


    const px =

      x

      +

      frontRatio *
      w

      +

      4

      +

      Math.abs(
        seed.offset
      )

      *
      w *
      .17;


    ctx.fillStyle =

      `rgba(
        190,
        255,
        255,
        ${.12 + info*.25}
      )`;


    ctx.beginPath();


    ctx.arc(

      px,

      py,

      1

      +

      seed.size *
      .2,

      0,

      Math.PI * 2

    );


    ctx.fill();

  }


  /*
    --------------------------------
    CONTACT FLASH
    --------------------------------
  */

  if(
    device.flash >
    0
  ){

    ctx.fillStyle =

      `rgba(
        155,
        255,
        255,
        ${device.flash*.14}
      )`;


    ctx.fillRect(
      x,
      y,
      w,
      h
    );

  }

}


/* =========================================================
   TRANSFER CONTACT VISUAL
========================================================= */

function drawTransferContact(now){

  if(
    !currentTransfer

    ||

    currentTransfer.stage !==
    "CONTACT"
  ){

    return;

  }


  const a =

    currentTransfer.from;


  const b =

    currentTransfer.to;


  const pointA =
    getTopPoint(a);


  const pointB =
    getTopPoint(b);


  const midX =

    (
      pointA.x +
      pointB.x
    )

    /
    2;


  const midY =

    (
      pointA.y +
      pointB.y
    )

    /
    2;


  const pulse =

    (
      Math.sin(
        now * .025
      )

      +
      1
    )

    /
    2;


  /*
    接觸亮點。
  */

  ctx.shadowBlur =

    12

    +

    pulse * 8;


  ctx.shadowColor =

    "rgba(140,240,255,.8)";


  ctx.fillStyle =

    `rgba(
      185,
      250,
      255,
      ${.35 + pulse*.40}
    )`;


  ctx.beginPath();


  ctx.arc(

    midX,

    midY,

    3

    +

    pulse * 3,

    0,

    Math.PI * 2

  );


  ctx.fill();


  ctx.shadowBlur =
    0;


  /*
    資訊粒子橋。
  */

  for(
    let i = 0;
    i < 10;
    i++
  ){

    const t =

      fract(

        i / 10

        +

        now * .0012

      );


    const px =

      lerp(

        pointA.x,

        pointB.x,

        t

      );


    const py =

      lerp(

        pointA.y,

        pointB.y,

        t

      )

      +

      Math.sin(

        t *
        Math.PI *
        3

      )

      *
      3;


    ctx.fillStyle =

      "rgba(150,245,255,.58)";


    ctx.fillRect(

      px,
      py,

      2,
      2

    );

  }

}


/* =========================================================
   TOP POINT
========================================================= */

function getTopPoint(index){

  const device =
    devices[index];


  const angle =

    device.angle

    *
    Math.PI

    /
    180;


  const height =
    getBodyHeight();


  return{

    x:

      getDeviceX(index)

      +

      Math.sin(angle)

      *
      height,


    y:

      getBaseY()

      -

      Math.cos(angle)

      *
      height

  };

}

    viewer.present

      100

  document

    "chaosPercent"

  document

    "chaosMeter"
  )

  let modeText =

  if(

  if(

  ){

    modeText =
      "群體偏差";


    description =

      "裝置開始受自身與鄰居影響，不再完全服從觀者。";

  }


  document
  .getElementById(
    "modeText"
  )
  .textContent =
    modeText;


  document
  .getElementById(
    "phaseName"
  )
  .textContent =
    modeText;


  document
  .getElementById(
    "phaseDescription"
  )
  .textContent =
    description;

}

/* =========================================================
   HELPERS
========================================================= */

function random(
  min,
  max
){

  if(
    max ===
    undefined
  ){

    max =
      min;

    min =
      0;

  }


  return(

    Math.random()

    *

    (
      max -
      min
    )

    +

    min

  );

}


function lerp(
  a,
  b,
  t
){

  return(

    a

    +

    (
      b -
      a
    )

    *
    t

  );

}


function constrain(
  value,
  min,
  max
){

  return Math.max(

    min,

    Math.min(

      max,

      value

    )

  );

}


function mapValue(
  value,
  inMin,
  inMax,
  outMin,
  outMax
){

  return(

    (
      value -
      inMin
    )

    /

    (
      inMax -
      inMin
    )

    *

    (
      outMax -
      outMin
    )

    +

    outMin

  );

}


function fract(value){

  return(

    value

    -

    Math.floor(
      value
    )

  );

}


/* =========================================================
   MAIN LOOP
========================================================= */

let previousTime =
  performance.now();


let lastCameraAnalysis =
  0;


function animate(now){

  const dt =

    Math.min(

      50,

      now -
      previousTime

    );


  previousTime =
    now;


  /*
    CAMERA
  */

  if(
    now -
    lastCameraAnalysis >
    100
  ){

    analyzeCamera();


    lastCameraAnalysis =
      now;

  }


  /*
    MICROPHONE
  */

  updateAudio(
    dt,
    now
  );


  /*
    TRANSFER
  */

  updateTransfer(
    now
  );


  /*
    CHAOS
  */

  updateChaos(
    dt
  );


  /*
    DEVICE
  */

  devices.forEach(

    device =>

      device.update(
        now,
        dt
      )

  );


  /*
    DRAW
  */

  ctx.clearRect(

    0,
    0,
    W,
    H

  );


  drawTable();


  devices.forEach(

    device =>

      drawDevice(
        device,
        now
      )

  );


  drawTransferContact(
    now
  );


  updateUI();


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);
