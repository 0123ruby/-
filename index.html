<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>誤會機器｜順從 → 傳遞 → 混亂</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  overflow:hidden;
  background:#ece9e2;
  color:#303532;
  font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
}

#app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
}

#stageWrap{
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 42%,
      #faf9f5 0%,
      #eeebe4 58%,
      #ded9cf 100%
    );
}

#stage{
  display:block;
  width:100%;
  height:100%;
  cursor:pointer;
}

#title{
  position:absolute;
  left:28px;
  top:24px;
  pointer-events:none;
}

#title h1{
  margin:0;
  font-size:28px;
}

#title p{
  margin:7px 0 0;
  font-size:13px;
  color:#6c736f;
}

#phaseBox{
  position:absolute;
  left:28px;
  bottom:25px;

  padding:11px 15px;

  background:rgba(255,255,255,.90);
  border:1px solid rgba(0,0,0,.05);
  border-radius:10px;

  font-size:13px;
  line-height:1.65;

  pointer-events:none;
}

#phaseName{
  font-weight:700;
}

#panel{
  padding:20px;
  overflow-y:auto;

  background:#faf9f6;
  border-left:1px solid #ddd8ce;
}

.section{
  margin-bottom:22px;
}

.sectionTitle{
  margin-bottom:10px;
  font-size:13px;
  font-weight:700;
}

video{
  display:block;
  width:100%;
  min-height:145px;

  object-fit:cover;
  background:#111;

  border-radius:8px;

  transform:scaleX(-1);
}

button{
  width:100%;

  margin:0 0 8px;
  padding:11px;

  border:0;
  border-radius:9px;

  font-weight:700;
  cursor:pointer;
}

button.dark{
  background:#222;
  color:white;
}

button.light{
  background:#e5e1da;
  color:#333;
}

button.gray{
  background:#d2cec5;
  color:#333;
}

button.test{
  background:#4b514e;
  color:white;
}

.status{
  padding:11px;

  background:#fff;
  border:1px solid #dedad1;
  border-radius:8px;

  font-size:12px;
  line-height:1.8;
}

label{
  display:block;
  margin:12px 0 5px;
  font-size:12px;
}

input[type="range"]{
  width:100%;
}

.meter{
  height:8px;
  margin-top:7px;

  overflow:hidden;

  background:#e1ddd5;
  border-radius:999px;
}

#cameraMeter,
#voiceMeter,
#chaosMeter{
  width:0%;
  height:100%;

  background:#373d3a;

  transition:width .07s linear;
}

.small{
  margin-top:8px;
  color:#777;
  font-size:11px;
  line-height:1.6;
}
</style>
</head>

<body>

<div id="app">

  <div id="stageWrap">

    <canvas id="stage"></canvas>

    <div id="title">
      <h1>《誤會機器》</h1>
      <p>順從 → 說話 → 傳遞 → 群體混亂</p>
    </div>

    <div id="phaseBox">
      目前狀態：
      <span id="phaseName">順從</span><br>
      <span id="phaseDescription">
        裝置正在跟隨觀者的位置。
      </span>
    </div>

  </div>


  <aside id="panel">

    <!-- CAMERA -->
    <div class="section">

      <div class="sectionTitle">
        觀者位置
      </div>

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <br>

      <button
        id="cameraBtn"
        class="dark">
        開啟攝像頭
      </button>

      <div class="status">

        攝像頭：
        <b id="cameraState">未啟動</b>

        <br>

        觀者位置：
        <b id="viewerPosition">—</b>

        <br>

        動作量：
        <b>
          <span id="cameraPercent">0</span>%
        </b>

        <div class="meter">
          <div id="cameraMeter"></div>
        </div>

      </div>

    </div>


    <!-- MICROPHONE -->
    <div class="section">

      <div class="sectionTitle">
        聲音觸發
      </div>

      <button
        id="micBtn"
        class="dark">
        開啟麥克風
      </button>

      <button
        id="micStopBtn"
        class="light">
        停止麥克風
      </button>

      <button
        id="simulateVoiceBtn"
        class="test">
        模擬說話／開始傳遞
      </button>

      <div class="status">

        麥克風：
        <b id="micState">未啟動</b>

        <br>

        聲音強度：
        <b>
          <span id="voicePercent">0</span>%
        </b>

        <div class="meter">
          <div id="voiceMeter"></div>
        </div>

      </div>

      <div class="small">
        真正使用時，只有在「順從」階段說話才會啟動資訊傳遞。
        「模擬說話」可以不用麥克風直接測試後半段。
      </div>

    </div>


    <!-- CHAOS -->
    <div class="section">

      <div class="sectionTitle">
        群體狀態
      </div>

      <div class="status">

        階段：
        <b id="modeText">順從</b>

        <br>

        資訊起點：
        <b id="sourceText">—</b>

        <br>

        混亂程度：
        <b>
          <span id="chaosPercent">0</span>%
        </b>

        <div class="meter">
          <div id="chaosMeter"></div>
        </div>

        <br>

        已接收資訊：
        <b>
          <span id="infectedCount">0</span> / 5
        </b>

      </div>

    </div>


    <!-- SETTINGS -->
    <div class="section">

      <div class="sectionTitle">
        互動設定
      </div>

      <label>
        攝像頭敏感度：
        <span id="sensitivityValue">40</span>
      </label>

      <input
        id="sensitivitySlider"
        type="range"
        min="5"
        max="80"
        value="40"
      >


      <label>
        順從時最大偏角：
        <span id="followAngleValue">18</span>°
      </label>

      <input
        id="followAngleSlider"
        type="range"
        min="5"
        max="35"
        value="18"
      >


      <label>
        混亂時最大偏角：
        <span id="chaosAngleValue">75</span>°
      </label>

      <input
        id="chaosAngleSlider"
        type="range"
        min="30"
        max="90"
        value="75"
      >


      <label>
        說話觸發門檻：
        <span id="voiceThresholdValue">16</span>%
      </label>

      <input
        id="voiceThresholdSlider"
        type="range"
        min="5"
        max="50"
        value="16"
      >


      <label>
        兩支靠近時間：
        <span id="transferTimeValue">1100</span> ms
      </label>

      <input
        id="transferTimeSlider"
        type="range"
        min="500"
        max="2200"
        step="100"
        value="1100"
      >


      <label>
        混亂成長速度：
        <span id="chaosSpeedValue">45</span>%
      </label>

      <input
        id="chaosSpeedSlider"
        type="range"
        min="10"
        max="100"
        value="45"
      >

    </div>


    <button
      id="resetBtn"
      class="gray">
      回到順從狀態
    </button>

  </aside>

</div>


<canvas
  id="cameraAnalysis"
  width="160"
  height="120"
  style="display:none">
</canvas>


<script>

/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("stage");

const ctx =
  canvas.getContext("2d");

const video =
  document.getElementById("video");

const analysisCanvas =
  document.getElementById("cameraAnalysis");

const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {willReadFrequently:true}
  );


/* =========================================================
   SYSTEM
========================================================= */

const DEVICE_COUNT = 5;

let W = 0;
let H = 0;

const devices = [];

let mode = "FOLLOW";

/*
  FOLLOW
  TRANSFER
  CHAOS
*/

let chaos = 0;

let chaosStartedAt = 0;

let sourceIndex = -1;

let visited = new Set();

let pendingEdges = [];

let currentTransfer = null;


/* =========================================================
   SETTINGS
========================================================= */

let followMaxAngle = 18;

let chaosMaxAngle = 75;

let voiceThreshold = .16;

let transferApproachTime = 1100;

let chaosGrowthSpeed = .45;


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;

let cameraReady = false;

let previousCameraFrame = null;

const viewer = {
  present:false,
  x:.5,
  movement:0,
  absentTime:0,
  sensitivity:40
};


/* =========================================================
   MICROPHONE
========================================================= */

let micStream = null;

let audioContext = null;

let analyser = null;

let micSource = null;

let micBuffer = null;

let micReady = false;

let voiceLevel = 0;

let voiceHold = 0;


/* =========================================================
   DEVICE
========================================================= */

class Device{

  constructor(index){

    this.index = index;

    this.angle = 0;

    this.targetAngle = 0;

    this.info = 0;

    this.flash = 0;

    this.phase =
      Math.random() *
      Math.PI *
      2;

    this.followWeight =
      random(.96,1.04);

    this.chaosTarget = 0;

    this.nextChaosShift = 0;

    this.particleSeeds = [];

    for(
      let i = 0;
      i < 52;
      i++
    ){

      this.particleSeeds.push({

        u:Math.random(),

        phase:
          Math.random() *
          Math.PI *
          2,

        size:
          random(.6,1.8),

        speed:
          random(.7,1.4),

        offset:
          random(-1,1)

      });

    }

  }


  update(now,dt){

    this.flash =

      Math.max(
        0,
        this.flash -
        dt / 500
      );


    /*
      --------------------------------
      順從
      --------------------------------
    */

    if(
      mode === "FOLLOW"
    ){

      const target =

        viewer.present
        ?
        (
          viewer.x -
          .5
        )
        *
        2
        *
        followMaxAngle
        :
        0;


      this.targetAngle =

        target *
        this.followWeight;


      this.angle =

        lerp(

          this.angle,

          this.targetAngle,

          .065

        );


      this.info =

        lerp(
          this.info,
          0,
          .04
        );


      return;

    }


    /*
      --------------------------------
      傳遞
      --------------------------------
    */

    if(
      mode === "TRANSFER"
    ){

      /*
        正在互相靠近的兩支，
        角度由 transfer 系統接管。
      */

      if(
        currentTransfer
        &&
        (
          this.index ===
          currentTransfer.from
          ||
          this.index ===
          currentTransfer.to
        )
      ){

        return;

      }


      /*
        其他支仍然保留一些
        對觀者的順從，

        但開始出現偏差。
      */

      if(
        now >
        this.nextChaosShift
      ){

        this.nextChaosShift =

          now +
          random(
            700,
            1800
          );


        this.chaosTarget =

          random(
            -chaosMaxAngle,
            chaosMaxAngle
          );

      }


      const followAngle =

        viewer.present
        ?
        (
          viewer.x -
          .5
        )
        *
        2
        *
        followMaxAngle
        :
        0;


      const obedience =

        1 -
        chaos *
        .75;


      this.targetAngle =

        followAngle *
        obedience

        +

        this.chaosTarget *
        chaos *
        .42;


      this.targetAngle =

        constrain(

          this.targetAngle,

          -chaosMaxAngle,
          chaosMaxAngle

        );


      this.angle =

        lerp(

          this.angle,

          this.targetAngle,

          .04 +
          chaos * .025

        );


      return;

    }


    /*
      --------------------------------
      混亂
      --------------------------------
    */

    if(
      mode === "CHAOS"
    ){

      if(
        now >
        this.nextChaosShift
      ){

        this.nextChaosShift =

          now +
          random(
            500,
            1700
          );


        this.chaosTarget =

          random(
            -chaosMaxAngle,
            chaosMaxAngle
          );

      }


      let neighborAverage = 0;

      let neighborCount = 0;


      if(
        this.index > 0
      ){

        neighborAverage +=
          devices[
            this.index - 1
          ].angle;

        neighborCount++;

      }


      if(
        this.index <
        DEVICE_COUNT - 1
      ){

        neighborAverage +=
          devices[
            this.index + 1
          ].angle;

        neighborCount++;

      }


      if(
        neighborCount > 0
      ){

        neighborAverage /=
          neighborCount;

      }


      const followAngle =

        viewer.present
        ?
        (
          viewer.x -
          .5
        )
        *
        2
        *
        followMaxAngle
        :
        0;


      const obedience =

        Math.max(
          .06,
          1 - chaos
        );


      /*
        混亂並非純亂數。

        還包含：
        - 一點觀者影響
        - 鄰居影響
        - 個體自己的偏差
      */

      this.targetAngle =

        followAngle *
        obedience

        +

        this.chaosTarget *
        chaos *
        .83

        +

        neighborAverage *
        chaos *
        .15;


      this.targetAngle =

        constrain(

          this.targetAngle,

          -chaosMaxAngle,
          chaosMaxAngle

        );


      this.angle =

        lerp(

          this.angle,

          this.targetAngle,

          .025 +
          chaos * .035

        );

    }

  }

}


/* =========================================================
   INIT
========================================================= */

function resetSystem(){

  mode = "FOLLOW";

  chaos = 0;

  chaosStartedAt = 0;

  sourceIndex = -1;

  visited =
    new Set();

  pendingEdges = [];

  currentTransfer = null;

  voiceHold = 0;


  devices.length = 0;


  for(
    let i = 0;
    i < DEVICE_COUNT;
    i++
  ){

    devices.push(
      new Device(i)
    );

  }

}


resetSystem();


/* =========================================================
   SIZE
========================================================= */

function resizeCanvas(){

  const rect =

    canvas
    .parentElement
    .getBoundingClientRect();


  W =
    rect.width;

  H =
    rect.height;


  canvas.width =

    Math.round(
      W *
      devicePixelRatio
    );


  canvas.height =

    Math.round(
      H *
      devicePixelRatio
    );


  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";


  ctx.setTransform(

    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0

  );

}


resizeCanvas();


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   DEVICE LAYOUT
========================================================= */

function getBaseY(){

  return H * .73;

}


function getBodyHeight(){

  return Math.min(
    245,
    H * .34
  );

}


function getBodyWidth(){

  return Math.min(
    65,
    W * .055
  );

}


function getDeviceX(index){

  return mapValue(

    index,

    0,
    DEVICE_COUNT - 1,

    W * .16,
    W * .84

  );

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

  try{

    cameraStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        video:{
          width:{ideal:640},
          height:{ideal:480},
          facingMode:"user"
        },

        audio:false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    cameraReady = true;

    previousCameraFrame = null;


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "已啟動";


    document
    .getElementById(
      "cameraBtn"
    )
    .textContent =
      "攝像頭已開啟";

  }
  catch(error){

    cameraReady = false;

    console.error(error);


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "啟動失敗";

  }

}


document
.getElementById(
  "cameraBtn"
)
.addEventListener(
  "click",
  startCamera
);


/* =========================================================
   CAMERA ANALYSIS
========================================================= */

function analyzeCamera(){

  if(
    !cameraReady
    ||
    video.readyState < 2
  ){

    return;

  }


  analysisCtx.drawImage(

    video,

    0,
    0,

    analysisCanvas.width,
    analysisCanvas.height

  );


  const frame =

    analysisCtx
    .getImageData(

      0,
      0,

      analysisCanvas.width,
      analysisCanvas.height

    )
    .data;


  if(
    !previousCameraFrame
  ){

    previousCameraFrame =

      new Uint8ClampedArray(
        frame
      );

    return;

  }


  const width =
    analysisCanvas.width;

  const height =
    analysisCanvas.height;


  const threshold =

    mapValue(

      viewer.sensitivity,

      5,
      80,

      88,
      18

    );


  let changed = 0;

  let checked = 0;

  let xTotal = 0;


  for(
    let y = 0;
    y < height;
    y += 4
  ){

    for(
      let x = 0;
      x < width;
      x += 4
    ){

      const i =

        (
          y * width +
          x
        )
        *
        4;


      const diff =

        Math.abs(
          frame[i] -
          previousCameraFrame[i]
        )

        +

        Math.abs(
          frame[i+1] -
          previousCameraFrame[i+1]
        )

        +

        Math.abs(
          frame[i+2] -
          previousCameraFrame[i+2]
        );


      checked++;


      if(
        diff >
        threshold
      ){

        changed++;

        xTotal += x;

      }

    }

  }


  previousCameraFrame =

    new Uint8ClampedArray(
      frame
    );


  const ratio =

    changed

    /
    Math.max(
      1,
      checked
    );


  viewer.movement =

    lerp(

      viewer.movement,

      constrain(
        ratio * 3,
        0,
        1
      ),

      .3

    );


  if(
    changed > 0
  ){

    let averageX =

      xTotal /
      changed;


    /*
      Video 為鏡像顯示，
      所以反轉一次。
    */

    averageX =

      width -
      averageX;


    viewer.x =

      lerp(

        viewer.x,

        constrain(
          averageX /
          width,
          0,
          1
        ),

        .32

      );

  }


  if(
    ratio >
    .005
  ){

    viewer.present = true;

    viewer.absentTime = 0;

  }
  else{

    viewer.absentTime +=
      100;


    if(
      viewer.absentTime >
      6000
    ){

      viewer.present = false;

    }

  }

}


/* =========================================================
   MICROPHONE
========================================================= */

async function startMicrophone(){

  try{

    if(micReady){
      return;
    }


    micStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:false,
          autoGainControl:false
        },

        video:false

      });


    const AudioCtx =

      window.AudioContext
      ||
      window.webkitAudioContext;


    audioContext =
      new AudioCtx();


    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();

    }


    analyser =
      audioContext
      .createAnalyser();


    analyser.fftSize =
      1024;


    analyser.smoothingTimeConstant =
      .25;


    micBuffer =

      new Uint8Array(
        analyser.fftSize
      );


    micSource =

      audioContext
      .createMediaStreamSource(
        micStream
      );


    micSource.connect(
      analyser
    );


    micReady = true;


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "已啟動";


    document
    .getElementById(
      "micBtn"
    )
    .textContent =
      "麥克風已開啟";

  }
  catch(error){

    micReady = false;

    console.error(error);


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "啟動失敗";

  }

}


/* =========================================================
   STOP MIC
========================================================= */

async function stopMicrophone(){

  if(micStream){

    micStream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );

  }


  micStream = null;


  if(micSource){

    try{
      micSource.disconnect();
    }
    catch(e){}

  }


  if(audioContext){

    try{
      await audioContext.close();
    }
    catch(e){}

  }


  micSource = null;

  audioContext = null;

  analyser = null;

  micBuffer = null;

  micReady = false;

  voiceLevel = 0;

  voiceHold = 0;


  document
  .getElementById(
    "micState"
  )
  .textContent =
    "未啟動";


  document
  .getElementById(
    "micBtn"
  )
  .textContent =
    "開啟麥克風";

}


document
.getElementById(
  "micBtn"
)
.addEventListener(
  "click",
  startMicrophone
);


document
.getElementById(
  "micStopBtn"
)
.addEventListener(
  "click",
  stopMicrophone
);


/* =========================================================
   READ AUDIO LEVEL
========================================================= */

function updateAudio(dt,now){

  if(
    !micReady
    ||
    !analyser
    ||
    !micBuffer
  ){

    voiceLevel =

      lerp(
        voiceLevel,
        0,
        .06
      );

    voiceHold = 0;

    return;

  }


  analyser
  .getByteTimeDomainData(
    micBuffer
  );


  let sum = 0;


  for(
    let i = 0;
    i < micBuffer.length;
    i += 4
  ){

    const value =

      (
        micBuffer[i] -
        128
      )
      /
      128;


    sum +=

      value *
      value;

  }


  const count =

    Math.ceil(
      micBuffer.length /
      4
    );


  const rms =

    Math.sqrt(
      sum /
      count
    );


  const level =

    constrain(

      (
        rms -
        .006
      )

      *
      15,

      0,
      1

    );


  voiceLevel =

    lerp(
      voiceLevel,
      level,
      .32
    );


  /*
    只有順從狀態才可以
    由說話啟動資訊傳遞。
  */

  if(
    mode === "FOLLOW"
  ){

    if(
      voiceLevel >
      voiceThreshold
    ){

      voiceHold += dt;

    }
    else{

      voiceHold =

        Math.max(
          0,
          voiceHold -
          dt * 1.8
        );

    }


    if(
      voiceHold >
      260
    ){

      startInformationTransmission(
        now
      );

      voiceHold = 0;

    }

  }

}

/* =========================================================
   START INFORMATION
========================================================= */

function startInformationTransmission(now){

  mode = "TRANSFER";

  chaos = .08;

  /*
    說話時離觀者最近的
    那一支是資訊起點。
  */

  if(
    viewer.present
  ){

    sourceIndex =

      constrain(

        Math.round(

          viewer.x

          *
          (
            DEVICE_COUNT - 1
          )

        ),

        0,
        DEVICE_COUNT - 1

      );

  }
  else{

    sourceIndex = 2;

  }


  visited =

    new Set([
      sourceIndex
    ]);


  devices[
    sourceIndex
  ].info = 1;


  devices[
    sourceIndex
  ].flash = 1;


  buildPendingEdges();


  startNextTransfer(
    now + 350
  );

}


/* =========================================================
   BUILD TRANSFER PATHS
========================================================= */

function buildPendingEdges(){

  pendingEdges = [];


  /*
    往左傳。
  */

  for(
    let i = sourceIndex;
    i > 0;
    i--
  ){

    pendingEdges.push({

      from:i,

      to:i-1

    });

  }


  /*
    往右傳。
  */

  for(
    let i = sourceIndex;
    i <
    DEVICE_COUNT - 1;
    i++
  ){

    pendingEdges.push({

      from:i,

      to:i+1

    });

  }

}


/* =========================================================
   NEXT EDGE
========================================================= */

function chooseEligibleEdge(){

  const candidates =

    pendingEdges.filter(
      edge =>
        visited.has(
          edge.from
        )
        &&
        !visited.has(
          edge.to
        )
    );


  if(
    candidates.length === 0
  ){

    return null;

  }


  return candidates[
    Math.floor(
      Math.random() *
      candidates.length
    )
  ];

}


/* =========================================================
   START TRANSFER
========================================================= */

function startNextTransfer(now){

  const edge =
    chooseEligibleEdge();


  if(!edge){

    if(
      visited.size >=
      DEVICE_COUNT
    ){

      mode = "CHAOS";

      chaos =

        Math.max(
          chaos,
          .68
        );


      chaosStartedAt =
        now;

    }

    return;

  }


  currentTransfer = {

    from:edge.from,

    to:edge.to,

    stage:"WAIT",

    stageStart:now,

    approachAngle:0

  };

}


/* =========================================================
   UPDATE TRANSFER
========================================================= */

function updateTransfer(now){

  if(
    mode !== "TRANSFER"
    ||
    !currentTransfer
  ){

    return;

  }


  const from =

    devices[
      currentTransfer.from
    ];


  const to =

    devices[
      currentTransfer.to
    ];


  const elapsed =

    now -
    currentTransfer.stageStart;


  /*
    ----------------------------
    WAIT
    ----------------------------
  */

  if(
    currentTransfer.stage ===
    "WAIT"
  ){

    if(
      elapsed >
      350
    ){

      currentTransfer.stage =
        "APPROACH";

      currentTransfer.stageStart =
        now;

    }

    return;

  }


  /*
    ----------------------------
    APPROACH
    ----------------------------
  */

  if(
    currentTransfer.stage ===
    "APPROACH"
  ){

    const angle =

      getMeetingAngle(

        currentTransfer.from,

        currentTransfer.to

      );


    currentTransfer.approachAngle =
      angle;


    const direction =

      currentTransfer.from <
      currentTransfer.to

      ?
      1

      :
      -1;


    from.targetAngle =

      angle *
      direction;


    to.targetAngle =

      angle *
      -direction;


    from.angle =

      lerp(
        from.angle,
        from.targetAngle,
        .07
      );


    to.angle =

      lerp(
        to.angle,
        to.targetAngle,
        .07
      );


    if(
      elapsed >
      transferApproachTime
    ){

      currentTransfer.stage =
        "CONTACT";

      currentTransfer.stageStart =
        now;


      /*
        資訊真正被傳過去。
      */

      to.info =

        Math.max(

          to.info,

          from.info *
          .82

          +
          .16

        );


      from.flash = 1;

      to.flash = 1;


      visited.add(
        currentTransfer.to
      );


      chaos =

        constrain(

          chaos +
          .14,

          0,
          1

        );

    }

    return;

  }


  /*
    ----------------------------
    CONTACT
    ----------------------------
  */

  if(
    currentTransfer.stage ===
    "CONTACT"
  ){

    const angle =

      currentTransfer
      .approachAngle;


    const direction =

      currentTransfer.from <
      currentTransfer.to

      ?
      1

      :
      -1;


    from.angle =

      lerp(
        from.angle,
        angle * direction,
        .18
      );


    to.angle =

      lerp(
        to.angle,
        angle * -direction,
        .18
      );


    if(
      elapsed >
      420
    ){

      currentTransfer.stage =
        "SEPARATE";

      currentTransfer.stageStart =
        now;

    }

    return;

  }


  /*
    ----------------------------
    SEPARATE
    ----------------------------
  */

  if(
    currentTransfer.stage ===
    "SEPARATE"
  ){

    const followAngle =

      viewer.present

      ?

      (
        viewer.x -
        .5
      )

      *
      2
      *
      followMaxAngle

      :

      0;


    from.targetAngle =
      followAngle;


    to.targetAngle =
      followAngle;


    from.angle =

      lerp(
        from.angle,
        followAngle,
        .05
      );


    to.angle =

      lerp(
        to.angle,
        followAngle,
        .05
      );


    if(
      elapsed >
      650
    ){

      /*
        把已完成的 edge 移除。
      */

      pendingEdges =

        pendingEdges.filter(

          edge =>
            !(
              edge.from ===
              currentTransfer.from

              &&

              edge.to ===
              currentTransfer.to
            )

        );


      currentTransfer = null;


      /*
        下一段傳遞。
      */

      startNextTransfer(
        now +
        random(
          120,
          600
        )
      );

    }

  }

}


/* =========================================================
   MEETING ANGLE
========================================================= */

function getMeetingAngle(
  aIndex,
  bIndex
){

  const bodyHeight =
    getBodyHeight();


  const distance =

    Math.abs(

      getDeviceX(
        aIndex
      )

      -

      getDeviceX(
        bIndex
      )

    );


  /*
    讓兩支上半部靠近。

    asin(
      水平距離 / 2
      ÷
      棒長
    )
  */

  const ratio =

    constrain(

      distance

      /
      (
        bodyHeight *
        2
      ),

      .05,
      .88

    );


  const radians =

    Math.asin(
      ratio
    );


  return constrain(

    radians

    *
    180

    /
    Math.PI

    *
    1.08,

    12,
    38

  );

}


/* =========================================================
   CHAOS
========================================================= */

function updateChaos(dt){

  if(
    mode === "TRANSFER"
  ){

    chaos =

      constrain(

        chaos

        +
        dt *
        .000008 *
        chaosGrowthSpeed,

        0,
        .72

      );

  }


  if(
    mode === "CHAOS"
  ){

    chaos =

      constrain(

        chaos

        +
        dt *
        .000025 *
        chaosGrowthSpeed,

        0,
        1

      );

  }

}


/* =========================================================
   DRAW TABLE
========================================================= */

function drawTable(){

    getBaseY() +
    18;

  ctx.fillRect(

    W * .055,

    y,

    W * .89,

    H * .19

  );

  );

}


/* =========================================================
   DRAW DEVICE
========================================================= */

function drawDevice(
  device,
  now
){

  const x =
    getDeviceX(
      device.index
    );


  const baseY =
    getBaseY();


  const bodyHeight =
    getBodyHeight();


  const bodyWidth =
    getBodyWidth();


  const angleRad =

    device.angle

    *
    Math.PI

    /
    180;


  /*
    ---------------------------------
    BASE
    ---------------------------------
  */

  ctx.save();


  ctx.translate(
    x,
    baseY
  );


  ctx.fillStyle =
    "rgba(0,0,0,.11)";


  ctx.beginPath();

  ctx.ellipse(

    5,
    12,

    bodyWidth *
    .68,

    7,

    0,
    0,
    Math.PI * 2

  );

  ctx.fill();


  ctx.fillStyle =
    "#171817";


  ctx.beginPath();

  ctx.roundRect(

    -bodyWidth*.62,

    -5,

    bodyWidth*1.24,

    18,

    7

  );

  ctx.fill();


  /*
    pivot
  */

  ctx.fillStyle =
    "#333735";


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#111";


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    ---------------------------------
    ROTATING BODY
    ---------------------------------
  */

  ctx.rotate(
    angleRad
  );


  const gradient =

    ctx.createLinearGradient(

      -bodyWidth/2,
      0,

      bodyWidth/2,
      0

    );


  gradient.addColorStop(
    0,
    "#060706"
  );

  gradient.addColorStop(
    .45,
    "#292b2a"
  );

  gradient.addColorStop(
    1,
    "#080908"
  );


  ctx.fillStyle =
    gradient;


  ctx.shadowBlur =
    9;


  ctx.shadowColor =
    "rgba(0,0,0,.22)";


  ctx.beginPath();

  ctx.roundRect(

    -bodyWidth/2,

    -bodyHeight,

    bodyWidth,

    bodyHeight,

    8

  );

  ctx.fill();


  ctx.shadowBlur = 0;


  /*
    ---------------------------------
    LED
    ---------------------------------
  */

  drawLED(
    device,
    now,
    bodyWidth,
    bodyHeight
  );


  /*
    ---------------------------------
    CAMERA
    ---------------------------------
  */

  const cameraY =
    -bodyHeight * .72;


  ctx.fillStyle =
    "#060807";


  ctx.beginPath();

  ctx.arc(
    0,
    cameraY,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle =
    "#474c49";

  ctx.lineWidth = 1;


  ctx.beginPath();

  ctx.arc(
    0,
    cameraY,
    9,
    0,
    Math.PI*2
  );

  ctx.stroke();


  ctx.fillStyle =
    "#030708";


  ctx.beginPath();

  ctx.arc(
    0,
    cameraY,
    5.5,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "rgba(120,165,185,.46)";


  ctx.beginPath();

  ctx.arc(
    -1.5,
    cameraY-1.7,
    1.7,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    ---------------------------------
    SCREEN
    ---------------------------------
  */

  const screenW =
    bodyWidth * .68;


  const screenH =
    bodyHeight * .28;


  const screenX =
    -screenW / 2;


  const screenY =
    -bodyHeight * .55;


  ctx.fillStyle =
    "#020404";


  ctx.beginPath();

  ctx.roundRect(

    screenX,
    screenY,

    screenW,
    screenH,

    3

  );

  ctx.fill();


  ctx.strokeStyle =
    "#303533";

  ctx.lineWidth = 1;


  ctx.stroke();


  ctx.save();


  ctx.beginPath();

  ctx.roundRect(

    screenX + 3,

    screenY + 3,

    screenW - 6,

    screenH - 6,

    2

  );

  ctx.clip();


  drawParticleScreen(

    device,

    now,

    screenX + 3,

    screenY + 3,

    screenW - 6,

    screenH - 6

  );


  ctx.restore();


  ctx.restore();

}


/* =========================================================
   LED
========================================================= */

function drawLED(
  device,
  now,
  width,
  height
){

  const breath =

    (
      Math.sin(
        now * .002 +
        device.phase
      )
      +
      1
    )
    /
    2;


  let brightness =

    .16 +
    breath * .08;


  /*
    順從：
    LED 節奏幾乎一致。
  */

  if(
    mode === "FOLLOW"
  ){

    brightness =

      .25

      +

      (
        Math.sin(
          now * .002
        )
        +
        1
      )
      *
      .07;

  }


  /*
    資訊量。
  */

  brightness +=

    device.info *
    .35;


  /*
    接觸瞬間閃亮。
  */

  brightness +=

    device.flash *
    .55;


  /*
    混亂時每支開始不同步。
  */

  if(
    mode !== "FOLLOW"
  ){

    brightness +=

      chaos

      *
      (
        Math.sin(
          now *
          (
            .004 +
            device.index *
            .0007
          )
          +
          device.phase
        )
        +
        1
      )
      *
      .12;

  }


  brightness =

    constrain(
      brightness,
      .08,
      1
    );


  ctx.shadowBlur =

    5 +
    brightness * 15;


  ctx.shadowColor =

    `rgba(
      190,
      225,
      240,
      ${brightness}
    )`;


  ctx.fillStyle =

    `rgba(
      210,
      238,
      248,
      ${brightness}
    )`;


  ctx.fillRect(

    -width/2 + 3,

    -height + 10,

    width - 6,

    4

  );


  ctx.shadowBlur = 0;

}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticleScreen(
  device,
  now,
  x,
  y,
  w,
  h
){

  ctx.fillStyle =
    "#020505";


  ctx.fillRect(
    x,
    y,
    w,
    h
  );


  const information =

    constrain(
      device.info,
      0,
      1
    );


  const turbulence =

    mode === "FOLLOW"

    ?

    .03

    :

    chaos *
    (
      .25 +
      information * .85
    );


  const speed =

    .00007

    *
    (
      1 +
      information * 3
    );


  const visibleParticles =

    Math.floor(

      25

      +
      information *
      27

    );


  for(
    let i = 0;
    i < visibleParticles;
    i++
  ){

    const seed =

      device
      .particleSeeds[i];


    let t =

      (
        seed.u

        +

        now *
        speed *
        seed.speed
      )

      %
      1;


    /*
      規律時向上流動。
    */

    let px =

      .5

      +

      Math.sin(

        t *
        Math.PI *
        2

        +

        seed.phase

      )

      *
      (
        .12 +
        information * .08
      );


    let py =

      1 -
      t;


    /*
      資訊越多，
      粒子開始旋轉、分裂。
    */

    px +=

      Math.sin(

        now * .0025

        +

        seed.phase * 2

        +

        py * 8

      )

      *
      turbulence *
      .24;


    py +=

      Math.cos(

        now * .002

        +

        seed.phase

        +

        px * 9

      )

      *
      turbulence *
      .18;


    /*
      混亂最後再加入個體偏差。
    */

    px +=

      seed.offset

      *
      turbulence *
      .08;


    const drawX =

      x +
      px * w;


    const drawY =

      y +
      py * h;


    const alpha =

      constrain(

        .28

        +
        information * .55

        +
        device.flash * .2,

        .15,
        1

      );


    ctx.fillStyle =

      `rgba(
        205,
        235,
        246,
        ${alpha}
      )`;


    ctx.shadowBlur =

      information >
      .2

      ?

      4

      :

      1;


    ctx.shadowColor =
      "rgba(160,215,235,.55)";


    ctx.beginPath();

    ctx.arc(

      drawX,
      drawY,

      seed.size,

      0,
      Math.PI*2

    );

    ctx.fill();

  }


  ctx.shadowBlur = 0;

}


/* =========================================================
   CONTACT / TRANSFER VISUAL
========================================================= */

function drawTransferContact(now){

  if(
    !currentTransfer
    ||
    currentTransfer.stage !==
    "CONTACT"
  ){

    return;

  }


  const a =
    currentTransfer.from;

  const b =
    currentTransfer.to;


  const pointA =
    getTopPoint(a);


  const pointB =
    getTopPoint(b);


  const midX =

    (
      pointA.x +
      pointB.x
    )
    /
    2;


  const midY =

    (
      pointA.y +
      pointB.y
    )
    /
    2;


  const pulse =

    (
      Math.sin(
        now * .03
      )
      +
      1
    )
    /
    2;


  ctx.shadowBlur =
    18;


  ctx.shadowColor =
    "rgba(200,235,245,.8)";


  ctx.fillStyle =

    `rgba(
      220,
      245,
      250,
      ${.35 + pulse*.45}
    )`;


  ctx.beginPath();

  ctx.arc(

    midX,
    midY,

    5 +
    pulse * 4,

    0,
    Math.PI*2

  );

  ctx.fill();


  ctx.shadowBlur = 0;


  /*
    很淡的資訊粒子橋。
    只是模擬資訊交換。
  */

  for(
    let i = 0;
    i < 12;
    i++
  ){

    const t =

      (
        i / 12

        +
        now * .0015
      )
      %
      1;


    const px =

      lerp(
        pointA.x,
        pointB.x,
        t
      );


    const py =

      lerp(
        pointA.y,
        pointB.y,
        t
      )

      +

      Math.sin(
        t *
        Math.PI *
        3
      )
      *
      4;


    ctx.fillStyle =
      "rgba(200,235,245,.65)";


    ctx.beginPath();

    ctx.arc(
      px,
      py,
      1.5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   TOP POINT
========================================================= */

function getTopPoint(index){

  const device =
    devices[index];


  const angle =

    device.angle

    *
    Math.PI

    /
    180;


  const h =
    getBodyHeight();


  return{

    x:

      getDeviceX(index)

      +

      Math.sin(angle)
      *
      h,

    y:

      getBaseY()

      -

      Math.cos(angle)
      *
      h

  };

}

      "資訊傳遞";

    description =
      "裝置開始彼此靠近，接觸後交換資訊。";

  }
  else{

    modeText =
      "群體混亂";

    description =
      "裝置逐漸脫離觀者控制，形成自己的群體行為。";

  }


  document
  .getElementById(
    "modeText"
  )
  .textContent =
    modeText;


  document
  .getElementById(
    "phaseName"
  )
  .textContent =
    modeText;


  document
  .getElementById(
    "phaseDescription"
  )
  .textContent =
    description;

}

/* =========================================================
   HELPERS
========================================================= */

function random(
  min,
  max
){

  if(
    max === undefined
  ){

    max = min;
    min = 0;

  }


  return(

    Math.random()

    *
    (
      max - min
    )

    +
    min

  );

}


function lerp(
  a,
  b,
  t
){

  return(

    a

    +
    (
      b - a
    )

    *
    t

  );

}


function constrain(
  value,
  min,
  max
){

  return Math.max(

    min,

    Math.min(
      max,
      value
    )

  );

}


function mapValue(
  value,
  inMin,
  inMax,
  outMin,
  outMax
){

  return(

    (
      value -
      inMin
    )

    /
    (
      inMax -
      inMin
    )

    *
    (
      outMax -
      outMin
    )

    +
    outMin

  );

}


/* =========================================================
   LOOP
========================================================= */

let previousTime =
  performance.now();

let lastCameraAnalysis = 0;


function animate(now){

  const dt =

    Math.min(

      50,

      now -
      previousTime

    );


  previousTime =
    now;


  /*
    Camera
  */

  if(
    now -
    lastCameraAnalysis >
    100
  ){

    analyzeCamera();

    lastCameraAnalysis =
      now;

  }


  /*
    Microphone
  */

  updateAudio(
    dt,
    now
  );


  /*
    Transmission
  */

  updateTransfer(
    now
  );


  /*
    Chaos
  */

  updateChaos(
    dt
  );


  /*
    Devices
  */

  devices.forEach(
    device =>
      device.update(
        now,
        dt
      )
  );


  /*
    Draw
  */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawTable();


  devices.forEach(
    device =>
      drawDevice(
        device,
        now
      )
  );


  drawTransferContact(
    now
  );


  updateUI();


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);
