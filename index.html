<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>誤會機器｜順從 → 傳遞 → 群體偏差</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  overflow:hidden;
  background:#ece9e2;
  color:#303532;
  font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
}

#app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
}

#stageWrap{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 42%,
      #faf9f5 0%,
      #eeebe4 58%,
      #ded9cf 100%
    );
}

#stage{
  display:block;
  width:100%;
  height:100%;
}

#title{
  position:absolute;
  left:28px;
  top:24px;
  pointer-events:none;
}

#title h1{
  margin:0;
  font-size:28px;
}

#title p{
  margin:7px 0 0;
  font-size:13px;
  color:#6c736f;
}

#phaseBox{
  position:absolute;
  left:28px;
  bottom:25px;
  padding:11px 15px;
  background:rgba(255,255,255,.9);
  border:1px solid rgba(0,0,0,.05);
  border-radius:10px;
  font-size:13px;
  line-height:1.65;
  pointer-events:none;
}

#phaseName{
  font-weight:700;
}

#panel{
  padding:20px;
  overflow-y:auto;
  background:#faf9f6;
  border-left:1px solid #ddd8ce;
}

.section{
  margin-bottom:22px;
}

.sectionTitle{
  margin-bottom:10px;
  font-size:13px;
  font-weight:700;
}

video{
  display:block;
  width:100%;
  min-height:145px;
  object-fit:cover;
  background:#111;
  border-radius:8px;
  transform:scaleX(-1);
}

button{
  width:100%;
  margin:0 0 8px;
  padding:11px;
  border:0;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
}

button.dark{
  background:#222;
  color:#fff;
}

button.light{
  background:#e5e1da;
  color:#333;
}

button.gray{
  background:#d2cec5;
  color:#333;
}

button.test{
  background:#4b514e;
  color:#fff;
}

.status{
  padding:11px;
  background:#fff;
  border:1px solid #dedad1;
  border-radius:8px;
  font-size:12px;
  line-height:1.8;
}

label{
  display:block;
  margin:12px 0 5px;
  font-size:12px;
}

input[type="range"]{
  width:100%;
}

.meter{
  height:8px;
  margin-top:7px;
  overflow:hidden;
  background:#e1ddd5;
  border-radius:999px;
}

#cameraMeter,
#voiceMeter,
#chaosMeter{
  width:0%;
  height:100%;
  background:#373d3a;
  transition:width .07s linear;
}

.small{
  margin-top:8px;
  color:#777;
  font-size:11px;
  line-height:1.6;
}

.legend{
  margin-top:10px;
  padding:10px;
  background:#fff;
  border:1px solid #dedad1;
  border-radius:8px;
  font-size:12px;
  line-height:1.9;
}

.dot{
  display:inline-block;
  width:9px;
  height:9px;
  margin-right:6px;
  border-radius:50%;
}

.dot.white{background:#ccd5d5;}
.dot.green{background:#35ff73;}
.dot.yellow{background:#ffd52d;}
.dot.red{background:#ff3c34;}

</style>
</head>

<body>

<div id="app">

  <div id="stageWrap">

    <canvas id="stage"></canvas>

    <div id="title">
      <h1>《誤會機器》</h1>
      <p>順從 → 說話 → 資訊傳遞 → 群體偏差</p>
    </div>

    <div id="phaseBox">
      目前狀態：
      <span id="phaseName">順從</span>
      <br>
      <span id="phaseDescription">
        裝置正在等待觀者。
      </span>
    </div>

  </div>


  <aside id="panel">

    <!-- CAMERA -->

    <div class="section">

      <div class="sectionTitle">
        觀者位置
      </div>

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <br>

      <button
        id="cameraBtn"
        class="dark">
        開啟攝像頭
      </button>

      <div class="status">

        攝像頭：
        <b id="cameraState">未啟動</b>

        <br>

        觀者位置：
        <b id="viewerPosition">—</b>

        <br>

        動作量：
        <b>
          <span id="cameraPercent">0</span>%
        </b>

        <div class="meter">
          <div id="cameraMeter"></div>
        </div>

      </div>

    </div>


    <!-- MICROPHONE -->

    <div class="section">

      <div class="sectionTitle">
        聲音觸發
      </div>

      <button
        id="micBtn"
        class="dark">
        開啟麥克風
      </button>

      <button
        id="micStopBtn"
        class="light">
        停止麥克風
      </button>

      <button
        id="simulateVoiceBtn"
        class="test">
        模擬說話／開始傳遞
      </button>

      <div class="status">

        麥克風：
        <b id="micState">未啟動</b>

        <br>

        聲音強度：
        <b>
          <span id="voicePercent">0</span>%
        </b>

        <div class="meter">
          <div id="voiceMeter"></div>
        </div>

      </div>

    </div>


    <!-- SYSTEM -->

    <div class="section">

      <div class="sectionTitle">
        群體狀態
      </div>

      <div class="status">

        階段：
        <b id="modeText">順從</b>

        <br>

        資訊起點：
        <b id="sourceText">—</b>

        <br>

        混亂程度：
        <b>
          <span id="chaosPercent">0</span>%
        </b>

        <div class="meter">
          <div id="chaosMeter"></div>
        </div>

        <br>

        已接收資訊：
        <b>
          <span id="infectedCount">0</span> / 5
        </b>

      </div>

      <div class="legend">

        <span class="dot white"></span>
        待機

        <br>

        <span class="dot green"></span>
        拍到觀者

        <br>

        <span class="dot yellow"></span>
        觀者說話

        <br>

        <span class="dot red"></span>
        傳遞資訊

      </div>

    </div>


    <!-- SETTINGS -->

    <div class="section">

      <div class="sectionTitle">
        動作設定
      </div>

      <label>
        攝像頭敏感度：
        <span id="sensitivityValue">40</span>
      </label>

      <input
        id="sensitivitySlider"
        type="range"
        min="5"
        max="80"
        value="40"
      >


      <label>
        順從時最大偏角：
        <span id="followAngleValue">10</span>°
      </label>

      <input
        id="followAngleSlider"
        type="range"
        min="3"
        max="20"
        value="10"
      >


      <label>
        混亂時最大偏角：
        <span id="chaosAngleValue">28</span>°
      </label>

      <input
        id="chaosAngleSlider"
        type="range"
        min="10"
        max="90"
        value="28"
      >


      <label>
        說話觸發門檻：
        <span id="voiceThresholdValue">16</span>%
      </label>

      <input
        id="voiceThresholdSlider"
        type="range"
        min="5"
        max="50"
        value="16"
      >


      <label>
        靠近速度：
        <span id="transferTimeValue">1200</span> ms
      </label>

      <input
        id="transferTimeSlider"
        type="range"
        min="500"
        max="2500"
        step="100"
        value="1200"
      >


      <label>
        混亂成長速度：
        <span id="chaosSpeedValue">40</span>%
      </label>

      <input
        id="chaosSpeedSlider"
        type="range"
        min="10"
        max="100"
        value="40"
      >

    </div>


    <button
      id="resetBtn"
      class="gray">
      回到順從狀態
    </button>

  </aside>

</div>


<canvas
  id="cameraAnalysis"
  width="160"
  height="120"
  style="display:none">
</canvas>


<script>

/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("stage");

const ctx =
  canvas.getContext("2d");

const video =
  document.getElementById("video");

const analysisCanvas =
  document.getElementById("cameraAnalysis");

const analysisCtx =
  analysisCanvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );


/* =========================================================
   SYSTEM
========================================================= */

const DEVICE_COUNT = 5;

let W = 0;
let H = 0;

const devices = [];

let mode = "FOLLOW";

let chaos = 0;

let sourceIndex = -1;

let visited =
  new Set();

let pendingEdges = [];

let currentTransfer = null;


/*
  黃燈顯示時間。

  麥克風一偵測到說話，
  黃燈至少保持一小段時間，
  不會閃一下就直接消失。
*/

let speakingUntil = 0;


/*
  模擬說話按鈕用。

  先讓黃燈亮一段時間，
  再正式開始資訊傳遞。
*/

let manualTransferAt = 0;


/* =========================================================
   SETTINGS
========================================================= */

let followMaxAngle = 10;

let chaosMaxAngle = 28;

let voiceThreshold = .16;

let transferApproachTime = 1200;

let chaosGrowthSpeed = .40;


/* =========================================================
   CAMERA
========================================================= */

let cameraStream = null;

let cameraReady = false;

let previousCameraFrame = null;


const viewer = {

  present:false,

  x:.5,

  movement:0,

  absentTime:0,

  sensitivity:40

};


/* =========================================================
   MICROPHONE
========================================================= */

let micStream = null;

let audioContext = null;

let analyser = null;

let micSource = null;

let micBuffer = null;

let micReady = false;

let voiceLevel = 0;

let voiceHold = 0;


/* =========================================================
   DEVICE
========================================================= */

class Device{

  constructor(index){

    this.index = index;

    this.angle = 0;

    this.targetAngle = 0;

    this.info = 0;

    this.flash = 0;


    this.phase =
      Math.random() *
      Math.PI *
      2;


    this.followWeight =
      random(
        .97,
        1.03
      );


    this.chaosTarget = 0;

    this.nextChaosShift = 0;


    /* ===============================
       LIQUID INERTIA
    =============================== */

    this.lastAngle = 0;

    this.angularVelocity = 0;

    this.fluidOffset = 0;

    this.fluidVelocity = 0;


    /* ===============================
       PARTICLES
    =============================== */

    this.fluidSeeds = [];


    for(
      let i = 0;
      i < 80;
      i++
    ){

      this.fluidSeeds.push({

        phase:
          Math.random() *
          Math.PI *
          2,

        speed:
          random(
            .65,
            1.4
          ),

        size:
          random(
            .5,
            1.7
          ),

        offset:
          random(
            -1,
            1
          )

      });

    }

  }


  /* =======================================================
     DEVICE MOVEMENT
  ======================================================= */

  update(now,dt){

    this.flash =
      Math.max(
        0,
        this.flash -
        dt / 520
      );


    /* =====================================
       FOLLOW
    ===================================== */

    if(
      mode === "FOLLOW"
    ){

      const observerAngle =

        viewer.present
        ?
        (
          viewer.x -
          .5
        )
        *
        2
        *
        followMaxAngle
        :
        0;


      this.targetAngle =
        observerAngle *
        this.followWeight;


      this.angle =
        lerp(
          this.angle,
          this.targetAngle,
          .055
        );


      this.info =
        lerp(
          this.info,
          0,
          .035
        );


      return;

    }


    /* =====================================
       TRANSFER
    ===================================== */

    if(
      mode === "TRANSFER"
    ){

      /*
        正在傳資訊的兩支，
        由 updateTransfer 控制。
      */

      if(
        currentTransfer
        &&
        currentTransfer.from !== undefined
        &&
        currentTransfer.to !== undefined
        &&
        (
          this.index ===
          currentTransfer.from
          ||
          this.index ===
          currentTransfer.to
        )
      ){

        return;

      }


      if(
        now >
        this.nextChaosShift
      ){

        this.nextChaosShift =
          now +
          random(
            900,
            2100
          );


        this.chaosTarget =
          random(
            -chaosMaxAngle,
            chaosMaxAngle
          );

      }


      const followAngle =

        viewer.present
        ?
        (
          viewer.x -
          .5
        )
        *
        2
        *
        followMaxAngle
        :
        0;


      const obedience =
        1 -
        chaos * .55;


      this.targetAngle =

        followAngle *
        obedience

        +

        this.chaosTarget *
        chaos *
        .22;


      this.targetAngle =
        constrain(
          this.targetAngle,
          -chaosMaxAngle,
          chaosMaxAngle
        );


      this.angle =
        lerp(
          this.angle,
          this.targetAngle,
          .035 +
          chaos * .018
        );


      return;

    }


    /* =====================================
       CHAOS
    ===================================== */

    if(
      mode === "CHAOS"
    ){

      if(
        now >
        this.nextChaosShift
      ){

        this.nextChaosShift =
          now +
          random(
            900,
            2400
          );


        this.chaosTarget =
          random(
            -chaosMaxAngle,
            chaosMaxAngle
          );

      }


      let neighborAverage = 0;

      let neighborCount = 0;


      if(
        this.index > 0
      ){

        neighborAverage +=
          devices[
            this.index - 1
          ].angle;

        neighborCount++;

      }


      if(
        this.index <
        DEVICE_COUNT - 1
      ){

        neighborAverage +=
          devices[
            this.index + 1
          ].angle;

        neighborCount++;

      }


      if(
        neighborCount > 0
      ){

        neighborAverage /=
          neighborCount;

      }


      const followAngle =

        viewer.present
        ?
        (
          viewer.x -
          .5
        )
        *
        2
        *
        followMaxAngle
        :
        0;


      const obedience =
        Math.max(
          .15,
          1 - chaos
        );


      this.targetAngle =

        followAngle *
        obedience

        +

        this.chaosTarget *
        chaos *
        .38

        +

        neighborAverage *
        chaos *
        .10;


      this.targetAngle =
        constrain(
          this.targetAngle,
          -chaosMaxAngle,
          chaosMaxAngle
        );


      this.angle =
        lerp(
          this.angle,
          this.targetAngle,
          .024 +
          chaos * .018
        );

    }

  }


  /* =======================================================
     LIQUID PHYSICS
  ======================================================= */

  updateFluidPhysics(dt){

    const safeDt =
      Math.max(
        1,
        dt
      );


    const newAngularVelocity =

      (
        this.angle -
        this.lastAngle
      )

      /

      (
        safeDt /
        16.67
      );


    this.angularVelocity =
      lerp(
        this.angularVelocity,
        newAngularVelocity,
        .22
      );


    this.lastAngle =
      this.angle;


    /*
      裝置旋轉時，
      液體會有短暫慣性。
    */

    const targetOffset =
      constrain(
        -this.angularVelocity *
        .18,
        -.7,
        .7
      );


    this.fluidVelocity +=

      (
        targetOffset -
        this.fluidOffset
      )

      *
      .075;


    this.fluidVelocity *=
      .86;


    this.fluidOffset +=
      this.fluidVelocity;

  }

}


/* =========================================================
   RESET
========================================================= */

function resetSystem(){

  mode =
    "FOLLOW";


  chaos =
    0;


  sourceIndex =
    -1;


  visited =
    new Set();


  pendingEdges =
    [];


  currentTransfer =
    null;


  voiceHold =
    0;


  speakingUntil =
    0;


  manualTransferAt =
    0;


  devices.length =
    0;


  for(
    let i = 0;
    i < DEVICE_COUNT;
    i++
  ){

    devices.push(
      new Device(i)
    );

  }

}


resetSystem();


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

  const rect =
    canvas
    .parentElement
    .getBoundingClientRect();


  W =
    rect.width;


  H =
    rect.height;


  canvas.width =
    Math.round(
      W *
      devicePixelRatio
    );


  canvas.height =
    Math.round(
      H *
      devicePixelRatio
    );


  canvas.style.width =
    W + "px";


  canvas.style.height =
    H + "px";


  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

}


resizeCanvas();


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   LAYOUT
========================================================= */

function getBaseY(){

  return H * .73;

}


function getBodyHeight(){

  return Math.min(
    245,
    H * .34
  );

}


function getBodyWidth(){

  return Math.min(
    65,
    W * .055
  );

}


function getDeviceX(index){

  return mapValue(

    index,

    0,
    DEVICE_COUNT - 1,

    W * .16,
    W * .84

  );

}


/* =========================================================
   NEAREST DEVICE
========================================================= */

function getNearestDeviceIndex(){

  if(
    !viewer.present
  ){

    return 2;

  }


  return constrain(

    Math.round(

      viewer.x *
      (
        DEVICE_COUNT -
        1
      )

    ),

    0,
    DEVICE_COUNT - 1

  );

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

  try{

    cameraStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        video:{

          width:{
            ideal:640
          },

          height:{
            ideal:480
          },

          facingMode:
            "user"

        },

        audio:false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    cameraReady =
      true;


    previousCameraFrame =
      null;


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "已啟動";


    document
    .getElementById(
      "cameraBtn"
    )
    .textContent =
      "攝像頭已開啟";

  }

  catch(error){

    cameraReady =
      false;


    console.error(
      error
    );


    document
    .getElementById(
      "cameraState"
    )
    .textContent =
      "啟動失敗";

  }

}


document
.getElementById(
  "cameraBtn"
)
.addEventListener(
  "click",
  startCamera
);


/* =========================================================
   CAMERA ANALYSIS
========================================================= */

function analyzeCamera(){

  if(
    !cameraReady
    ||
    video.readyState < 2
  ){

    return;

  }


  analysisCtx.drawImage(

    video,

    0,
    0,

    analysisCanvas.width,
    analysisCanvas.height

  );


  const frame =
    analysisCtx
    .getImageData(

      0,
      0,

      analysisCanvas.width,
      analysisCanvas.height

    )
    .data;


  if(
    !previousCameraFrame
  ){

    previousCameraFrame =
      new Uint8ClampedArray(
        frame
      );

    return;

  }


  const width =
    analysisCanvas.width;


  const height =
    analysisCanvas.height;


  const threshold =
    mapValue(

      viewer.sensitivity,

      5,
      80,

      88,
      18

    );


  let changed = 0;

  let checked = 0;

  let xTotal = 0;


  for(
    let y = 0;
    y < height;
    y += 4
  ){

    for(
      let x = 0;
      x < width;
      x += 4
    ){

      const i =
        (
          y *
          width +
          x
        )
        *
        4;


      const diff =

        Math.abs(
          frame[i] -
          previousCameraFrame[i]
        )

        +

        Math.abs(
          frame[i+1] -
          previousCameraFrame[i+1]
        )

        +

        Math.abs(
          frame[i+2] -
          previousCameraFrame[i+2]
        );


      checked++;


      if(
        diff >
        threshold
      ){

        changed++;

        xTotal +=
          x;

      }

    }

  }


  previousCameraFrame =
    new Uint8ClampedArray(
      frame
    );


  const ratio =
    changed /
    Math.max(
      1,
      checked
    );


  viewer.movement =
    lerp(

      viewer.movement,

      constrain(
        ratio *
        3,
        0,
        1
      ),

      .3

    );


  if(
    changed > 0
  ){

    let averageX =
      xTotal /
      changed;


    /*
      畫面是鏡像顯示。
    */

    averageX =
      width -
      averageX;


    viewer.x =
      lerp(

        viewer.x,

        constrain(
          averageX /
          width,
          0,
          1
        ),

        .32

      );

  }


  if(
    ratio >
    .005
  ){

    viewer.present =
      true;


    viewer.absentTime =
      0;

  }

  else{

    viewer.absentTime +=
      100;


    if(
      viewer.absentTime >
      6500
    ){

      viewer.present =
        false;

    }

  }

}


/* =========================================================
   MICROPHONE
========================================================= */

async function startMicrophone(){

  try{

    if(
      micReady
    ){

      return;

    }


    micStream =

      await navigator
      .mediaDevices
      .getUserMedia({

        audio:{

          echoCancellation:true,

          noiseSuppression:false,

          autoGainControl:false

        },

        video:false

      });


    const AudioCtx =
      window.AudioContext
      ||
      window.webkitAudioContext;


    audioContext =
      new AudioCtx();


    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();

    }


    analyser =
      audioContext
      .createAnalyser();


    analyser.fftSize =
      1024;


    analyser.smoothingTimeConstant =
      .25;


    micBuffer =
      new Uint8Array(
        analyser.fftSize
      );


    micSource =
      audioContext
      .createMediaStreamSource(
        micStream
      );


    micSource.connect(
      analyser
    );


    micReady =
      true;


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "已啟動";


    document
    .getElementById(
      "micBtn"
    )
    .textContent =
      "麥克風已開啟";

  }

  catch(error){

    micReady =
      false;


    console.error(
      error
    );


    document
    .getElementById(
      "micState"
    )
    .textContent =
      "啟動失敗";

  }

}


async function stopMicrophone(){

  if(
    micStream
  ){

    micStream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );

  }


  micStream =
    null;


  if(
    micSource
  ){

    try{
      micSource.disconnect();
    }
    catch(error){}

  }


  if(
    audioContext
  ){

    try{
      await audioContext.close();
    }
    catch(error){}

  }


  micSource =
    null;

  audioContext =
    null;

  analyser =
    null;

  micBuffer =
    null;

  micReady =
    false;

  voiceLevel =
    0;

  voiceHold =

  )
  .textContent =

  .getElementById(

  )

}

/* =========================================================
   AUDIO
========================================================= */

function updateAudio(dt,now){

  if(
    !micReady
    ||
    !analyser
    ||
    !micBuffer
  ){

    voiceLevel =
      lerp(
        voiceLevel,
        0,
        .06
      );


    voiceHold = 0;

    return;

  }


  analyser
  .getByteTimeDomainData(
    micBuffer
  );


  let sum = 0;

  let count = 0;


  for(
    let i = 0;
    i < micBuffer.length;
    i += 4
  ){

    const value =
      (
        micBuffer[i] -
        128
      )
      /
      128;


    sum +=
      value *
      value;


    count++;

  }


  const rms =
    Math.sqrt(
      sum /
      Math.max(
        1,
        count
      )
    );


  const level =
    constrain(

      (
        rms -
        .006
      )
      *
      15,

      0,
      1

    );


  voiceLevel =
    lerp(
      voiceLevel,
      level,
      .32
    );


  /*
    只要有超過門檻，
    黃燈先亮起。
  */

  if(
    voiceLevel >
    voiceThreshold
  ){

    speakingUntil =
      now +
      600;

  }


  /*
    順從階段說話，
    累積一小段時間後開始傳遞。
  */

  if(
    mode ===
    "FOLLOW"
  ){

    if(
      voiceLevel >
      voiceThreshold
    ){

      voiceHold +=
        dt;

    }

    else{

      voiceHold =
        Math.max(
          0,
          voiceHold -
          dt *
          1.8
        );

    }


    if(
      voiceHold >
      360
    ){

      startInformationTransmission(
        now
      );


      voiceHold =
        0;

    }

  }

}

/* =========================================================
   START TRANSFER
========================================================= */

function startInformationTransmission(now){

  if(
    mode !==
    "FOLLOW"
  ){

    return;

  }


  mode =
    "TRANSFER";


  chaos =
    .06;


  sourceIndex =
    getNearestDeviceIndex();


  visited =
    new Set([
      sourceIndex
    ]);


  devices[
    sourceIndex
  ].info =
    1;


  devices[
    sourceIndex
  ].flash =
    1;


  buildPendingEdges();


  currentTransfer =
    null;


  scheduleNextTransfer(
    now,
    300
  );

}


/* =========================================================
   TRANSFER PATH
========================================================= */

function buildPendingEdges(){

  pendingEdges =
    [];


  for(
    let i = sourceIndex;
    i > 0;
    i--
  ){

    pendingEdges.push({

      from:i,

      to:i-1

    });

  }


  for(
    let i = sourceIndex;
    i <
    DEVICE_COUNT -
    1;
    i++
  ){

    pendingEdges.push({

      from:i,

      to:i+1

    });

  }

}


function chooseEligibleEdge(){

  const possible =
    pendingEdges.filter(

      edge =>

        visited.has(
          edge.from
        )

        &&

        !visited.has(
          edge.to
        )

    );


  if(
    possible.length ===
    0
  ){

    return null;

  }


  return possible[
    Math.floor(
      Math.random() *
      possible.length
    )
  ];

}


function scheduleNextTransfer(
  now,
  wait
){

  currentTransfer = {

    stage:
      "WAIT_NEXT",

    stageStart:
      now,

    waitDuration:
      wait

  };

}


function beginNextEdge(now){

  const edge =
    chooseEligibleEdge();


  if(
    !edge
  ){

    if(
      visited.size >=
      DEVICE_COUNT
    ){

      mode =
        "CHAOS";


      chaos =
        Math.max(
          chaos,
          .55
        );


      currentTransfer =
        null;

    }


    return;

  }


  currentTransfer = {

    from:
      edge.from,

    to:
      edge.to,

    stage:
      "APPROACH",

    stageStart:
      now,

    approachAngle:
      getMeetingAngle(
        edge.from,
        edge.to
      )

  };

}


/* =========================================================
   UPDATE TRANSFER
========================================================= */

function updateTransfer(now){

  if(
    mode !==
    "TRANSFER"
  ){

    return;

  }


  if(
    !currentTransfer
  ){

    beginNextEdge(
      now
    );

    return;

  }


  if(
    currentTransfer.stage ===
    "WAIT_NEXT"
  ){

    if(
      now -
      currentTransfer.stageStart
      >=
      currentTransfer.waitDuration
    ){

      beginNextEdge(
        now
      );

    }


    return;

  }


  const fromDevice =
    devices[
      currentTransfer.from
    ];


  const toDevice =
    devices[
      currentTransfer.to
    ];


  const elapsed =
    now -
    currentTransfer.stageStart;


  const direction =
    currentTransfer.from <
    currentTransfer.to
    ?
    1
    :
    -1;


  /* =====================================
     APPROACH
  ===================================== */

  if(
    currentTransfer.stage ===
    "APPROACH"
  ){

    const angle =
      currentTransfer
      .approachAngle;


    fromDevice.targetAngle =
      angle *
      direction;


    toDevice.targetAngle =
      angle *
      -direction;


    fromDevice.angle =
      lerp(
        fromDevice.angle,
        fromDevice.targetAngle,
        .045
      );


    toDevice.angle =
      lerp(
        toDevice.angle,
        toDevice.targetAngle,
        .045
      );


    if(
      elapsed >=
      transferApproachTime
    ){

      currentTransfer.stage =
        "CONTACT";


      currentTransfer.stageStart =
        now;


      toDevice.info =
        constrain(

          Math.max(

            toDevice.info,

            fromDevice.info *
            .82 +
            .12

          ),

          0,
          1

        );


      fromDevice.flash =
        1;


      toDevice.flash =
        1;


      visited.add(
        currentTransfer.to
      );


      chaos =
        constrain(
          chaos +
          .11,
          0,
          1
        );

    }


    return;

  }


  /* =====================================
     CONTACT
  ===================================== */

  if(
    currentTransfer.stage ===
    "CONTACT"
  ){

    const angle =
      currentTransfer
      .approachAngle;


    fromDevice.angle =
      lerp(
        fromDevice.angle,
        angle *
        direction,
        .10
      );


    toDevice.angle =
      lerp(
        toDevice.angle,
        angle *
        -direction,
        .10
      );


    if(
      elapsed >
      450
    ){

      currentTransfer.stage =
        "SEPARATE";


      currentTransfer.stageStart =
        now;

    }


    return;

  }


  /* =====================================
     SEPARATE
  ===================================== */

  if(
    currentTransfer.stage ===
    "SEPARATE"
  ){

    const followAngle =

      viewer.present
      ?
      (
        viewer.x -
        .5
      )
      *
      2
      *
      followMaxAngle
      :
      0;


    fromDevice.angle =
      lerp(
        fromDevice.angle,
        followAngle,
        .035
      );


    toDevice.angle =
      lerp(
        toDevice.angle,
        followAngle,
        .035
      );


    if(
      elapsed >
      650
    ){

      pendingEdges =
        pendingEdges.filter(

          edge =>

            !(
              edge.from ===
              currentTransfer.from
              &&
              edge.to ===
              currentTransfer.to
            )

        );


      scheduleNextTransfer(

        now,

        random(
          250,
          800
        )

      );

    }

  }

}


/* =========================================================
   MEETING ANGLE
========================================================= */

function getMeetingAngle(
  aIndex,
  bIndex
){

  const distance =
    Math.abs(

      getDeviceX(
        aIndex
      )

      -

      getDeviceX(
        bIndex
      )

    );


  const bodyHeight =
    getBodyHeight();


  const ratio =
    constrain(

      distance /
      (
        bodyHeight *
        3
      ),

      .03,
      .28

    );


  const radians =
    Math.asin(
      ratio
    );


  return constrain(

    radians *
    180 /
    Math.PI *
    .85,

    5,
    14

  );

}


/* =========================================================
   CHAOS
========================================================= */

function updateChaos(dt){

  if(
    mode ===
    "TRANSFER"
  ){

    chaos =
      constrain(

        chaos

        +

        dt *
        .000006 *
        chaosGrowthSpeed,

        0,
        .60

      );

  }


  if(
    mode ===
    "CHAOS"
  ){

    chaos =
      constrain(

        chaos

        +

        dt *
        .000018 *
        chaosGrowthSpeed,

        0,
        1

      );

  }

}

/* =========================================================
   DEVICE
========================================================= */

function drawDevice(
  device,
  now
){

  const x =
    getDeviceX(
      device.index
    );


  const baseY =
    getBaseY();


  const bodyHeight =
    getBodyHeight();


  const bodyWidth =
    getBodyWidth();


  const angleRad =
    device.angle *
    Math.PI /
    180;


  ctx.save();


  ctx.translate(
    x,
    baseY
  );


  /* SHADOW */

  ctx.fillStyle =
    "rgba(0,0,0,.09)";


  ctx.beginPath();


  ctx.ellipse(

    5,
    12,

    bodyWidth *
    .68,

    7,

    0,
    0,

    Math.PI *
    2

  );


  ctx.fill();


  /* BASE */

  ctx.fillStyle =
    "#171817";


  ctx.beginPath();


  ctx.roundRect(

    -bodyWidth *
    .63,

    -5,

    bodyWidth *
    1.26,

    18,

    7

  );


  ctx.fill();


  /* PIVOT */

  ctx.fillStyle =
    "#353936";


  ctx.beginPath();


  ctx.arc(

    0,
    0,

    8,

    0,

    Math.PI *
    2

  );


  ctx.fill();


  ctx.fillStyle =
    "#101110";


  ctx.beginPath();


  ctx.arc(

    0,
    0,

    4,

    0,

    Math.PI *
    2

  );


  ctx.fill();


  /*
    整支裝置旋轉。
  */

  ctx.rotate(
    angleRad
  );


  /* BODY */

  const bodyGradient =
    ctx.createLinearGradient(

      -bodyWidth / 2,
      0,

      bodyWidth / 2,
      0

    );


  bodyGradient.addColorStop(
    0,
    "#050605"
  );


  bodyGradient.addColorStop(
    .45,
    "#2b2d2c"
  );


  bodyGradient.addColorStop(
    1,
    "#070807"
  );


  ctx.fillStyle =
    bodyGradient;


  ctx.shadowBlur =
    8;


  ctx.shadowColor =
    "rgba(0,0,0,.20)";


  ctx.beginPath();


  ctx.roundRect(

    -bodyWidth / 2,

    -bodyHeight,

    bodyWidth,

    bodyHeight,

    7

  );


  ctx.fill();


  ctx.shadowBlur =
    0;


  /* LED */

  drawLED(

    device,
    now,

    bodyWidth,
    bodyHeight

  );


  /* CAMERA */

  const cameraY =
    -bodyHeight *
    .73;


  ctx.fillStyle =
    "#050706";


  ctx.beginPath();


  ctx.arc(

    0,
    cameraY,

    9,

    0,
    Math.PI *
    2

  );


  ctx.fill();


  ctx.strokeStyle =
    "#4a504d";


  ctx.lineWidth =
    1;


  ctx.beginPath();


  ctx.arc(

    0,
    cameraY,

    9,

    0,
    Math.PI *
    2

  );


  ctx.stroke();


  ctx.fillStyle =
    "#020607";


  ctx.beginPath();


  ctx.arc(

    0,
    cameraY,

    5.5,

    0,
    Math.PI *
    2

  );


  ctx.fill();


  ctx.fillStyle =
    "rgba(100,155,180,.48)";


  ctx.beginPath();


  ctx.arc(

    -1.5,

    cameraY -
    1.7,

    1.7,

    0,

    Math.PI *
    2

  );


  ctx.fill();


  /* SCREEN */

  const screenW =
    bodyWidth *
    .70;


  const screenH =
    bodyHeight *
    .31;


  const screenX =
    -screenW /
    2;


  const screenY =
    -bodyHeight *
    .56;


  ctx.fillStyle =
    "#020405";


  ctx.beginPath();


  ctx.roundRect(

    screenX,
    screenY,

    screenW,
    screenH,

    3

  );


  ctx.fill();


  ctx.strokeStyle =
    "#303635";


  ctx.lineWidth =
    1;


  ctx.stroke();


  ctx.save();


  ctx.beginPath();


  ctx.roundRect(

    screenX +
    3,

    screenY +
    3,

    screenW -
    6,

    screenH -
    6,

    2

  );


  ctx.clip();


  drawFluidScreen(

    device,
    now,

    screenX +
    3,

    screenY +
    3,

    screenW -
    6,

    screenH -
    6

  );


  ctx.restore();


  ctx.restore();

}


/* =========================================================
   LED STATE SYSTEM
========================================================= */

function drawLED(
  device,
  now,
  width,
  height
){

  /*
    LED 規則：

    待機       → 白
    看到觀者   → 綠
    開始說話   → 黃
    傳遞資訊   → 紅

    優先：
    紅 > 黃 > 綠 > 白
  */


  const breath =

    (
      Math.sin(
        now *
        .0025 +
        device.phase
      )
      +
      1
    )

    /
    2;


  let r = 190;
  let g = 210;
  let b = 215;

  let brightness =
    .16 +
    breath *
    .08;


  /* =====================================
     GREEN
     拍到觀者
  ===================================== */

  if(
    viewer.present
  ){

    r = 45;
    g = 255;
    b = 105;


    brightness =
      .55 +
      breath *
      .18;

  }


  /* =====================================
     YELLOW
     說話

     只讓離觀者最近的那一支變黃。
  ===================================== */

  const speaking =
    now <
    speakingUntil;


  const speakingDevice =
    getNearestDeviceIndex();


  if(
    speaking
    &&
    device.index ===
    speakingDevice
    &&
    mode ===
    "FOLLOW"
  ){

    r = 255;
    g = 215;
    b = 35;


    brightness =
      constrain(

        .72 +
        voiceLevel *
        .55,

        .72,
        1

      );

  }


  /* =====================================
     RED
     傳資訊

     只有正在交換的兩支紅。
  ===================================== */

  let transferring =
    false;


  if(
    mode ===
    "TRANSFER"

    &&

    currentTransfer

    &&

    currentTransfer.from !== undefined

    &&

    currentTransfer.to !== undefined

    &&

    currentTransfer.stage !==
    "WAIT_NEXT"
  ){

    if(
      device.index ===
      currentTransfer.from

      ||

      device.index ===
      currentTransfer.to
    ){

      transferring =
        true;

    }

  }


  if(
    transferring
  ){

    r = 255;
    g = 45;
    b = 40;


    const pulse =

      (
        Math.sin(
          now *
          .013
        )
        +
        1
      )

      /
      2;


    brightness =
      .68 +
      pulse *
      .32;

  }


  /*
    碰到的一瞬間更亮。
  */

  brightness +=
    device.flash *
    .20;


  brightness =
    constrain(
      brightness,
      .10,
      1
    );


  /* DARK BASE */

  ctx.fillStyle =
    "rgba(45,50,50,.35)";


  ctx.fillRect(

    -width /
    2 +
    3,

    -height +
    9,

    width -
    6,

    5

  );


  /* GLOW */

  ctx.shadowBlur =
    5 +
    brightness *
    18;


  ctx.shadowColor =

    `rgba(
      ${r},
      ${g},
      ${b},
      ${brightness}
    )`;


  ctx.fillStyle =

    `rgba(
      ${r},
      ${g},
      ${b},
      ${brightness}
    )`;


  ctx.fillRect(

    -width /
    2 +
    3,

    -height +
    9,

    width -
    6,

    4

  );


  ctx.shadowBlur =
    0;

}


/* =========================================================
   GRAVITY LIQUID
========================================================= */

function drawFluidScreen(
  device,
  now,
  x,
  y,
  w,
  h
){

  /* BACKGROUND */

  const bg =
    ctx.createLinearGradient(

      x,
      y,

      x,
      y +
      h

    );


  bg.addColorStop(
    0,
    "#071653"
  );


  bg.addColorStop(
    .5,
    "#06144a"
  );


  bg.addColorStop(
    1,
    "#030c32"
  );


  ctx.fillStyle =
    bg;


  ctx.fillRect(
    x,
    y,
    w,
    h
  );


  const info =
    constrain(
      device.info,
      0,
      1
    );


  const motionStrength =
    constrain(

      Math.abs(
        device.angularVelocity
      )

      *
      1.7,

      0,
      1

    );


  const turbulence =

    mode ===
    "FOLLOW"

    ?

    .015

    :

    chaos *
    (
      .10 +
      info *
      .42
    );


  /* =====================================
     WORLD GRAVITY
  ===================================== */

  const angleRad =
    device.angle *
    Math.PI /
    180;


  /*
    裝置直立：
    液體往螢幕下方。

    裝置轉向：
    重力方向會相對改變。
  */

  let gravityX =
    Math.sin(
      angleRad
    );


  let gravityY =
    Math.cos(
      angleRad
    );


  /*
    旋轉慣性。
  */

  gravityX +=

    -device.angularVelocity *
    .11;


  gravityX +=

    device.fluidOffset *
    .10;


  const gravityLength =
    Math.sqrt(

      gravityX *
      gravityX

      +

      gravityY *
      gravityY

    )
    ||
    1;


  gravityX /=
    gravityLength;


  gravityY /=
    gravityLength;


  /*
    液面的切線。
  */

  const tangentX =
    gravityY;


  const tangentY =
    -gravityX;


  /* =====================================
     LIQUID VOLUME
  ===================================== */

  const fillAmount =
    constrain(

      .34 +
      info *
      .24,

      .26,
      .65

    );


  const threshold =
    lerp(

      .52,

      -.30,

      fillAmount

    );


  const cellSize =
    2;


  const time =
    now *
    .001;


  /* =====================================
     MAIN LIQUID
  ===================================== */

  for(
    let py = 0;
    py < h;
    py += cellSize
  ){

    for(
      let px = 0;
      px < w;
      px += cellSize
    ){

      const nx =
        (
          px /
          w
        )
        *
        2
        -
        1;


      const ny =
        (
          py /
          h
        )
        *
        2
        -
        1;


      const gravityDepth =

        nx *
        gravityX

        +

        ny *
        gravityY;


      const tangentPosition =

        nx *
        tangentX

        +

        ny *
        tangentY;


      /*
        表面小波浪。
      */

      let surfaceWave =

        Math.sin(

          tangentPosition *
          7

          +

          time *
          2

          +

          device.phase

        )

        *
        (
          .018

          +

          turbulence *
          .028
        );


      /*
        裝置移動越快，
        液面晃越明顯。
      */

      surfaceWave +=

        Math.sin(

          tangentPosition *
          15

          -

          time *
          4.2

        )

        *
        motionStrength

        *
        .025;


      const insideLiquid =

        gravityDepth

        >

        threshold

        +

        surfaceWave;


      if(
        !insideLiquid
      ){

        continue;

      }


      const depth =
        constrain(

          (
            gravityDepth

            -

            threshold

            -

            surfaceWave
          )

          *
          2.1,

          0,
          1

        );


      const alpha =
        .62 +
        depth *
        .32;


      const green =
        Math.round(
          220 +
          depth *
          28
        );


      const blue =
        Math.round(
          252 -
          depth *
          20
        );


      ctx.fillStyle =

        `rgba(
          35,
          ${green},
          ${blue},
          ${alpha}
        )`;


      ctx.fillRect(

        x +
        px,

        y +
        py,

        cellSize,
        cellSize

      );


      /*
        微小電子粒子。
      */

      const sparkle =
        pseudoLiquidNoise(

          px,
          py,

          device.index,

          Math.floor(
            now /
            100
          )

        );


      if(
        sparkle >
        .925
      ){

        ctx.fillStyle =

          `rgba(
            175,
            255,
            255,
            ${.12 + depth*.32}
          )`;


        ctx.fillRect(

          x +
          px,

          y +
          py,

          1,
          1

        );

      }

    }

  }


  /* =====================================
     SURFACE PARTICLES
  ===================================== */

  const surfaceParticleCount =
    Math.floor(

      20

      +

      info *
      25

      +

      motionStrength *
      14

    );


  for(
    let i = 0;
    i < surfaceParticleCount;
    i++
  ){

    const t =
      (
        i /
        Math.max(
          1,
          surfaceParticleCount -
          1
        )
      )
      *
      2
      -
      1;


    let localX =

      tangentX *
      t

      +

      gravityX *
      threshold;


    let localY =

      tangentY *
      t

      +

      gravityY *
      threshold;


    const wave =

      Math.sin(

        t *
        8

        +

        time *
        2.1

        +

        device.phase

      )

      *
      (
        .025

        +

        motionStrength *
        .025
      );


    localX +=

      gravityX *
      wave;


    localY +=

      gravityY *
      wave;


    const randomDepth =
      Math.abs(

        Math.sin(

          i *
          19.73

          +

          device.phase

        )

      )
      *
      .10;


    localX +=

      gravityX *
      randomDepth;


    localY +=

      gravityY *
      randomDepth;


    const screenX =

      x

      +

      (
        localX +
        1
      )

      *
      .5

      *
      w;


    const screenY =

      y

      +

      (
        localY +
        1
      )

      *
      .5

      *
      h;


    if(
      screenX <
      x

      ||

      screenX >
      x + w

      ||

      screenY <
      y

      ||

      screenY >
      y + h
    ){

      continue;

    }


    const size =
      i %
      4 ===
      0
      ?
      2
      :
      1;


    ctx.fillStyle =

      `rgba(
        165,
        255,
        255,
        ${.30 + info*.30}
      )`;


    ctx.fillRect(

      screenX,
      screenY,

      size,
      size

    );

  }


  /* =====================================
     INERTIA PARTICLES
  ===================================== */

  const inertialCount =
    Math.floor(
      motionStrength *
      18
    );


  for(
    let i = 0;
    i < inertialCount;
    i++
  ){

    const seed =
      device
      .fluidSeeds[
        i %
        device.fluidSeeds.length
      ];


    const tangentPosition =
      seed.offset;


    const depth =
      .10
      +
      Math.abs(
        Math.sin(
          seed.phase
        )
      )
      *
      .40;


    let localX =

      tangentX *
      tangentPosition

      +

      gravityX *
      (
        threshold +
        depth
      );


    let localY =

      tangentY *
      tangentPosition

      +

      gravityY *
      (
        threshold +
        depth
      );


    localX +=

      -Math.sign(
        device.angularVelocity
      )

      *
      motionStrength

      *
      .07;


    const screenX =

      x

      +

      (
        localX +
        1
      )

      *
      .5

      *
      w;


    const screenY =

      y

      +

      (
        localY +
        1
      )

      *
      .5

      *
      h;


    if(
      screenX < x
      ||
      screenX > x + w
      ||
      screenY < y
      ||
      screenY > y + h
    ){

      continue;

    }


    ctx.fillStyle =

      `rgba(
        190,
        255,
        255,
        ${.15 + motionStrength*.30}
      )`;


    ctx.fillRect(

      screenX,
      screenY,

      2 +
      motionStrength *
      3,

      1

    );

  }


  /*
    接觸瞬間螢幕亮一下。
  */

  if(
    device.flash >
    0
  ){

    ctx.fillStyle =

      `rgba(
        170,
        255,
        255,
        ${device.flash*.14}
      )`;


    ctx.fillRect(
      x,
      y,
      w,
      h
    );

  }

}


/* =========================================================
   CONTACT VISUAL
========================================================= */

function drawTransferContact(now){

  if(
    !currentTransfer

    ||

    currentTransfer.stage !==
    "CONTACT"
  ){

    return;

  }


  const pointA =
    getTopPoint(
      currentTransfer.from
    );


  const pointB =
    getTopPoint(
      currentTransfer.to
    );


  const midX =
    (
      pointA.x +
      pointB.x
    )
    /
    2;


  const midY =
    (
      pointA.y +
      pointB.y
    )
    /
    2;


  const pulse =
    (
      Math.sin(
        now *
        .025
      )
      +
      1
    )
    /
    2;


  ctx.shadowBlur =
    12 +
    pulse *
    8;


  ctx.shadowColor =
    "rgba(255,70,60,.65)";


  ctx.fillStyle =

    `rgba(
      255,
      90,
      70,
      ${.35 + pulse*.40}
    )`;


  ctx.beginPath();


  ctx.arc(

    midX,
    midY,

    3 +
    pulse *
    3,

    0,
    Math.PI *
    2

  );


  ctx.fill();


  ctx.shadowBlur =
    0;


  /*
    紅色資訊粒子。
  */

  for(
    let i = 0;
    i < 10;
    i++
  ){

    const t =
      fract(

        i /
        10

        +

        now *
        .0012

      );


    const px =
      lerp(
        pointA.x,
        pointB.x,
        t
      );


    const py =
      lerp(
        pointA.y,
        pointB.y,
        t
      )
      +
      Math.sin(
        t *
        Math.PI *
        3
      )
      *
      3;


    ctx.fillStyle =
      "rgba(255,75,65,.65)";


    ctx.fillRect(
      px,
      py,
      2,
      2
    );

  }

}


/* =========================================================
   TOP POINT
========================================================= */

function getTopPoint(index){

  const device =
    devices[index];


  const angle =
    device.angle *
    Math.PI /
    180;


  const height =
    getBodyHeight();


  return{

    x:

      getDeviceX(
        index
      )

      +

      Math.sin(
        angle
      )

      *
      height,


    y:

      getBaseY()

      -

      Math.cos(
        angle
      )

      *
      height

  };

}


/* =========================================================
   UI
========================================================= */

function updateUI(now){

  let viewerText =
    "—";


  if(
    viewer.present
  ){

    if(
      viewer.x <
      .32
    ){

      viewerText =
        "左側";

    }

    else if(
      viewer.x >
      .68
    ){

      viewerText =
        "右側";

    }

    else{

      viewerText =
        "中央";

    }

  }


  document
  .getElementById(
    "viewerPosition"
  )
  .textContent =
    viewerText;


  const cameraPercent =
    Math.round(

      constrain(
        viewer.movement *
        4,
        0,
        1
      )

      *
      100

    );


  document
  .getElementById(
    "cameraPercent"
  )
  .textContent =
    cameraPercent;


  document
  .getElementById(
    "cameraMeter"
  )
  .style.width =
    cameraPercent +
    "%";


  const voicePercent =
    Math.round(
      voiceLevel *
      100
    );


  document
  .getElementById(
    "voicePercent"
  )
  .textContent =
    voicePercent;


  document
  .getElementById(
    "voiceMeter"
  )
  .style.width =
    voicePercent +
    "%";


  const chaosPercent =
    Math.round(
      chaos *
      100
    );


  document
  .getElementById(
    "chaosPercent"
  )
  .textContent =
    chaosPercent;


  document
  .getElementById(
    "chaosMeter"
  )
  .style.width =
    chaosPercent +
    "%";


  document
  .getElementById(
    "infectedCount"
  )
  .textContent =
    visited.size;


  document
  .getElementById(
    "sourceText"
  )
  .textContent =

    sourceIndex >= 0
    ?
    `第 ${sourceIndex + 1} 支`
    :
    "—";


  let modeText =
    "順從";


  let description =
    "裝置正在等待觀者。";


  if(
    mode ===
    "FOLLOW"
    &&
    viewer.present
  ){

    description =
      "裝置已偵測到觀者，LED 變成綠色並開始跟隨。";

  }


  if(
    mode ===
    "FOLLOW"
    &&
    now <
    speakingUntil
  ){

    modeText =
      "接收聲音";


    description =
      "觀者正在說話，最近的裝置變成黃色。";

  }


  if(
    mode ===
    "TRANSFER"
  ){

    modeText =
      "資訊傳遞";


    description =
      "正在交換資訊的裝置變成紅色。";

  }


  if(
    mode ===
    "CHAOS"
  ){

    modeText =
      "群體偏差";


    description =
      "資訊已擴散到群體，裝置開始產生不同反應。";

  }


  document
  .getElementById(
    "modeText"
  )
  .textContent =
    modeText;


  document
  .getElementById(
    "phaseName"
  )
  .textContent =
    modeText;


  document
  .getElementById(
    "phaseDescription"
  )
  .textContent =
    description;

}

/* =========================================================
   HELPERS
========================================================= */

function random(
  min,
  max
){

  if(
    max === undefined
  ){

    max =
      min;

    min =
      0;

  }


  return(
    Math.random() *
    (
      max -
      min
    )
    +
    min
  );

}


function lerp(
  a,
  b,
  t
){

  return(
    a +
    (
      b -
      a
    )
    *
    t
  );

}


function constrain(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function mapValue(
  value,
  inMin,
  inMax,
  outMin,
  outMax
){

  return(
    (
      value -
      inMin
    )
    /
    (
      inMax -
      inMin
    )
    *
    (
      outMax -
      outMin
    )
    +
    outMin
  );

}


function fract(value){

  return(
    value -
    Math.floor(
      value
    )
  );

}


function pseudoLiquidNoise(
  x,
  y,
  deviceIndex,
  frame
){

  const value =

    Math.sin(

      x *
      12.9898

      +

      y *
      78.233

      +

      deviceIndex *
      37.719

      +

      frame *
      .137

    )

    *
    43758.5453;


  return(
    value -
    Math.floor(
      value
    )
  );

}


/* =========================================================
   LOOP
========================================================= */

let previousTime =
  performance.now();


let lastCameraAnalysis =
  0;


function animate(now){

  const dt =
    Math.min(
      50,
      now -
      previousTime
    );


  previousTime =
    now;


  /* =====================================
     MANUAL VOICE
  ===================================== */

  if(
    manualTransferAt >
    0

    &&

    now >=
    manualTransferAt

    &&

    mode ===
    "FOLLOW"
  ){

    manualTransferAt =
      0;


    startInformationTransmission(
      now
    );

  }


  /* CAMERA */

  if(
    now -
    lastCameraAnalysis >
    100
  ){

    analyzeCamera();


    lastCameraAnalysis =
      now;

  }


  /* AUDIO */

  updateAudio(
    dt,
    now
  );


  /* TRANSFER */

  updateTransfer(
    now
  );


  /* CHAOS */

  updateChaos(
    dt
  );


  /* DEVICE + LIQUID */

  devices.forEach(
    device => {

      device.update(
        now,
        dt
      );


      device.updateFluidPhysics(
        dt
      );

    }
  );


  /* DRAW */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawTable();


  devices.forEach(
    device => {

      drawDevice(
        device,
        now
      );

    }
  );


  drawTransferContact(
    now
  );


  updateUI(
    now
  );


  requestAnimationFrame(
    animate
  );

}


requestAnimationFrame(
  animate
);
